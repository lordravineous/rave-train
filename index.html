<script>
'use strict';
// ============================================================
//  RAVE TRAIN — find your friends at the festival
// ============================================================
let VW = 480, VH = 270;                   // logical pixel resolution (dynamic!)
const PIX = 2;                            // internal supersample — doubles sprite pixel density
const FOGS = 4;                           // fog canvas downscale (chunky edges)
const TOUCH = 'ontouchstart' in window;   // phones & tablets get on-screen buttons
// THE LAST SHUTTLE global leaderboard — paste your Cloudflare Worker URL here.
// Leave empty to disable all leaderboard features. See leaderboard/DEPLOY.md.
const LB_URL = '';                        // e.g. 'https://rave-train-leaderboard.yourname.workers.dev'
const LB_QUALIFY = 18;                    // full bus or nothing
const cv = document.getElementById('screen');
const cx = cv.getContext('2d');
const fogC = document.createElement('canvas');
const fx = fogC.getContext('2d');
// post-processing scratch canvases (mysterious baggy visual effects)
const postC=document.createElement('canvas'), px2=postC.getContext('2d');
const tintC=document.createElement('canvas'), tx2=tintC.getContext('2d');
const prevC=document.createElement('canvas'), pv2=prevC.getContext('2d');
const smallC=document.createElement('canvas'), sm2=smallC.getContext('2d');

// portrait phones get a tall narrow view — everything renders bigger & clearer
function computeView(){
  const ar = innerWidth/Math.max(1,innerHeight);
  if(ar < 1){ VW=280; VH=Math.max(400, Math.min(640, Math.round(280/ar))); }
  else      { VW=480; VH=270; }
  cv.width=VW*PIX; cv.height=VH*PIX;
  cx.imageSmoothingEnabled=false;
  fogC.width=Math.ceil(VW/FOGS); fogC.height=Math.ceil(VH/FOGS);
  postC.width=tintC.width=prevC.width=VW*PIX;
  postC.height=tintC.height=prevC.height=VH*PIX;
  smallC.width=Math.ceil(VW*PIX/4); smallC.height=Math.ceil(VH*PIX/4);
}
function fit(){
  computeView();
  let s = Math.min(innerWidth/VW, innerHeight/VH);
  if(s>=2) s=Math.floor(s);   // crisp integer scale on big screens, full-bleed fractional on phones
  cv.style.width = VW*s+'px'; cv.style.height = VH*s+'px';
}
addEventListener('resize', fit);
addEventListener('orientationchange', ()=>setTimeout(fit,150));
fit();

// ---------- helpers ----------
const TAU = Math.PI*2;
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri  = (a,b)=>Math.floor(rnd(a,b+1));
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function angTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x);}
function angDiff(a,b){let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;}
const choice=a=>a[Math.floor(Math.random()*a.length)];

// ---------- characters (pixel ravers) ----------
const CHARS = [
 {name:'KEVIN NGUYEN', skin:'#e3b486', hair:'#241812', top:'#16161e', legs:'#23232f', glow:'#39ff14', style:'part'},
 {name:'TIFFANY TAN', skin:'#e3b486', hair:'#f7d774', top:'#eef2f8', legs:'#2456c9', glow:'#00e5ff', style:'long'},
 {name:'TECHNO TESS',skin:'#ffe0c2', hair:'#00ff9f', top:'#0d0d12', legs:'#3a1b4f', glow:'#ff2d95', style:'bob'},
 {name:'GLOW JOE',   skin:'#8d5524', hair:'#2b1a0e', top:'#f5d300', legs:'#143c2b', glow:'#ff6d00', style:'afro'},
 {name:'KANDI KAI',  skin:'#f1c27d', hair:'#b14aed', top:'#ff4f9a', legs:'#11324d', glow:'#f5d300', style:'spiky'},
 {name:'DJ DOT',     skin:'#e0ac69', hair:'#00bcd4', top:'#7c3aed', legs:'#26203b', glow:'#2de2e6', style:'buns'},
 {name:'PIXIE PIP',  skin:'#ffe6d5', hair:'#2de2e6', top:'#ff2d95', legs:'#1c2740', glow:'#f5d300', style:'pixie'},
 {name:'MC FLOW',    skin:'#6f4428', hair:'#15100c', top:'#39ff14', legs:'#23232f', glow:'#ff2d95', style:'dreads'},
 {name:'CYBER SUE',  skin:'#f5d7b8', hair:'#c084fc', top:'#0ea5b7', legs:'#312244', glow:'#39ff14', style:'long', visor:'#00e5ff'},
 {name:'DISCO DAN',  skin:'#d9a066', hair:'#4a2c17', top:'#f59e0b', legs:'#3f1d38', glow:'#00e5ff', style:'perm', shades:true},
 {name:'HARD HANK',  skin:'#e8b88a', hair:'#7c4a1e', top:'#111118', legs:'#26203b', glow:'#ff4f4f', style:'buzz', beard:true},
 {name:'LUNA',       skin:'#ffe0c2', hair:'#8ab4ff', top:'#1b1b2e', legs:'#4a1d4f', glow:'#ff6d00', style:'twin'},
];

// which way is an angle pointing? → sprite facing
function dirFacing(a){ const c=Math.cos(a),s=Math.sin(a);
  return Math.abs(c)>Math.abs(s) ? (c>0?'right':'left') : (s>0?'down':'up'); }

// ---- hi-density anime raver: art pixels are HALF a world unit ----
// 4 facings: down (front), up (back), left/right (side profiles, mirrored).
// anchored at feet centre. frame: 0/1 step. o = {facing, dim, armsUp}
function drawRaver(g, wx, wy, pal, frame, o={}){
  const X=Math.round(wx*2)/2, Y=Math.round(wy*2)/2;
  const face=o.facing || (o.flipX?'left':'down');
  const side=face==='left'||face==='right', mir=face==='left', back=face==='up';
  const u=0.5;
  const P=(x,y,w,h,c)=>{ g.fillStyle=o.dim?shade(c,o.dim):c;
    g.fillRect(X+(mir?(-x-w):x)*u, Y+y*u, w*u, h*u); };
  const up=(o.armsUp!==undefined)?o.armsUp:!!frame;
  const SK=pal.skin,H=pal.hair,TP=pal.top,LG=pal.legs,GL=pal.glow,DK='#0d0b16',EY='#241a38';
  if(side){
    // striding legs + shoes
    if(frame){ P(-5,-6,3,5,LG); P(2,-6,3,6,LG); P(-5,-2,4,2,DK); P(2,0,4,2,DK); }
    else     { P(-4,-6,3,6,LG); P(1,-6,3,5,LG); P(-4,0,4,2,DK); P(1,-2,4,2,DK); }
    // body
    P(-4,-13,8,7,TP);
    // near arm only
    if(up){ P(0,-17,3,4,TP); P(0,-19,3,2,SK); P(0,-24,3,5,GL); }
    else  { P(-1,-12,3,5,TP); P(-1,-7,3,2,SK); }
    // head in profile
    P(-7,-26,14,12,SK);
    if(!o.faceless){
      P(2,-22,3,4,EY); P(2,-22,1,2,'#fff');   // one big eye
      P(7,-21,1,3,SK);                        // wee nose
      P(4,-17,2,1,'#c4606a');
      P(-1,-19,2,2,'#e89a9a');                // blush
      if(pal.beard){ P(1,-18,6,3,'#5a3a22'); }
      if(pal.shades){ P(1,-22,5,3,'#15151c'); }
      if(pal.visor){ P(0,-23,8,4,pal.visor); P(1,-22,5,1,'#ffffff'); }
    }
  } else {
    // legs + shoes (little step bounce)
    P(-4,-6,3,frame?5:6,LG); P(1,-6,3,frame?6:5,LG);
    P(-4,frame?-2:-1,3,2,DK); P(1,frame?-1:-2,3,2,DK);
    // body
    P(-5,-13,10,7,TP);
    if(!back) P(-1,-11,2,2,GL);               // little logo on the tee
    // arms: sleeves + hands (+ glowsticks when raving)
    if(up){ P(-7,-17,2,4,TP);  P(5,-17,2,4,TP);
            P(-7,-19,2,2,SK);  P(5,-19,2,2,SK);
            P(-7,-24,2,5,GL);  P(5,-24,2,5,GL); }
    else  { P(-7,-12,2,5,TP);  P(5,-12,2,5,TP);
            P(-7,-7,2,2,SK);   P(5,-7,2,2,SK); }
    // BIG anime head
    P(-8,-26,16,12,SK);
    if(back){ P(-8,-26,16,12,H); }
    else if(!o.faceless){
      P(-5,-22,3,4,EY);  P(2,-22,3,4,EY);     // big sparkly eyes
      P(-5,-22,1,2,'#fff'); P(2,-22,1,2,'#fff');
      P(-1,-17,2,1,'#c4606a');                // mouth
      P(-8,-19,2,2,'#e89a9a'); P(6,-19,2,2,'#e89a9a'); // blush
      if(pal.beard){ P(-5,-18,10,3,'#5a3a22'); P(-1,-17,2,1,'#3d2614'); }
      if(pal.shades){ P(-6,-22,5,3,'#15151c'); P(1,-22,5,3,'#15151c'); P(-1,-21,2,1,'#15151c'); }
      if(pal.visor){ P(-6,-23,12,4,pal.visor); P(-5,-22,4,1,'#ffffff'); }
    }
  }
  hairDraw(P,pal, side?'s':(back?'u':'d'));
}

// hairstyles per facing: 'd' front, 'u' back, 's' side
function hairDraw(P,pal,f){
  const H=pal.hair, C=pal.cap||H, GL=pal.glow;
  switch(pal.style){
    case 'mohawk':
      if(f==='s'){ P(-7,-27,14,3,H); P(-4,-33,5,7,H); P(-7,-30,4,4,H); }
      else { P(-8,-27,16,3,H); P(-2,-33,4,7,H); }
      break;
    case 'cap':
      if(f==='s'){ P(-7,-29,14,4,C); P(2,-26,8,2,C); }
      else if(f==='u'){ P(-8,-29,16,4,C); P(-3,-25,6,2,'#e8e8f0'); }
      else { P(-8,-29,16,4,C); P(-8,-25,16,1,C); }
      break;
    case 'bob':
      if(f==='s'){ P(-7,-28,14,4,H); P(-8,-24,4,9,H); }
      else { P(-8,-28,16,4,H); P(-9,-24,3,8,H); P(6,-24,3,8,H); }
      break;
    case 'afro':
      if(f==='s'){ P(-9,-31,17,6,H); P(-9,-25,3,4,H); }
      else { P(-10,-31,20,6,H); P(-8,-32,16,1,H); P(-10,-25,2,3,H); P(8,-25,2,3,H); }
      break;
    case 'spiky':
      if(f==='s'){ P(-7,-28,14,2,H); P(-5,-31,2,3,H); P(-1,-32,2,4,H); P(3,-30,2,2,H); }
      else { P(-8,-28,16,2,H); P(-6,-31,2,3,H); P(-1,-32,2,4,H); P(4,-31,2,3,H); }
      break;
    case 'buns':
      if(f==='s'){ P(-7,-28,14,3,H); P(-9,-31,4,4,H); }
      else { P(-8,-28,16,3,H); P(-11,-30,4,4,H); P(7,-30,4,4,H); }
      break;
    case 'pixie':
      if(f==='s'){ P(-7,-29,14,4,H); P(-7,-25,2,3,H); }
      else { P(-8,-29,16,4,H); P(-8,-25,2,4,H); }
      break;
    case 'dreads': {
      const xs = f==='s' ? [-7,-3,1,5] : [-8,-4,0,4,6];
      P(f==='s'?-7:-8,-28,f==='s'?14:16,3,H);
      xs.forEach((x,i)=>P(x,-27,2,6+(i%2)*2,H));
      break; }
    case 'long':
      if(f==='s'){ P(-7,-28,14,4,H); P(-8,-26,4,14,H); }
      else if(f==='u'){ P(-8,-28,16,15,H); }
      else { P(-8,-28,16,4,H); P(-9,-25,2,11,H); P(7,-25,2,11,H); }
      break;
    case 'perm':
      if(f==='s'){ P(-8,-30,15,5,H); P(-8,-25,3,4,H); P(-5,-32,5,2,H); }
      else { P(-9,-30,18,5,H); P(-9,-25,2,4,H); P(7,-25,2,4,H); P(-6,-32,4,2,H); P(2,-32,4,2,H); }
      break;
    case 'buzz':
      P(f==='s'?-7:-8,-27,f==='s'?14:16,2,H);
      break;
    case 'part':   // middle-part curtains
      if(f==='s'){ P(-7,-28,14,3,H); P(-7,-25,3,5,H); P(4,-25,3,3,H); }
      else if(f==='u'){ P(-8,-28,16,4,H); }
      else { P(-8,-28,16,3,H); P(-8,-25,3,5,H); P(5,-25,3,5,H); P(-2,-25,1,1,H); P(1,-25,1,1,H); }
      break;
    case 'twin':
      if(f==='s'){ P(-7,-28,14,3,H); P(-10,-27,3,10,H); P(-10,-28,3,2,GL); }
      else { P(-8,-28,16,3,H); P(-12,-26,3,10,H); P(9,-26,3,10,H); P(-12,-28,3,2,GL); P(9,-28,3,2,GL); }
      break;
  }
}
function shade(hex,amt){ // darken toward fog purple
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(lerp(r,30,amt)); g=Math.round(lerp(g,16,amt)); b=Math.round(lerp(b,48,amt));
  return `rgb(${r},${g},${b})`;
}

// ---------- totems ----------
const TOTEMS = [
 {id:'sober', name:'SOBER FRIEND',  col:'#39ff14', dur:25, msg:'Look I see them!'},
 {id:'glow',  name:'SHOULDER RIDE', col:'#f5d300', dur:20, msg:'You can see everything!'},
 {id:'bass',  name:'FESTIVAL B.O.', col:'#a3e635', dur:15, msg:'You smell! The crowd backs off!'},
 {id:'torch', name:'PHONE TORCH',   col:'#ff6d00', dur:18, msg:'Your pupils are huge lmao'},
 {id:'signal',name:'WIFI CONNECTED',col:'#b14aed', dur:25, msg:'Maps is working again!'},
 {id:'mum',   name:'RAVE MOM',      col:'#ff8fab', dur:8,  msg:'You are safe. Everything is going to be okay'},
 {id:'flag',  name:'SQUAD FLAG',    col:'#ffffff', dur:12, msg:'Raise it so they can find you!'},
 {id:'shield',name:'HYDRATION PACK',col:'#00e5ff', dur:0,  msg:'Water is life!'},
];

    case 'glow':  p(-3,-3,7,7,'#332b00');   // shoulder ride: wee rider up top
      p(-3,-3,1,2,'#f5d300'); p(2,-3,1,2,'#f5d300');   // rider arms up
      p(-1,-3,2,2,'#ffd9b3');                          // rider head
      p(-1,-1,2,2,'#f5d300');                          // rider body
      p(-1,1,2,2,'#e3b486');                           // carrier head

    case 'water': p(-3,-3,7,7,'#1c2230'); p(-2,-2,5,5,'#e8eef7'); p(-2,-2,5,1,'#9be7ff'); p(-1,0,1,1,'#5a6478'); p(0,-1,1,1,'#5a6478'); p(0,1,1,1,'#5a6478'); break;
    case 'bass':  p(-3,-3,7,7,'#16200a'); p(-3,1,7,3,'#3a4a1e'); p(-2,-1,1,2,'#a3e635'); p(-2,-3,1,1,'#a3e635'); p(0,-2,1,2,'#a3e635'); p(0,-4,1,1,'#a3e635'); p(2,-1,1,2,'#a3e635'); p(2,-3,1,1,'#a3e635'); break;
    case 'torch': p(-3,-3,7,7,'#2b1502');   // phone torch: beam from the camera
      p(-2,-3,5,1,'#fff7d0'); p(-1,-2,3,1,'#ffe28a'); p(0,-1,1,1,'#ffd34d');  // light cone
      p(-1,0,3,4,'#1d1d28');                           // the phone
      p(0,1,1,1,'#9be7ff');                            // screen glint
      break;
    case 'signal':p(-3,-3,7,7,'#1d1030'); p(-3,-2,3,5,'#ddd'); p(-2,-1,1,3,'#9be7ff'); p(1,1,1,1,'#39ff14'); p(2,0,1,2,'#39ff14'); p(3,-1,1,3,'#39ff14'); break;
    case 'mum':   p(-3,-3,7,7,'#2a0a14'); p(-2,-2,2,2,'#ff8fab'); p(1,-2,2,2,'#ff8fab'); p(-3,-1,7,1,'#ff8fab'); p(-2,0,5,1,'#ff8fab'); p(-1,1,3,1,'#ff8fab'); p(0,2,1,1,'#ff8fab'); break;
    case 'shield':p(-3,-3,7,7,'#02222e'); p(-1,-3,2,2,'#00e5ff'); p(-2,-1,4,3,'#00e5ff'); p(-1,2,2,1,'#00e5ff'); p(-1,0,1,1,'#bdf6ff'); break;
    case 'flag':  p(-3,-3,7,7,'#1a1426'); p(-2,-3,1,7,'#c9b78a'); p(-1,-3,5,2,'#ffffff'); p(-1,-1,4,1,'#ff2d95'); break;
  }
  g.restore();
}

// ---------- the MYSTERIOUS BAGGY — a floating ziplock, contents unknown ----------
const BAG_FX={
  bagstrong:{name:'I FEEL STRONG',      col:'#ff4f4f', dur:9,  msg:'invincible. tunnel vision.'},
  bagfast:  {name:'I FEEL FAST',        col:'#00e5ff', dur:10, msg:'everything is a blur!!'},
  bagwavy:  {name:'i feel waaaavvyyy',  col:'#b14aed', dur:8,  msg:'controls?? what controls'},
  bagloved: {name:'I FEEL LOVED',       col:'#ff8fab', dur:10, msg:'everyone here is your friend'},
};
let lastBag=null;
function applyBag(){
  for(const id in BAG_FX) delete effects[id];          // one trip at a time
  // weighted, anti-streak roll: never the same trip twice in a row,
  // and the wavy dud comes up rarer than the good stuff
  const pool=[];
  for(const id of Object.keys(BAG_FX)){
    if(id===lastBag) continue;
    const w = id==='bagwavy' ? 1 : 2;
    for(let k=0;k<w;k++) pool.push(id);
  }
  const id=choice(pool);
  lastBag=id;
  effects[id]=BAG_FX[id].dur;
  say('MYSTERIOUS BAG', BAG_FX[id].col, BAG_FX[id].name);
  sfx('totem');
}
function drawBaggy(b){
  const x=Math.round(b.x), y=Math.round(b.y-6-Math.sin(G.t*2+b.ph)*3);
  cx.fillStyle='#ffffff22'; cx.fillRect(b.x-5,b.y-1,10,3);   // ground shimmer
  cx.globalAlpha=0.92;
  cx.fillStyle='#eef2f8'; cx.fillRect(x-4,y-7,8,11);
  cx.fillStyle='#cdd6e4'; cx.fillRect(x-4,y-7,8,2);          // seal
  cx.fillStyle='#9be7ff'; cx.fillRect(x-4,y-5,8,1);          // zip
  cx.fillStyle='#ffffff'; cx.fillRect(x-2,y-2,3,3);          // contents??
  cx.fillStyle='#5a6478'; cx.fillRect(x+1,y+1,1,1);
  cx.globalAlpha=1;
  if(Math.sin(G.t*5+b.ph)>0.5){ cx.fillStyle='#fff'; cx.fillRect(x+5,y-10,1,2); cx.fillRect(x+6,y-8,1,1); }
}

function friendsNeeded(stage){ return 4 + stage*2; }   // 6,8,10,...

// ---------- world generation ----------
const OB_DIMS = { bar:{w:68,h:18}, loo:{w:58,h:16}, speaker:{w:40,h:46}, tent:{w:40,h:22}, merch:{w:50,h:20}, bin:{w:36,h:18} };
const OB_NAMES = { bar:'bar queue', loo:'porta-loos', speaker:'speaker stack', tent:'tent', merch:'merch stand', bin:'bins', stage:'main stage' };
function genWorld(stage, spawnFrac){
  // THE LAST SHUTTLE — a long car-park gauntlet, bus at the far end
  if(stage>=FINAL_STAGE){
    // THE LAST SHUTTLE — a HAND-AUTHORED gauntlet, identical every run.
    // Slalom gates, pinch points, a centre blob, and a final dodge.
    const W=3400, H=270;
    const w={W,H,stage, final:true, crowds:[], obstacles:[], friends:[], totems:[], lasers:[]};
    w.spawn={x:80, y:135};
    const CR=[[350,70,45],[350,210,45],[650,135,50],[950,60,40],[950,200,40],
              [1250,135,55],[1500,80,38],[1560,210,38],
              [1810,40,26],[1810,135,40],[1810,240,26],          // the triple gate
              [2120,38,32],[2120,232,32],                        // THE FUNNEL's flanks
              [2400,135,60],
              [2700,60,40],[2700,200,40],[3000,135,40]];
    for(const [x,y,r] of CR){
      const c={x,y,r,members:[]};
      const n=Math.max(7,Math.floor(r/5));
      for(let j=0;j<n;j++){
        const a=(j/n)*TAU+hash2(x,j)*1.5, d=Math.sqrt(hash2(j,y))*r;
        c.members.push({x:c.x+Math.cos(a)*d, y:c.y+Math.sin(a)*d, hx:0, hy:0,
          facing:['down','left','right','up'][j%4],
          pal:CHARS[(j+Math.floor(x/97))%CHARS.length], ph:hash2(x,y+j)*TAU});
      }
      w.crowds.push(c);
    }
    const OB=[['speaker',500,135],['bin',430,135],['tent',620,40],['bar',800,38],['loo',800,232],
              ['tent',1100,60],['speaker',1250,40],['merch',1400,135],['bin',1650,40],['loo',1700,230],
              ['speaker',1950,225],['bin',2000,70],
              ['loo',2090,95],['loo',2148,95],['loo',2090,175],['loo',2148,175], // THE FUNNEL
              ['bar',2280,135],                                  // ...straight into a bar. devious.
              ['merch',2480,40],
              ['loo',2550,38],['merch',2850,225],['bar',2950,230],['speaker',3060,60],
              ['bin',3150,135]];
    for(const [t,x,y] of OB){ const d=OB_DIMS[t]; w.obstacles.push({x,y,w:d.w,h:d.h,type:t,ph:x%6}); }
    // NO powerups in the finale — a pure, even gauntlet (leaderboard-ready)
    w.baggies=[];
    // four art cars patrolling their own zones
    w.artcars=[{x:700, y:135,dir:0,        t:2,  ph:0,  kind:0},
               {x:1500,y:80, dir:Math.PI,  t:3.5,ph:1.7,kind:1},
               {x:2300,y:190,dir:0,        t:1,  ph:3.1,kind:2},
               {x:2950,y:120,dir:Math.PI,  t:4.5,ph:4.4,kind:0}];
    return w;
  }
  const W=mapW(stage), H=mapH(stage);
  const w={W,H,stage, crowds:[], obstacles:[], friends:[], totems:[], lasers:[]};
  // THE STAGE — platform + DJ + laser truss at the top of the map
  const rigW=Math.min(W*0.42,380);
  w.djPal=choice(CHARS);
  w.obstacles.push({x:W/2, y:42, w:rigW, h:56, type:'stage', ph:0});
  for(let lx=W/2-rigW/2+26; lx<W/2+rigW/2-14; lx+=46)
    w.lasers.push({x:lx, y:18, c:ri(0,4), ph:rnd(0,TAU), sp:rnd(0.3,0.55)});
  // spawn point — centre, or carried over from the previous stage's exit
  const sp={x:clamp((spawnFrac?spawnFrac.x:0.5)*W,50,W-50),
            y:clamp((spawnFrac?spawnFrac.y:0.5)*H,50,H-50)};
  if(sp.y<115 && Math.abs(sp.x-W/2)<rigW/2+45) sp.y=130;   // never on the stage
  w.spawn=sp;
  // crowds — blobby clusters of dancers (mostly facing the stage)
  const nCrowds = 4 + stage*2;
  for(let i=0;i<nCrowds;i++){
    const c={x:rnd(130,W-130), y:rnd(130,H-130), r:rnd(40,80), members:[]};
    if(Math.hypot(c.x-sp.x,c.y-sp.y)<170){ i--; continue; }   // keep spawn clear
    const n = Math.max(7, Math.floor(c.r/5));   // always a proper group, never loners
    for(let j=0;j<n;j++){
      const a=rnd(0,TAU), d=Math.sqrt(Math.random())*c.r;
      c.members.push({x:c.x+Math.cos(a)*d, y:c.y+Math.sin(a)*d,
        hx:0, hy:0,   // body-odour push offset
        facing: Math.random()<0.7?'up':choice(['down','left','right']),
        pal:choice(CHARS), ph:rnd(0,TAU)});
    }
    w.crowds.push(c);
  }
  // solid obstacles — bars, loos, speakers, tents, merch, bins
  const nObs = 5 + stage;
  const types=Object.keys(OB_DIMS);
  for(let i=0;i<nObs;i++){
    const t=types[i%types.length], d=OB_DIMS[t];
    const p=freeSpot(w,55);
    if(Math.hypot(p.x-sp.x,p.y-sp.y)<170){ i--; continue; }
    w.obstacles.push({x:p.x,y:p.y,w:d.w,h:d.h,type:t,ph:rnd(0,TAU)});
  }
  // friends to find
  const need=friendsNeeded(stage);
  for(let i=0;i<need;i++){
    w.friends.push(placeFriend(w, ()=>({x:rnd(70,W-70),y:rnd(70,H-70)})));
  }
  // totems — shuffled deck so every type shows up before any repeats
  const nTot = Math.min(6+stage, 9);
  const deck = [...TOTEMS].sort(()=>Math.random()-0.5);
  for(let i=0;i<nTot;i++){
    const p=freeSpot(w,55);
    w.totems.push({x:p.x,y:p.y,type:deck[i%deck.length],taken:false,ph:rnd(0,TAU)});
  }
  // mysterious baggies floating about
  w.baggies=[];
  for(let i=0;i<2;i++){ const p=freeSpot(w,50);
    w.baggies.push({x:p.x,y:p.y,taken:false,respawnT:0,ph:rnd(0,TAU)}); }
  // EL PULPO & FRIENDS — flame-breathing art cars, more each stage
  const nCars = stage>=6?3 : stage>=3?2 : 1;
  w.artcars=[];
  for(let i=0;i<nCars;i++){
    const car={x:rnd(W*0.2,W*0.8), y:rnd(Math.max(220,H*0.4),H-120), dir:rnd(0,TAU), t:rnd(1.2,4.6), ph:rnd(0,TAU), kind:(i+stage)%3};
    if(Math.hypot(car.x-sp.x,car.y-sp.y)<240)
      car.x = sp.x>W/2 ? Math.max(110,sp.x-320) : Math.min(W-110,sp.x+320);
    w.artcars.push(car);
  }
  return w;
}
// nudge a just-landed friend out of crowds and obstacles so they're grabbable
function settleFriend(f){
  for(let k=0;k<8;k++){
    let moved=false;
    for(const c of world.crowds){
      const d=Math.hypot(f.x-c.x,f.y-c.y);
      if(d<c.r+16){
        const a=d>0.1?angTo(c,f):rnd(0,TAU);
        f.x=c.x+Math.cos(a)*(c.r+18); f.y=c.y+Math.sin(a)*(c.r+18); moved=true;
      }
    }
    for(const o of world.obstacles){
      if(Math.abs(f.x-o.x)<o.w/2+12 && Math.abs(f.y-o.y)<o.h/2+14){
        const a=angTo(o,f);
        f.x=o.x+Math.cos(a)*(o.w/2+18); f.y=o.y+Math.sin(a)*(o.h/2+18); moved=true;
      }
    }
    f.x=clamp(f.x,30,world.W-30); f.y=clamp(f.y,30,world.H-30);
    if(!moved) break;
  }
}

function hitsObstacle(w,p,pad){
  return w.obstacles.some(o=>Math.abs(p.x-o.x)<o.w/2+pad && Math.abs(p.y-o.y)<o.h/2+pad);
}
function freeSpot(w,clear){
  for(let k=0;k<60;k++){
    const p={x:rnd(80,w.W-80),y:rnd(80,w.H-80)};
    if(w.crowds.every(c=>Math.hypot(c.x-p.x,c.y-p.y)>c.r+clear) && !hitsObstacle(w,p,clear*0.5)) return p;
  }
  return {x:rnd(80,w.W-80),y:rnd(80,w.H-80)};
}
function placeFriend(w, posFn){
  let p; let tries=0;
  do{ p=posFn(); tries++; }
  while(tries<40 && (w.crowds.some(c=>Math.hypot(c.x-p.x,c.y-p.y)<c.r+14)
        || hitsObstacle(w,p,14)
        || Math.hypot(p.x-w.spawn.x,p.y-w.spawn.y)<130));
  // friends use a random character that's not the player's
  let pal; do{ pal=choice(CHARS); }while(pal===CHARS[G.charIdx]);
  return {x:clamp(p.x,40,w.W-40), y:clamp(p.y,40,w.H-40), pal, ph:rnd(0,TAU)};
}

// ---------- stage start ----------
function startStage(stage, withCutscene, spawnFrac){
  G.stage=stage;
  world=genWorld(stage, spawnFrac);
  player.x=world.spawn.x; player.y=world.spawn.y;
  player.dir=angTo(world.spawn,{x:world.W/2,y:world.H/2}); player.invuln=2;
  party=[]; trail=[{x:player.x,y:player.y}]; trailDist=[0];
  effects={}; exitGate=null; exitArrowT=0; G.zoom=1; friendDryT=0; G.shield=false;
  beatN=0; if(AC) setTempo(BPMS[Math.min(stage,FINAL_STAGE)-1]);
  if(world.final){
    // your whole crew from stage 7 comes with you — all 18 of them
    const crew=friendsNeeded(stage-1);
    world.crewMax=crew;
    for(let i=0;i<crew;i++) party.push({pal:choice(CHARS)});
    world.timer=30;
    exitGate={x:world.W-90, y:world.H/2};
    player.dir=0;   // face the long road ahead
    lbGetToken();   // leaderboard run-token — clock starts now
  }
  camera.x = world.W<VW ? -(VW-world.W)/2 : clamp(player.x-VW/2, -40, world.W-VW+40);
  camera.y = world.H<VH ? -(VH-world.H)/2 : clamp(player.y-VH/2, -40, world.H-VH+40);
  if(withCutscene){
    cutscene={t:0, phase:0, dancers:[]};
    const n=Math.min(friendsNeeded(stage-1)||6, 10);
    for(let i=0;i<n;i++) cutscene.dancers.push({pal:choice(CHARS), i, exitA:rnd(0,TAU)});
    G.state='cutscene';
  } else {
    phoneStart();
  }
}

  phone.t+=dt;

let AC=null, muted=false, beatTimer=null, beatN=0, curTempo=0;
// per-arena tempos: rainbow road · subterra · mainstage · grid · canopy · spire · kick dome · shuttle
const BPMS=[138,140,135,132,174,145,160,190];
function setTempo(bpm){
  if(!AC || bpm===curTempo) return;
  curTempo=bpm;
  if(beatTimer) clearInterval(beatTimer);
  beatTimer=setInterval(beat, 60000/bpm/4);    // 16th notes
}
function audioInit(){
  if(AC){
    if(AC.state==='suspended') AC.resume();   // iOS Safari suspends until a gesture
    return;
  }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  setTempo(BPMS[Math.min(G.stage||1,FINAL_STAGE)-1]);
}
// Safari also suspends audio when the tab is backgrounded — wake it on return
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && AC && AC.state==='suspended') AC.resume();
});
// 2-bar acid bassline (semitones; null = rest)
const BASSLINE=[0,null,0,12, null,0,10,null, 0,12,null,0, 3,null,15,12,
                0,null,0,12, null,0,10,null, 7,12,null,5, 3,null,12,10];
const DNBLINE=[0,0,3,5, 0,10,7,5];
// ---- MAINSTAGE theme (A minor, 128, Am-F-C-G) ----
const NOTE={C2:65.41,F2:87.31,G2:98.00,A2:110.00,F4:349.23,G4:392.00,A4:440.00,
            B4:493.88,C5:523.25,D5:587.33,E5:659.25,G5:783.99};
const MS_CH=['Am','F','C','G'];
const MS_ROOT={Am:'A2',F:'F2',C:'C2',G:'G2'};
const MS_TRIAD={Am:['A4','C5','E5'], F:['F4','A4','C5'],
                C:['C5','E5','G5'],  G:['G4','B4','D5']};
function beat(){
  if(!AC||muted) return;
  const t=AC.currentTime;
  if(G.state==='select'||G.state==='win'){
    if(curTempo!==134) setTempo(134);   // driving techno tempo for the menus
    chill(t); return;
  }
  const s=beatN%32, S=beatN%512;               // 2-bar groove inside a 32-bar phrase
  beatN++;
  const key=(G.stage%4)*2;                     // key shifts per stage
  const stg=Math.min(G.stage,FINAL_STAGE);
  if(S>=510) return;                           // breath of silence before the drop
  if(S===0 && beatN>1) crash(t);               // THE DROP
  if(S>=480){                                  // BUILDUP — last 2 bars of the phrase
    const ph=S-480;                            // 0..29
    const div=ph<12?4:ph<22?2:1;               // snare roll tightens
    if(ph%div===0) snare(t, 0.1+ph*0.005);
    if(S%8===0) kick(t);
    hat(t, 0.03+ph*0.006, false);
    if(stg===4 && S%4===0) acid(t, 110*Math.pow(2,key/12), 0.1);
    return;
  }
  // ----- each arena has its own sound -----
  if(stg===FINAL_STAGE){                       // THE LAST SHUTTLE — flat-out panic, 190
    if(s%4===0) kickDist(t);
    if(s%4===2){ hat(t,0.15,true); acid(t, 110*Math.pow(2,key/12), 0.2); }
    if(s%8===4) clap(t);
    hat(t, s%2?0.08:0.05, false);
    if(s%16===14) snare(t,0.2);
    if(s===8||s===24) hardStab(t, 440*Math.pow(2,key/12));
  } else if(stg===1){                          // RAINBOW ROAD — driving techno, 138
    if(s%4===0){ kick(t); sub(t, 41*Math.pow(2,key/12)); }
    if(s%4===2) hat(t,0.1,true);
    if(s%2===1) hat(t,0.035,false);
    if(s%8===6) acid(t, 55*Math.pow(2,(key+[0,0,3,0][(s>>3)%4])/12), 0.13);
    if(s===30) stab(t, 220*Math.pow(2,key/12));   // syncopated — the 'and' of beat 8
  } else if(stg===2){                          // SUBTERRA — halftime dubstep wobble, 140
    if(s%16===0){ kick(t,true); sub(t, 55*Math.pow(2,key/12)); }
    if(s%16===8) snare(t,0.26);
    if(s%2===0) acid(t, 55*Math.pow(2,key/12), 0.18);   // the wobble
    if(s%4===2) hat(t,0.05,false);
    if(s%16===14) hat(t,0.1,true);
  } else if(stg===3){                          // MAINSTAGE — stripped big room, 128
    const tb=(S>>4)%16, sb=S%16, ch=MS_CH[tb%4];
    if(sb%4===0) kick(t,true);                 // big CLEAN kick, four to the floor
    if(sb===4||sb===12) clap(t);
    if(sb%4===2){ hat(t,0.12,true); houseBass(t, NOTE[MS_ROOT[ch]]); } // bass locked to the offbeat
    if(sb%2===1) hat(t,0.035,false);
    // staccato chord stabs, syncopated off the kick — denser in the back half
    if(tb<8){ if(sb===3||sb===10) msStab(t,ch); }
    else    { if(sb===3||sb===6||sb===10||sb===14) msStab(t,ch); }
  } else if(stg===4){                          // THE GRID — acid techno, 132
    if(s%8===0) kick(t);
    if(s%8===4) clap(t);
    if(s%4===2) hat(t,0.16,true); else hat(t,0.05,false);
    const note=BASSLINE[s];
    if(note!==null) acid(t, 55*Math.pow(2,(note+key)/12), 0.16);
    if(s===14||s===30) stab(t, 220*Math.pow(2,key/12));
  } else if(stg===5){                          // GREEN CANOPY — jungle, 174
    if(s%16===0||s%16===10) kick(t);
    if(s%8===4) snare(t,0.24);
    hat(t, s%2?0.09:0.04, false);
    if(s%4===0) sub(t, 55*Math.pow(2,(DNBLINE[(s>>2)%8]+key)/12));
    if(s===30) stab(t, 440*Math.pow(2,key/12));
  } else if(stg===6){                          // ASTRAL SPIRE — full-on psytrance, 145
    if(s%4===0) kick(t);
    else acid(t, 110*Math.pow(2,key/12), 0.12);          // galloping psy bass on the off-16ths
    if(s%8===4) hat(t,0.1,true);
    if(s%2===1) hat(t,0.03,false);
    const zaps=[12,15,19,24];
    if(s%16===6) twinkle(t, 880*Math.pow(2,(key+zaps[(s>>4)%4])/12), 0.05);
  } else {                                     // KICK DOME — uptempo hardstyle, 160
    if(s%4===0) kickDist(t);
    if(s%4===2){ hat(t,0.13,true); acid(t, 110*Math.pow(2,key/12), 0.16); }
    if(s%16===8) clap(t);
    if(s%2===1) hat(t,0.04,false);
    if(s===12||s===28) hardStab(t, 330*Math.pow(2,key/12));
  }
}
// ---- menu music: driving 4/4 techno rave for the title & win screens ----
const PADPROG=[0,8,3,10];
const MENU_BASS=[0,null,12,null, 0,null,10,12];
function chill(t){
  const cs=beatN++%128;
  const root=PADPROG[(cs>>5)%4];
  if(cs%4===0) kick(t,true);                           // HARD 4/4 kick
  if(cs%4===2) hat(t,0.16,true);                       // loud offbeat open hat
  if(cs%2===1) hat(t,0.05,false);
  if(cs%16===8){ clap(t); snare(t,0.12); }             // layered backbeat
  const n=MENU_BASS[(cs>>1)%8];                        // rolling techno bassline
  if(cs%2===0 && n!==null) acid(t, 55*Math.pow(2,(root+n)/12), 0.17);
  if(cs%16===14) stab(t, 220*Math.pow(2,root/12));
  if(cs%64===32) hardStab(t, 330*Math.pow(2,root/12)); // periodic scream
}
function houseBass(t,f){ const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=420;
  g.gain.setValueAtTime(0.13,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  o.connect(lp).connect(g).connect(AC.destination); o.start(t); o.stop(t+0.18);}
function pluck(t,f){ const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='triangle'; o.frequency.value=f*2; lp.type='lowpass'; lp.frequency.value=1800;
  g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  o.connect(lp).connect(g).connect(AC.destination); o.start(t); o.stop(t+0.24);}
// short staccato chord stab for Mainstage
function msStab(t,ch){
  for(const n of MS_TRIAD[ch]){
    const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=NOTE[n]; o.detune.value=rnd(-7,7);
    lp.type='lowpass'; lp.frequency.value=2200;
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
    o.connect(lp).connect(g).connect(AC.destination); o.start(t); o.stop(t+0.1);
  }
}
function pad(t,f){
  [1,1.189,1.498,2].forEach(r=>{
    const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
    o.type='triangle'; o.frequency.value=f*r; o.detune.value=rnd(-7,7);
    lp.type='lowpass'; lp.frequency.value=750;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.045,t+0.5);
    g.gain.setValueAtTime(0.045,t+2.2); g.gain.linearRampToValueAtTime(0.0001,t+3.6);
    o.connect(lp).connect(g).connect(AC.destination); o.start(t); o.stop(t+3.7);
  });
}
function kickSoft(t,v=0.22){ const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(42,t+0.12);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.2);}
function twinkle(t,f,v=0.05){ const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.55);}
// hardstyle gear: tanh-distorted kick + detuned saw stab
const DIST_CURVE=(()=>{const n=256,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1; c[i]=Math.tanh(x*3);} return c;})();
function kickDist(t){
  const o=AC.createOscillator(),g=AC.createGain(),ws=AC.createWaveShaper(),og=AC.createGain();
  ws.curve=DIST_CURVE;
  o.frequency.setValueAtTime(230,t); o.frequency.exponentialRampToValueAtTime(42,t+0.16);
  g.gain.setValueAtTime(1.7,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.2);
  og.gain.value=0.4;
  o.connect(g).connect(ws).connect(og).connect(AC.destination);
  o.start(t); o.stop(t+0.22);}
function hardStab(t,f){
  [-18,0,18].forEach(d=>{
    const o=AC.createOscillator(),g=AC.createGain(),bp=AC.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=f; o.detune.value=d;
    bp.type='bandpass'; bp.Q.value=2.5;
    bp.frequency.setValueAtTime(2600,t); bp.frequency.exponentialRampToValueAtTime(700,t+0.16);
    g.gain.setValueAtTime(0.09,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.connect(bp).connect(g).connect(AC.destination); o.start(t); o.stop(t+0.2);
  });}

function snare(t,v){ const len=2200;
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
  const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=0.9; g.gain.value=v;
  s.buffer=b; s.connect(bp).connect(g).connect(AC.destination); s.start(t);
  const o=AC.createOscillator(),g2=AC.createGain();
  o.frequency.value=190; g2.gain.setValueAtTime(v*0.8,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  o.connect(g2).connect(AC.destination); o.start(t); o.stop(t+0.09);}
function crash(t){ const len=26000;
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type='highpass'; hp.frequency.value=4200; g.gain.value=0.25;
  s.buffer=b; s.connect(hp).connect(g).connect(AC.destination); s.start(t);}
function sub(t,f){ const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.26,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.26);}
function kick(t,hard){ const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(hard?210:160,t); o.frequency.exponentialRampToValueAtTime(hard?44:38,t+(hard?0.13:0.11));
  g.gain.setValueAtTime(hard?0.62:0.55,t); g.gain.exponentialRampToValueAtTime(0.001,t+(hard?0.17:0.14));
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.18);}
function hat(t,v,open){ const len=open?3600:1100;
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,open?1.2:2);
  const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type='highpass';hp.frequency.value=7500; g.gain.value=v;
  s.buffer=b; s.connect(hp).connect(g).connect(AC.destination); s.start(t);}
function clap(t){ const len=2600;
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++){ const e=(i%900<60)?1:Math.pow(1-i/len,2.2);   // triple-burst clap
    d[i]=(Math.random()*2-1)*e; }
  const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=1.2; g.gain.value=0.28;
  s.buffer=b; s.connect(bp).connect(g).connect(AC.destination); s.start(t);}
// squelchy acid bass — saw through a resonant lowpass that wobbles over time
function acid(t,f,v){ const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=f;
  lp.type='lowpass'; lp.Q.value=9;
  const wob=500+420*Math.sin(beatN*0.21);
  lp.frequency.setValueAtTime(180+wob,t); lp.frequency.exponentialRampToValueAtTime(160,t+0.12);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  o.connect(lp).connect(g).connect(AC.destination); o.start(t); o.stop(t+0.14);}
// hoover-ish minor chord stab
function stab(t,f){
  [1,1.189,1.498].forEach(r=>{
    const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
    o.type='square'; o.frequency.value=f*r;
    o.detune.setValueAtTime(-14,t); o.detune.linearRampToValueAtTime(14,t+0.18);
    lp.type='lowpass'; lp.frequency.value=2200;
    g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.connect(lp).connect(g).connect(AC.destination); o.start(t); o.stop(t+0.24);
  });}
function sfx(kind){
  if(!AC||muted) return; const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain(); o.connect(g).connect(AC.destination);
  if(kind==='pick'){ o.type='square'; o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+0.06);
    g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.start(t);o.stop(t+0.16);}
  else if(kind==='hurt'){ o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(60,t+0.25);
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3); o.start(t);o.stop(t+0.3);}
  else if(kind==='totem'){ o.type='triangle'; [523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*0.07));
    g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t);o.stop(t+0.4);}
  else if(kind==='exit'){ o.type='square'; [392,523,659,784,1047,1319].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*0.09));
    g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.6); o.start(t);o.stop(t+0.6);}
  else if(kind==='cut'){ o.type='sawtooth'; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(110,t+0.15);
    g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18); o.start(t);o.stop(t+0.2);}
  else if(kind==='beep'){ o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1175,t+0.11);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.03);
    g.gain.setValueAtTime(0.06,t+0.14); g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.start(t);o.stop(t+0.3);}
}

let lbOpen=false, lbQualified=false, lbPrompted=false, lbSubmitted=false;
const lbEl=document.getElementById('lb'), lbBtnEl=document.getElementById('lbBtn'),
      lbEntryEl=document.getElementById('lbEntry'), lbNameEl=document.getElementById('lbName'),
      lbGoEl=document.getElementById('lbGo'), lbSkipEl=document.getElementById('lbSkip'),
      lbCloseEl=document.getElementById('lbClose'), lbMsgEl=document.getElementById('lbMsg'),
      lbListEl=document.getElementById('lbList');

// signature so casual cheaters can't just curl a fake time (matches the worker)
function lbSig(n,t,tok){ let h=0x811c9dc5; const s=n+'|'+t+'|'+tok+'|LSTSHTL-9000';
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h.toString(36); }

// run token — issued by the server the moment the finale starts, so a
// submitted time has to fit inside real elapsed time (anti-forgery)
let lbToken=null;
function lbGetToken(){
  lbToken=null;
  if(!LB_URL) return;
  fetch(LB_URL+'/token',{method:'POST'}).then(r=>r.json())
    .then(d=>{ if(d.token) lbToken=d.token; }).catch(()=>{});
}

function lbFmt(ms){ return (ms/1000).toFixed(2)+'s'; }
function lbRenderList(board, mine){
  lbListEl.innerHTML='';
  if(!board || !board.length){ lbListEl.innerHTML='<li><span class="nm">no full buses yet — be the first!</span></li>'; return; }
  board.forEach((e,i)=>{
    const li=document.createElement('li');
    if(mine && e.n===mine.n && e.t===mine.t) li.className='me';
    li.innerHTML=`<span class="rk">${i+1}.</span><span class="nm"></span><span class="tm">${lbFmt(e.t)}</span>`;
    li.querySelector('.nm').textContent=e.n;   // never trust names as HTML
    lbListEl.appendChild(li);
  });
}
function lbShow(entry){
  if(!LB_URL) return;
  lbOpen=true; lbEl.style.display='flex';
  lbEntryEl.style.display=entry?'block':'none';
  lbMsgEl.textContent=''; lbMsgEl.style.color='#ff6d00';
  if(entry){ lbNameEl.value=localStorage.getItem('lbName')||''; setTimeout(()=>lbNameEl.focus(),50); }
  lbListEl.innerHTML='<li><span class="nm">loading…</span></li>';
  fetch(LB_URL+'/scores').then(r=>r.json()).then(d=>lbRenderList(d.board))
    .catch(()=>{ lbListEl.innerHTML='<li><span class="nm">couldn\'t reach the board 😢</span></li>'; });
}
function lbHide(){ lbOpen=false; lbEl.style.display='none'; }
async function lbSubmit(){
  const name=lbNameEl.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(name.length<2){ lbMsgEl.textContent='2-5 letters or numbers'; return; }
  const t=Math.round(winTime*1000);
  if(!lbToken){ lbMsgEl.textContent="couldn't verify this run (connection hiccup at stage start) — next run will work"; return; }
  lbGoEl.disabled=true; lbMsgEl.textContent='submitting…';
  try{
    const r=await fetch(LB_URL+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({n:name,t,tok:lbToken,s:lbSig(name,t,lbToken)})});
    const d=await r.json();
    if(d.ok){
      lbSubmitted=true; lbToken=null; lbEntryEl.style.display='none';
      localStorage.setItem('lbName',name);
      lbMsgEl.style.color='#39ff14';
      lbMsgEl.textContent = d.pb ? `LOCKED IN — RANK #${d.rank}!` : `not a PB — your best holds rank #${d.rank}`;
      lbRenderList(d.board,{n:name,t});
      sfx('totem');
    } else lbMsgEl.textContent=d.error||'something went wrong';
  }catch{ lbMsgEl.textContent='network error — try again'; }
  lbGoEl.disabled=false;
}
if(lbEl){
  lbNameEl.addEventListener('input',()=>{ lbNameEl.value=lbNameEl.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
  lbNameEl.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') lbSubmit(); });
  lbGoEl.addEventListener('click',lbSubmit);
  lbSkipEl.addEventListener('click',()=>{ lbEntryEl.style.display='none'; });
  lbCloseEl.addEventListener('click',lbHide);
  lbBtnEl.addEventListener('click',()=>lbShow(false));
  lbEl.addEventListener('mousedown',e=>{ if(e.target===lbEl) lbHide(); });
}
