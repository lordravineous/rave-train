const keys={};
addEventListener('keydown',e=>{
  if(lbOpen){ if(e.key==='Escape') lbHide(); return; }   // leaderboard overlay owns the keyboard
  keys[e.key]=true; audioInit();
  if(e.key==='m'||e.key==='M') muted=!muted;
  // ----- debug: ` toggles, 1-8 jumps to a stage, N skips to next -----
  if(e.key==='`'||e.key==='~'){
    G.debug=!G.debug;
    say(G.debug?'DEBUG ON · 1-8 JUMP TO STAGE · N = NEXT':'DEBUG OFF','#ff6d00');
  }
  if(G.debug){
    if('12345678'.includes(e.key)){ G.paused=false; startStage(+e.key,false); return; }
    if((e.key==='n'||e.key==='N') && world){ G.paused=false; startStage(Math.min(G.stage+1,FINAL_STAGE),false); return; }
  }
  if((e.key==='p'||e.key==='P') && (G.state==='play')) G.paused=!G.paused;
  if(G.paused && G.state==='play'){
    if(e.key==='r'||e.key==='R'){ G.paused=false; G.totalCollected=0; startStage(1,false); }
    if(e.key==='q'||e.key==='Q'){ G.paused=false; G.state='select'; }
  }
  if(G.state==='phone' && (e.key===' '||e.key==='Enter')){ phone.t=Math.max(phone.t,phone.dur); }
  if(G.state==='select'){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s'].includes(e.key))
      G.charIdx = G.charIdx===0 ? 1 : 0;
    if(e.key==='Enter'||e.key===' '){ G.totalCollected=0; startStage(1,false); }
  } else if((G.state==='gameover'||G.state==='win') && (e.key===' '||e.key==='Enter')){
    G.state='select';
  } else if(G.state==='win' && (e.key==='l'||e.key==='L')){ lbShow(lbQualified&&!lbSubmitted); }
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key]=false);
// (mouse / free-tap steering removed — keyboard on desktop, buttons on touch)
let btnL=false, btnR=false;
function pointerXY(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH};
}
// on-screen steer buttons (touch devices, during play)
function btnRects(){
  const s=66, m=10;
  return {L:{x:m,y:VH-s-m,w:s,h:s}, R:{x:VW-s-m,y:VH-s-m,w:s,h:s}};
}
const inRect=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
function pauseBtns(){
  const w=132,h=24,x=VW/2-w/2;
  return {resume:{x,y:VH/2-2,w,h}, restart:{x,y:VH/2+28,w,h}, quit:{x,y:VH/2+58,w,h}};
}
let lastTouchEvt=0;
function readTouches(list){
  btnL=false; btnR=false;
  lastTouchEvt=performance.now();
  const r=btnRects();
  for(const t of list){
    const p=pointerXY(t);
    if(G.state==='play' && inRect(p,r.L)) btnL=true;
    else if(G.state==='play' && inRect(p,r.R)) btnR=true;
    // touches outside the buttons do nothing — no accidental steering
  }
}
let debugTapN=0, debugTapT=0;
function pointerDown(mx,my){
  // secret: 5 quick taps in the top-left corner toggles debug mode
  if(mx<70 && my<20){
    const now=performance.now();
    if(now-debugTapT>1500) debugTapN=0;
    debugTapT=now;
    if(++debugTapN>=5){
      debugTapN=0; G.debug=!G.debug;
      say(G.debug?'DEBUG ON · USE ‹ › TO JUMP STAGES':'DEBUG OFF','#ff6d00');
    }
    return;
  }
  // debug stage-jump buttons (touch)
  if(G.debug && TOUCH && G.state==='play' && !G.paused){
    const p={x:mx,y:my};
    if(inRect(p,{x:VW/2-46,y:VH-44,w:42,h:24})){ startStage(Math.max(1,G.stage-1),false); return; }
    if(inRect(p,{x:VW/2+4, y:VH-44,w:42,h:24})){ startStage(Math.min(FINAL_STAGE,G.stage+1),false); return; }
  }
  if(G.state==='select'){
    const SC=selCards();
    for(let i=0;i<2;i++){ const c=SC.cards[i];
      if(Math.abs(mx-c.x)<34 && my>c.y-54 && my<c.y+24){ G.charIdx=i; return; } }
    G.totalCollected=0; startStage(1,false);
  }
  else if(G.state==='gameover'||G.state==='win'){ if(lbOpen) return; G.state='select'; }
  else if(G.state==='phone'){ phone.t=Math.max(phone.t,phone.dur); }
  else if(G.state==='play'){
    if(G.paused){
      if(TOUCH){   // on-screen pause menu
        const pb=pauseBtns(), p={x:mx,y:my};
        if(inRect(p,pb.resume)){ G.paused=false; return; }
        if(inRect(p,pb.restart)){ G.paused=false; G.totalCollected=0; startStage(1,false); return; }
        if(inRect(p,pb.quit)){ G.paused=false; G.state='select'; return; }
        return;    // stray taps do nothing while the menu is up
      }
      G.paused=false; return;
    }
    if(TOUCH && my<18 && Math.abs(mx-VW/2)<26){ G.paused=true; return; }  // pause button
  }
}
cv.addEventListener('mousedown',e=>{ audioInit(); const p=pointerXY(e); pointerDown(p.x,p.y); });
cv.addEventListener('touchstart',e=>{ e.preventDefault(); audioInit();
  readTouches(e.touches);
  const p=pointerXY(e.touches[0]);
  if(G.state!=='play' || p.y<30 || G.paused || G.debug) pointerDown(p.x,p.y);   // menus + pause + debug taps
},{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); readTouches(e.touches); },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); readTouches(e.touches); },{passive:false});
// Android fires touchcancel (notifications, gestures, palm rejection) — without
// this, button state stays stuck and controls "go crazy"
cv.addEventListener('touchcancel',e=>{ e.preventDefault();
  btnL=false; btnR=false; },{passive:false});

// ============================================================
//  UPDATE
// ============================================================
function scatterFriends(count, reason){
  // remove `count` from the END of the party; they sprint off in random
  // directions (visibly!) and become world friends again nearby
  const lost = party.splice(party.length-count, count);
  let a0=rnd(0,TAU);
  for(let i=0;i<lost.length;i++){
    const a=a0 + (i/lost.length)*TAU + rnd(-0.3,0.3);   // fan out evenly-ish
    const sp=rnd(260,420);
    world.friends.push({x:player.x, y:player.y-4, pal:lost[i].pal, ph:rnd(0,TAU),
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, fly:1.0});
  }
  if(exitGate && !world.final && party.length < friendsNeeded(G.stage)){ exitGate=null; say('THE EXIT VANISHED...','#ff6d00'); }
  G.shake=Math.min(G.shake+4+count, 10);
}

function hitPenalty(what){
  if(player.invuln>0 || effects.mum || effects.bagstrong) return;   // protected
  if(G.shield){   // the hydration pack takes the hit
    G.shield=false; player.invuln=1.5; G.shake=4;
    say('HYDRATION PACK!','#00e5ff','the water took the hit');
    sfx('totem');
    return;
  }
  if(party.length===0){
    gameOverInfo={stage:G.stage, total:G.totalCollected, what};
    G.state='gameover'; sfx('hurt'); G.shake=12;
    return;
  }
  const lose=Math.ceil(party.length/2);
  scatterFriends(lose, what);
  say(`-${lose} FRIENDS! (${what})`,'#ff4f4f');
  sfx('hurt');
  player.invuln=2.2;
  // bounce back toward map centre-ish
  const a=angTo(player,{x:world.W/2,y:world.H/2});
  player.dir=a+rnd(-0.5,0.5);
}

function update(dt){
  G.t+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*18);
  for(const m of G.msgs) m.t-=dt;
  G.msgs=G.msgs.filter(m=>m.t>0);

  if(G.state==='flash'){ flashT-=dt; if(flashT<=0) G.state='play'; updateCamera(dt); return; }
  if(G.state==='cutscene'){ updateCutscene(dt); return; }
  if(G.state==='transition'){ updateTransition(dt); return; }
  if(G.state==='phone'){ updatePhone(dt); return; }
  if(G.state==='win'){ winT+=dt;
    if(lbQualified && !lbPrompted && winT>2.6){ lbPrompted=true; lbShow(true); }
    return; }
  if(G.state!=='play' || G.paused) return;

  // the last shuttle waits for no one
  if(world.final){
    world.timer-=dt;
    if(world.timer<=10.5 && world.timer+dt>10.5) say('THE BUS IS ABOUT TO LEAVE!','#ff4f4f');
    if(world.timer<=0){
      gameOverInfo={stage:G.stage, total:G.totalCollected, what:'missed the last shuttle', bus:true};
      G.state='gameover'; sfx('hurt'); G.shake=10;
      return;
    }
  }

  // a mate pings you if you haven't found anyone in a while
  if(world.friends.length){
    friendDryT+=dt;
    if(friendDryT>15 && friendDryT-dt<=15){ say('YOUR FRIEND PINGS THEIR LOCATION!','#39ff14'); sfx('beep'); }
  } else friendDryT=0;

  // ----- effects tick -----
  for(const id in effects){ effects[id]-=dt; if(effects[id]<=0) delete effects[id]; }
  if(player.invuln>0) player.invuln-=dt;
  if(exitArrowT>0) exitArrowT-=dt;
  // flashlight (and I FEEL FAST) zoom the camera out ~30%
  G.zoom=lerp(G.zoom||1, (effects.torch||effects.bagfast)?0.72:1, 1-Math.pow(0.05,dt));

  // watchdog: if a button claims to be held but no touch event has arrived
  // in 3s, the browser ate a touchend — release it
  if((btnL||btnR) && performance.now()-lastTouchEvt>3000){ btnL=false; btnR=false; }

  // ----- steering: keyboard or buttons only (speeds up 30%/stage; turn scales) -----
  const smul=Math.min(Math.pow(1.3,G.stage-1),2.4);
  const turn=4.2*smul;
  const inv=effects.bagwavy?-1:1;        // waaaavvyyy swaps your controls
  if(keys['ArrowLeft']||keys['a']||btnL)  player.dir-=turn*dt*inv;
  if(keys['ArrowRight']||keys['d']||btnR) player.dir+=turn*dt*inv;
  const spd = player.speed * smul * (effects.bagfast?1.45:1) * (effects.bagwavy?0.7:1);
  player.x+=Math.cos(player.dir)*spd*dt;
  player.y+=Math.sin(player.dir)*spd*dt;

  // ----- trail record -----
  const last=trail[trail.length-1];
  const dd=Math.hypot(player.x-last.x,player.y-last.y);
  if(dd>1.5){
    trail.push({x:player.x,y:player.y});
    trailDist.push(trailDist[trailDist.length-1]+dd);
    const maxLen=(party.length+4)*SPACING+60;
    while(trailDist[trailDist.length-1]-trailDist[0]>maxLen){ trail.shift(); trailDist.shift(); }
  }

  // ----- walls -----
  const M=14;
  if(player.x<M||player.x>world.W-M||player.y<M||player.y>world.H-M){
    player.x=clamp(player.x,M+2,world.W-M-2);
    player.y=clamp(player.y,M+2,world.H-M-2);
    hitPenalty('hit the fence');
  }

  // ----- crowds -----
  for(const c of world.crowds){
    if(Math.hypot(c.x-player.x,c.y-player.y)>c.r+20) continue;
    for(const m of c.members){
      // body odour shoves the crowd away — and they STAY shoved
      if(effects.bass){
        const d=Math.hypot(m.x+m.hx-player.x,m.y+m.hy-player.y);
        if(d<110){ const a=angTo(player,{x:m.x+m.hx,y:m.y+m.hy});
          m.hx+=Math.cos(a)*60*dt*(1-d/110)*10; m.hy+=Math.sin(a)*60*dt*(1-d/110)*10;
          m.hx=clamp(m.x+m.hx,16,world.W-16)-m.x;       // keep them inside the fence
          m.hy=clamp(m.y+m.hy,16,world.H-16)-m.y; }
      }
      if(player.invuln<=0 && Math.hypot(m.x+m.hx-player.x, m.y+m.hy-player.y)<7){
        hitPenalty('crashed into the crowd'); break;
      }
    }
  }

  // ----- the art cars cruise about, breathing fire -----
  for(const ac of world.artcars||[]){
    ac.t+=dt;
    ac.dir+=Math.sin(G.t*0.4+ac.ph)*0.3*dt;
    ac.x+=Math.cos(ac.dir)*14*dt; ac.y+=Math.sin(ac.dir)*14*dt;
    const yMin=world.final?60:180;
    if(ac.x<90||ac.x>world.W-90) ac.dir=Math.PI-ac.dir;
    if(ac.y<yMin||ac.y>world.H-70) ac.dir=-ac.dir;
    ac.x=clamp(ac.x,90,world.W-90); ac.y=clamp(ac.y,yMin,world.H-70);
    const flame=(ac.t%5)<1;
    if(player.invuln<=0 && !effects.bagstrong && Math.hypot(ac.x-player.x,(ac.y-10)-player.y)<(flame?36:26)){
      const a=angTo(ac,player);
      player.x=ac.x+Math.cos(a)*46; player.y=ac.y+Math.sin(a)*46;
      hitPenalty(flame?'got singed by the art car':'bumped the art car');
      break;
    }
  }

  // ----- solid obstacles (I FEEL STRONG walks straight through, except the stage) -----
  if(player.invuln<=0){
    for(const o of world.obstacles){
      if(effects.bagstrong && o.type!=='stage') continue;
      const nx=clamp(player.x,o.x-o.w/2,o.x+o.w/2), ny=clamp(player.y,o.y-o.h/2,o.y+o.h/2);
      if(Math.hypot(nx-player.x,ny-player.y)<5){
        // shove out of the rect before penalising
        const a=angTo({x:o.x,y:o.y},player);
        player.x=o.x+Math.cos(a)*(o.w/2+8); player.y=o.y+Math.sin(a)*(o.h/2+8);
        hitPenalty('smacked into the '+OB_NAMES[o.type]);
        break;
      }
    }
  }

  // ----- scattered friends sprinting away -----
  for(const f of world.friends){
    if(f.fly>0){
      f.fly-=dt;
      f.x+=f.vx*dt; f.y+=f.vy*dt;
      f.vx*=Math.pow(0.05,dt); f.vy*=Math.pow(0.05,dt);
      f.x=clamp(f.x,30,world.W-30); f.y=clamp(f.y,30,world.H-30);
      if(f.fly<=0) settleFriend(f);   // step clear of crowds & obstacles
    }
  }

  // ----- collect friends -----
  for(let i=world.friends.length-1;i>=0;i--){
    const f=world.friends[i];
    if(f.fly>0.35) continue;                 // can't grab them mid-sprint
    if(Math.hypot(f.x-player.x,f.y-player.y)<11){
      world.friends.splice(i,1);
      party.push({pal:f.pal});
      G.totalCollected++; friendDryT=0;
      sfx('pick');
      say(`FOUND A FRIEND! ${party.length}/${world.final?world.crewMax:friendsNeeded(G.stage)}`,'#39ff14');
      if(party.length>=friendsNeeded(G.stage) && !exitGate){
        spawnExit(); }
    }
  }

  // ----- totems (respawn elsewhere 20s after pickup) -----
  for(const tm of world.totems){
    if(!tm.taken && Math.hypot(tm.x-player.x,tm.y-player.y)<12){
      tm.taken=true; tm.respawnT=20;
      if(tm.type.id==='shield') G.shield=true;       // a one-hit shield, not a timer
      else effects[tm.type.id]=tm.type.dur;
      say(tm.type.name+'!', tm.type.col, tm.type.msg);
      sfx('totem');
    } else if(tm.taken){
      tm.respawnT-=dt;
      if(tm.respawnT<=0){
        const p=freeSpot(world,55);
        tm.x=p.x; tm.y=p.y; tm.taken=false; tm.ph=rnd(0,TAU);
        tm.type=choice(world.final ? TOTEMS.filter(t=>t.id!=='flag') : TOTEMS);
      }
    }
  }

  // ----- mysterious baggies: pickup + respawn -----
  for(const b of world.baggies||[]){
    if(!b.taken && Math.hypot(b.x-player.x,b.y-player.y)<10){
      b.taken=true; b.respawnT=25;
      applyBag();
    } else if(b.taken){
      b.respawnT-=dt;
      if(b.respawnT<=0){
        if(!world.final){ const p=freeSpot(world,50); b.x=p.x; b.y=p.y; }
        b.taken=false; b.ph=rnd(0,TAU);
      }
    }
  }

  // ----- SQUAD FLAG / I FEEL LOVED: mates trek toward you -----
  if(effects.flag||effects.bagloved){
    for(const f of world.friends){
      if(f.fly>0) continue;
      const a=angTo(f,player);
      f.x+=Math.cos(a)*42*dt; f.y+=Math.sin(a)*42*dt;
      f.walkA=a;
    }
  }

  // ----- self collision: cut the tail -----
  const members=partyPositions();
  const trailLen=trailDist[trailDist.length-1]-trailDist[0];
  for(let i=2;i<members.length;i++){
    if((i+1)*SPACING > trailLen-4) break;   // member still bunched at trail start
    if(Math.hypot(members[i].x-player.x,members[i].y-player.y)<6 && player.invuln<=0 && !effects.mum && !effects.bagstrong){
      const cut=party.length-i;
      scatterFriends(cut,'tangled the train');
      say(`TRAIN WRECK! ${cut} scattered!`,'#ff6d00');
      sfx('cut');
      player.invuln=1.2;
      break;
    }
  }

  // ----- exit -----
  if(exitGate && Math.hypot(exitGate.x-player.x,exitGate.y-player.y)<16){
    sfx('exit');
    if(world.final){
      winCrew=party.length; winT=0;
      winTime=clamp(30-(world.timer||0), 0, 30);   // elapsed run time — the leaderboard stat
      winPals=[CHARS[G.charIdx], ...party.map(p=>p.pal)];
      // one name per person on the bus — you first, then random unique picks
      const me=CHARS[G.charIdx].name.split(' ')[0];
      winNames=[me.charAt(0)+me.slice(1).toLowerCase()];
      const pool=RAVER_NAMES.filter(n=>n.toUpperCase()!==me).sort(()=>Math.random()-0.5);
      for(let i=0;i<winCrew;i++) winNames.push(pool[i%pool.length]);
      // full bus = leaderboard run; the prompt opens after the bus rolls in
      lbQualified = !!LB_URL && winCrew>=LB_QUALIFY;
      lbPrompted=false; lbSubmitted=false;
      G.state='win';
    }
    else beginTransition();
  }

  updateCamera(dt);
}

function spawnExit(){
  const W=world.W,H=world.H;
  let p,k=0;
  do{
    const side=ri(0,3);
    p = side===0?{x:rnd(100,W-100),y:24}
      : side===1?{x:rnd(100,W-100),y:H-24}
      : side===2?{x:24,y:rnd(100,H-100)}
      : {x:W-24,y:rnd(100,H-100)};
  } while(k++<30 && hitsObstacle(world,p,28));   // never behind the stage
  exitGate=p;
  exitArrowT=3.5;
  say("EVERYONE'S HERE! HEAD FOR THE EXIT!",'#f5d300');
  sfx('exit');
}

// positions of party members along the trail
function partyPositions(){
  const out=[]; if(!trail.length) return out;
  const total=trailDist[trailDist.length-1];
  let idx=trail.length-1;
  for(let i=0;i<party.length;i++){
    const want=total-(i+1)*SPACING;
    while(idx>0 && trailDist[idx]>want) idx--;
    const a=trail[idx], b=trail[Math.min(idx+1,trail.length-1)];
    const da=trailDist[idx], db=trailDist[Math.min(idx+1,trailDist.length-1)];
    const t=db>da?clamp((want-da)/(db-da),0,1):0;
    out.push({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)});
  }
  return out;
}

function updateCamera(dt){
  const Z=G.zoom||1, vw=VW/Z, vh=VH/Z;
  // letterbox small worlds (e.g. the corridor finale on a tall phone)
  const tx = world.W<vw ? -(vw-world.W)/2 : clamp(player.x-vw/2, -40, world.W-vw+40);
  const ty = world.H<vh ? -(vh-world.H)/2 : clamp(player.y-vh/2, -40, world.H-vh+40);
  camera.x=lerp(camera.x, tx, 1-Math.pow(0.001,dt));
  camera.y=lerp(camera.y, ty, 1-Math.pow(0.001,dt));
}

// ----- transition: seamless slide to the next stage -----
function beginTransition(){
  // snapshot the current frame, generate next stage, slide the old view away
  const snap=document.createElement('canvas'); snap.width=cv.width; snap.height=cv.height;
  snap.getContext('2d').drawImage(cv,0,0);
  // you slide over with the map: re-enter from the OPPOSITE side
  const frac={x:1-exitGate.x/world.W, y:1-exitGate.y/world.H};
  startStage(G.stage+1,true,frac);       // builds new world + cutscene
  transition={t:0, snap};
  G.state='transition';
}
function updateTransition(dt){
  transition.t+=dt;
  updateCamera(dt);
  if(transition.t>=1.2){ transition=null; G.state='cutscene'; }
}
function updateCutscene(dt){
  const c=cutscene; c.t+=dt;
  // phases: 0 walk in (1.2s) | 1 dance (2.2s) | 2 spin (1.2s) | 3 run off (1s)
  const lens=[1.2,2.2,1.2,1.0];
  if(c.t>lens[c.phase]){ c.t=0; c.phase++;
    if(c.phase>=4){ cutscene=null; phoneStart(); return; }
  }
  updateCamera(dt);
}
// ============================================================
//  RENDER
// ============================================================
function hash2(i,j){ const s=Math.sin(i*127.1+j*311.7)*43758.5453; return s-Math.floor(s); }
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

const crEl=document.getElementById('cr');
const kofiEl=document.getElementById('kofi');
let crShown=null, kofiShown=null, lbBtnShown=null;
function render(){
  // links only on menu screens — never a tap hazard mid-game
  const showCr = G.state==='select'||G.state==='win'||G.state==='gameover';
  if(showCr!==crShown){ crShown=showCr; if(crEl) crEl.style.display=showCr?'block':'none'; }
  const showKofi = G.state==='select'||G.state==='win';
  if(showKofi!==kofiShown){ kofiShown=showKofi; if(kofiEl) kofiEl.style.display=showKofi?'block':'none'; }
  const showLb = !!LB_URL && (G.state==='select'||G.state==='win');
  if(showLb!==lbBtnShown){ lbBtnShown=showLb; if(lbBtnEl) lbBtnEl.style.display=showLb?'block':'none'; if(!showLb) lbHide(); }
  cx.setTransform(PIX,0,0,PIX,0,0);
  cx.fillStyle='#07030f'; cx.fillRect(0,0,VW,VH);
  switch(G.state){
    case 'select': renderSelect(); break;
    case 'win': renderWin(); break;
    case 'gameover': renderPlay(); renderGameOver(); break;
    case 'phone': renderPlay(); renderPhone(); break;
    case 'cutscene': renderPlay(); renderCutscene(); break;
    case 'flash': renderPlay(); renderFlash(); break;
    case 'transition':
      renderPlay();
      if(transition){
        const off=ease(clamp(transition.t/1.1,0,1))*VW;
        cx.drawImage(transition.snap, -Math.round(off), 0, VW, VH);
      }
      break;
    default: renderPlay(); postFX(); renderHUD();
  }
}

// ---------- world ----------
function renderPlay(){
  const Z=G.zoom||1, vw=VW/Z, vh=VH/Z;
  const sx=Math.round(camera.x - (G.shake? rnd(-G.shake,G.shake):0));
  const sy=Math.round(camera.y - (G.shake? rnd(-G.shake,G.shake):0));
  cx.save(); cx.scale(Z,Z); cx.translate(-sx,-sy);

  // ground — solid base with a subtle big checkerboard, reads as one floor
  cx.fillStyle='#130a21'; cx.fillRect(sx,sy,vw+2,vh+2);
  const T=24;
  cx.fillStyle='#180e2b';
  for(let gx=Math.floor(sx/T)*T; gx<sx+vw+T; gx+=T)
    for(let gy=Math.floor(sy/T)*T; gy<sy+vh+T; gy+=T)
      if(((gx+gy)/T)%2===0) cx.fillRect(gx,gy,T,T);
  // fence
  cx.fillStyle='#3a2f55';
  for(let x=0;x<world.W;x+=20){ if(x>sx-20&&x<sx+vw){ cx.fillRect(x,8,3,8); cx.fillRect(x,world.H-16,3,8);} }
  for(let y=0;y<world.H;y+=20){ if(y>sy-20&&y<sy+vh){ cx.fillRect(8,y,8,3); cx.fillRect(world.W-16,y,8,3);} }
  cx.fillStyle='#241b3a';
  cx.fillRect(0,12,world.W,2); cx.fillRect(0,world.H-12,world.W,2);
  cx.fillRect(12,0,2,world.H); cx.fillRect(world.W-12,0,2,world.H);

  // solid obstacles
  for(const o of world.obstacles){
    if(o.x+o.w<sx-30||o.x-o.w>sx+vw+30||o.y+o.h<sy-40||o.y-o.h>sy+vh+40) continue;
    drawObstacle(o);
  }

  // exit gate (in world — only visible if in fog hole, fine)
  if(exitGate) drawExit(exitGate.x,exitGate.y);

  // the art cars (between obstacles and friends)
  for(const ac of world.artcars||[])
    if(ac.x>sx-100 && ac.x<sx+vw+100 && ac.y>sy-100 && ac.y<sy+vh+100) drawArtCar(ac);

  // friends — raving hard, glowsticks in the air (your people!)
  const fr=Math.floor(G.t*4)%2;
  for(const f of world.friends){
    if(f.x<sx-20||f.x>sx+vw+20||f.y<sy-25||f.y>sy+vh+25) continue;
    const flying=f.fly>0;
    const bob=Math.sin(G.t*6+f.ph)>0?1:0;
    // glow halo so your mates stand out
    const hg=cx.createRadialGradient(f.x,f.y-8,2,f.x,f.y-8,14+2*Math.sin(G.t*5+f.ph));
    hg.addColorStop(0,f.pal.glow+'77'); hg.addColorStop(1,f.pal.glow+'00');
    cx.fillStyle=hg; cx.fillRect(f.x-16,f.y-24,32,32);
    cx.fillStyle=f.pal.glow+'44'; cx.fillRect(f.x-6,f.y-2,12,3);
    if(flying){ // sprinting away, arms down, facing where they're running
      drawRaver(cx,f.x,f.y,f.pal,Math.floor(G.t*14+f.ph)%2,
        {armsUp:false, facing:dirFacing(Math.atan2(f.vy,f.vx))});
    } else if(effects.flag||effects.bagloved){ // marching to the flag!
      drawRaver(cx,f.x,f.y,f.pal,Math.floor(G.t*10+f.ph)%2,
        {armsUp:false, facing:dirFacing(f.walkA||0)});
    } else {
      drawRaver(cx,f.x,f.y-bob,f.pal,(fr+Math.floor(f.ph))%2,{armsUp:true,facing:'down'});
      // little "!" sparkle
      if(Math.sin(G.t*3+f.ph)>0.6){ cx.fillStyle='#fff'; cx.fillRect(f.x+6,f.y-20,1,3); cx.fillRect(f.x+6,f.y-16,1,1); }
    }
  }

  // crowds — arms down, just standing about watching the stage
  // (unless you FEEL LOVED, in which case everyone looks like your friend)
  const loved=!!effects.bagloved;
  for(const c of world.crowds){
    if(c.x+c.r<sx-25||c.x-c.r>sx+vw+25||c.y+c.r<sy-25||c.y-c.r>sy+vh+25) continue;
    for(const m of c.members){
      if(loved){
        const mx2=m.x+m.hx, my2=m.y+m.hy;   // soft halo, same as friends
        const hg=cx.createRadialGradient(mx2,my2-8,2,mx2,my2-8,14+2*Math.sin(G.t*5+m.ph));
        hg.addColorStop(0,m.pal.glow+'77'); hg.addColorStop(1,m.pal.glow+'00');
        cx.fillStyle=hg; cx.fillRect(mx2-16,my2-24,32,32);
        cx.fillStyle=m.pal.glow+'44'; cx.fillRect(mx2-5,my2-2,10,3);
        drawRaver(cx,mx2,my2,m.pal,Math.floor(G.t*6+m.ph)%2,{armsUp:true,facing:'down'});
      } else {
        const shuffle=Math.floor(G.t*1.5+m.ph)%2;
        drawRaver(cx,m.x+m.hx,m.y+m.hy,m.pal,shuffle,{dim:0.55,armsUp:false,facing:m.facing,faceless:true});
      }
    }
  }

  // mysterious baggies, floating
  for(const b of world.baggies||[]){
    if(b.taken||b.x<sx-20||b.x>sx+vw+20||b.y<sy-25||b.y>sy+vh+25) continue;
    drawBaggy(b);
  }

  // totems (world layer)
  for(const tm of world.totems){ if(!tm.taken) drawTotem(tm); }

  // party + player
  const members=partyPositions();
  for(let i=members.length-1;i>=0;i--){
    const m=members[i], bob=Math.floor(G.t*8+i)%2;
    const lead = i===0? player : members[i-1];
    drawRaver(cx,m.x,m.y,party[i].pal,bob,{facing:dirFacing(angTo(m,lead)),armsUp:true});
  }
  if(player.invuln<=0 || Math.floor(G.t*10)%2===0){
    const pal=CHARS[G.charIdx];
    const checking = G.state==='phone';
    if(effects.mum){ // mum's protective aura
      const mg=cx.createRadialGradient(player.x,player.y-8,3,player.x,player.y-8,20);
      mg.addColorStop(0,'#ff8fab66'); mg.addColorStop(1,'#ff8fab00');
      cx.fillStyle=mg; cx.fillRect(player.x-20,player.y-28,40,40);
    }
    cx.fillStyle=pal.glow+'55'; cx.fillRect(player.x-6,player.y-2,12,3);
    drawRaver(cx,player.x,player.y,pal, checking?0:Math.floor(G.t*8)%2,
      {facing: checking?'down':dirFacing(player.dir), armsUp:!checking});
    if(checking){ // wee glowing phone in hand
      cx.fillStyle='#9be7ff'; cx.fillRect(player.x+2,player.y-4.5,2,3);
      cx.fillStyle='#9be7ff33'; cx.fillRect(player.x,player.y-6.5,6,7);
    }
    if(effects.flag){ // the squad flag, waving above your head
      const wob=Math.sin(G.t*7)*1.5;
      cx.fillStyle='#c9b78a'; cx.fillRect(player.x+5,player.y-28,1,16);
      cx.fillStyle='#ffffff'; cx.fillRect(player.x+6,player.y-28+wob*0.3,6,3);
      cx.fillStyle='#ff2d95'; cx.fillRect(player.x+6,player.y-25+wob*0.3,4,2);
    }
  }
  // direction arrow — shows where the train is heading
  {
    const pal=CHARS[G.charIdx];
    const ax=player.x+Math.cos(player.dir)*15, ay=player.y-6+Math.sin(player.dir)*15;
    cx.save(); cx.translate(ax,ay); cx.rotate(player.dir);
    cx.globalAlpha=0.65+0.3*Math.sin(G.t*6);
    cx.fillStyle=pal.glow;
    cx.beginPath(); cx.moveTo(5,0); cx.lineTo(-3,-4); cx.lineTo(-1,0); cx.lineTo(-3,4); cx.closePath(); cx.fill();
    cx.restore(); cx.globalAlpha=1;
  }

  // bright laser pass — fixed to the map, inside the vision bubble
  drawWorldLasers(0.15,sx,sy,vw,vh);

  cx.restore();

  // ---------- fog of war ----------
  if(G.state!=='select'){
    const lit=!!effects.glow;   // FAMILY PHOTO: the lights are on!
    const tunnel=!!effects.bagstrong;   // I FEEL STRONG: cone vision ONLY
    const R=(VISION*(lit?1.8:1)*(effects.bagfast?1.5:1) * (G.state==='flash'?1.2:1))*Z;
    const px=(player.x-sx)*Z, py=(player.y-sy)*Z;
    const FW=fogC.width, FH=fogC.height;
    fx.clearRect(0,0,FW,FH);
    fx.fillStyle=lit?'rgba(4,2,14,0.6)':'rgba(4,2,14,0.985)';
    fx.fillRect(0,0,FW,FH);
    fx.globalCompositeOperation='destination-out';
    if(!tunnel){
      const grd=fx.createRadialGradient(px/FOGS,py/FOGS,R*0.72/FOGS,px/FOGS,py/FOGS,R/FOGS);
      grd.addColorStop(0,'rgba(0,0,0,1)'); grd.addColorStop(0.8,'rgba(0,0,0,0.55)'); grd.addColorStop(1,'rgba(0,0,0,0)');
      fx.fillStyle=grd; fx.fillRect(0,0,FW,FH);
    } else { // tiny halo so you can at least see your own feet
      const grd=fx.createRadialGradient(px/FOGS,py/FOGS,8/FOGS,px/FOGS,py/FOGS,30*Z/FOGS);
      grd.addColorStop(0,'rgba(0,0,0,1)'); grd.addColorStop(1,'rgba(0,0,0,0)');
      fx.fillStyle=grd; fx.fillRect(0,0,FW,FH);
    }
    // FLASHLIGHT / I FEEL STRONG — a cone of light carving through the fog
    if(effects.torch||tunnel){
      const cl=R*2.6, half=tunnel?0.5:0.42;
      const g2=fx.createRadialGradient(px/FOGS,py/FOGS,R*0.3/FOGS,px/FOGS,py/FOGS,cl/FOGS);
      g2.addColorStop(0,'rgba(0,0,0,1)'); g2.addColorStop(0.8,'rgba(0,0,0,0.85)'); g2.addColorStop(1,'rgba(0,0,0,0)');
      fx.fillStyle=g2;
      fx.beginPath();
      fx.moveTo(px/FOGS,py/FOGS);
      fx.arc(px/FOGS,py/FOGS,cl/FOGS, player.dir-half, player.dir+half);
      fx.closePath(); fx.fill();
    }
    // art cars light up the field around them (flaring when they breathe fire)
    for(const ac of world.artcars||[]){
      const fl=(ac.t%5)<1;
      const ax=(ac.x-sx)*Z, ay=(ac.y-16-sy)*Z;
      const ar=(fl? 150+Math.sin(G.t*30)*10 : 85)*Z;
      const g3=fx.createRadialGradient(ax/FOGS,ay/FOGS,ar*0.25/FOGS,ax/FOGS,ay/FOGS,ar/FOGS);
      g3.addColorStop(0,'rgba(0,0,0,0.95)'); g3.addColorStop(1,'rgba(0,0,0,0)');
      fx.fillStyle=g3; fx.fillRect(0,0,FW,FH);
    }
    fx.globalCompositeOperation='source-over';
    cx.drawImage(fogC,0,0,VW,VH);

    // lasers ghosting through the fog, softened
    cx.save(); cx.scale(Z,Z); cx.translate(-sx,-sy);
    drawWorldLasers(lit?0.09:0.05,sx,sy,vw,vh);
    cx.restore();

    // vision boundary — rotating dotted ring so you can SEE the fog edge
    if(!tunnel){
      cx.save();
      cx.strokeStyle=lit?'#f5d30055':'#9b7bff66'; cx.lineWidth=1;
      cx.setLineDash([3,5]); cx.lineDashOffset=-G.t*12;
      cx.beginPath(); cx.arc(px,py,R+Math.sin(G.t*2)*2,0,TAU); cx.stroke();
      cx.restore();
    }

    // ----- things visible THROUGH the fog -----
    cx.save(); cx.scale(Z,Z); cx.translate(-sx,-sy);
    for(const tm of world.totems){ if(!tm.taken) drawTotemBeacon(tm); }
    // the pinged mate glows through the fog
    if((effects.sober || friendDryT>15) && world.friends.length){
      let best=null,bd=1e9;
      for(const f of world.friends){ const d=Math.hypot(f.x-player.x,f.y-player.y); if(d<bd){bd=d;best=f;} }
      if(best){
        cx.globalAlpha=0.55+0.35*Math.sin(G.t*5);
        drawRaver(cx,best.x,best.y,best.pal,Math.floor(G.t*4)%2,{armsUp:true,facing:'down'});
        cx.fillStyle='#39ff14'; cx.fillRect(best.x-1,best.y-24,3,2); cx.fillRect(best.x,best.y-27,1,2);
        cx.globalAlpha=1;
      }
    }
    cx.restore();

    // arrows: always hug the BASE vision ring (not the enlarged one),
    // hidden once the target is actually inside vision
    const visR=VISION*(lit?1.8:1)*(effects.bagfast?1.5:1)*0.95;
    const arrowR=VISION*Z;
    if(exitGate) edgeArrow(exitGate,'#f5d300',px,py,arrowR,visR);
    if((effects.sober || friendDryT>15) && !exitGate && world.friends.length){
      let best=null,bd=1e9;
      for(const f of world.friends){ const d=Math.hypot(f.x-player.x,f.y-player.y); if(d<bd){bd=d;best=f;} }
      if(best) edgeArrow(best,'#39ff14',px,py,arrowR,visR);
    }
  }
}

// chunky pixel structures — unmistakably NOT totems
function drawObstacle(o){
  const x=Math.round(o.x), y=Math.round(o.y);
  const L=x-o.w/2, T=y-o.h/2;
  switch(o.type){
    case 'bar': {
      cx.fillStyle='#4a2c17'; cx.fillRect(L,T+6,o.w,o.h-6);
      cx.fillStyle='#6b3f20'; cx.fillRect(L,T+6,o.w,3);
      for(let i=0;i<o.w;i+=7){ cx.fillStyle=(i/7)%2?'#ff2d95':'#efe6f7'; cx.fillRect(L+i,T-6,Math.min(7,o.w-i),7); }
      for(let i=0;i<6;i++){ cx.fillStyle=['#39ff14','#00e5ff','#f5d300','#ff2d95','#b14aed','#ff6d00'][i];
        cx.fillRect(L+9+i*10,T+10,2,5); }
      cx.fillStyle='#fff'; cx.font='bold 8px monospace'; cx.textAlign='center'; cx.fillText('B A R',x,T+4);
      break; }
    case 'loo': {
      const n=4, cw=Math.floor(o.w/n);
      for(let i=0;i<n;i++){
        const cl=L+i*cw;
        cx.fillStyle='#0e7490'; cx.fillRect(cl,T,cw-2,o.h);
        cx.fillStyle='#a5f3fc'; cx.fillRect(cl,T,cw-2,2);
        cx.fillStyle='#155e75'; cx.fillRect(cl+2,T+4,cw-6,o.h-5);
        cx.fillStyle='#fff'; cx.fillRect(cl+cw-6,T+Math.floor(o.h/2),1,3);
      }
      cx.fillStyle='#fff'; cx.font='bold 6px monospace'; cx.textAlign='center'; cx.fillText('WC',L+8,T-2);
      break; }
    case 'speaker': {
      // stack of classic round-cone speakers, 2 wide x 3 high
      cx.fillStyle='#0c0c14'; cx.fillRect(L,T,o.w,o.h);
      const th=Math.sin(G.t*8+o.ph)>0;
      for(let r=0;r<3;r++) for(let c=0;c<2;c++){
        const bx=L+2+c*18, by2=T+2+r*14;
        cx.fillStyle='#1d1d28'; cx.fillRect(bx,by2,17,13);          // cabinet
        cx.fillStyle='#0c0c14'; cx.fillRect(bx+1,by2+1,15,11);
        const ccx=bx+8.5, ccy=by2+6.5;
        cx.beginPath(); cx.arc(ccx,ccy,5.5,0,TAU); cx.fillStyle='#2e2e40'; cx.fill();   // surround
        cx.beginPath(); cx.arc(ccx,ccy,4.2,0,TAU); cx.fillStyle='#15151f'; cx.fill();   // cone
        const punch=th&&r===2?2.6:2.1;                                                   // bottom row thumps
        cx.beginPath(); cx.arc(ccx,ccy,punch,0,TAU); cx.fillStyle='#3c3c52'; cx.fill();
        cx.beginPath(); cx.arc(ccx,ccy,1,0,TAU); cx.fillStyle='#8a8aa8'; cx.fill();      // dust cap
      }
      cx.fillStyle=th?'#ff2d95':'#3a1a2e'; cx.fillRect(x-4,T-3,8,3);
      break; }
    case 'tent': {
      cx.fillStyle='#3d2a63'; cx.fillRect(L,T+6,o.w,o.h-6);
      for(let i=0;i<o.w;i+=5){ cx.fillStyle=(i/5)%2?'#7c3aed':'#2a1b47'; cx.fillRect(L+i,T,Math.min(5,o.w-i),7); }
      cx.fillStyle='#150c26'; cx.fillRect(x-4,T+8,8,o.h-8);
      cx.fillStyle='#f5d300'; cx.fillRect(x-5,T+6,10,1);
      break; }
    case 'merch': {
      cx.fillStyle='#2a2a3a'; cx.fillRect(L,T+5,o.w,o.h-5);
      for(let i=0;i<o.w;i+=8){ cx.fillStyle=(i/8)%2?'#00e5ff':'#0d0d18'; cx.fillRect(L+i,T-5,Math.min(8,o.w-i),6); }
      // hanging tees
      ['#ff2d95','#39ff14','#f5d300','#b14aed'].forEach((c,i)=>{
        const tx2=L+7+i*11;
        cx.fillStyle=c; cx.fillRect(tx2,T+8,7,6); cx.fillRect(tx2-1,T+8,9,2);
      });
      cx.fillStyle='#fff'; cx.font='bold 7px monospace'; cx.textAlign='center'; cx.fillText('MERCH',x,T+4);
      break; }
    case 'bin': {
      [0,1,2].forEach(i=>{
        const bx=L+i*12;
        cx.fillStyle='#1e2a1e'; cx.fillRect(bx,T+3,10,o.h-3);
        cx.fillStyle='#162016'; cx.fillRect(bx+1,T+6,8,2);             // band
        cx.fillStyle=['#39ff14','#00e5ff','#f5d300'][i]; cx.fillRect(bx-1,T,12,4);  // lid
        cx.fillStyle='#0d140d'; cx.fillRect(bx+3,T+1,4,2);             // flap
        cx.fillStyle='#0d140d'; cx.fillRect(bx+1,T+o.h-1,3,1); cx.fillRect(bx+6,T+o.h-1,3,1);
      });
      // flies
      const fa=G.t*7+o.ph;
      cx.fillStyle='#a3e635';
      cx.fillRect(Math.round(x+Math.cos(fa)*9), Math.round(T-5+Math.sin(fa*1.7)*4), 1,1);
      cx.fillRect(Math.round(x-6+Math.cos(fa*1.3+2)*7), Math.round(T-3+Math.sin(fa*2.1)*3), 1,1);
      break; }
    case 'stage': {
      // platform
      cx.fillStyle='#1a1230'; cx.fillRect(L,T,o.w,o.h);
      cx.fillStyle='#241b3a'; cx.fillRect(L,T+o.h-7,o.w,7);          // front skirt
      cx.fillStyle='#4a3d6e'; cx.fillRect(L,T+o.h-8,o.w,1);          // lip highlight
      // big speaker walls each side
      [L+4, L+o.w-22].forEach(bx=>{
        cx.fillStyle='#0c0c14'; cx.fillRect(bx,T+8,18,o.h-20);
        cx.fillStyle='#23232f'; cx.fillRect(bx+2,T+11,14,9); cx.fillRect(bx+2,T+22,14,9);
        cx.fillStyle='#44445a'; cx.fillRect(bx+6,T+13,6,5); cx.fillRect(bx+6,T+24,6,5);
      });
      // DJ behind the booth
      drawRaver(cx,x,T+34,world.djPal,Math.floor(G.t*4)%2,
        {facing:'down', armsUp:Math.floor(G.t*2)%2===0});
      // booth (covers DJ's legs)
      cx.fillStyle='#0c0c14'; cx.fillRect(x-24,T+22,48,13);
      cx.fillStyle=Math.sin(G.t*4)>0?'#ff2d95':'#00e5ff'; cx.fillRect(x-24,T+22,48,2);
      cx.fillStyle='#33333f'; cx.fillRect(x-18,T+27,10,4); cx.fillRect(x+8,T+27,10,4); // decks
      // laser truss above
      cx.fillStyle='#3a2f55';
      cx.fillRect(L+6,T-12,3,12); cx.fillRect(L+o.w-9,T-12,3,12);
      cx.fillRect(L+6,T-12,o.w-12,2);
      // stage name sign
      cx.fillStyle='#f5d300'; cx.font='bold 7px monospace'; cx.textAlign='center';
      cx.fillText(STAGE_NAMES[(G.stage-1)%STAGE_NAMES.length], x, T-3);
      break; }
  }
}

// ART CARS — three designs: El Pulpo (octopus), the Dragon, the Boombox
function drawArtCar(ac){
  const x=Math.round(ac.x), y=Math.round(ac.y);
  const flame=(ac.t%5)<1, kind=ac.kind||0;
  // warm ground glow
  const gr=cx.createRadialGradient(x,y-8,4,x,y-8,flame?85:48);
  gr.addColorStop(0,flame?'#ffb34755':'#ff8c2a33'); gr.addColorStop(1,'rgba(255,140,42,0)');
  cx.fillStyle=gr; cx.fillRect(x-85,y-90,170,150);
  // wheels + truck base (shared)
  cx.fillStyle='#0d0b16'; cx.fillRect(x-20,y-4,8,6); cx.fillRect(x+12,y-4,8,6);
  cx.fillStyle='#33333f'; cx.fillRect(x-18,y-2,4,2); cx.fillRect(x+14,y-2,4,2);
  cx.fillStyle='#8a7a55'; cx.fillRect(x-24,y-14,48,12);
  cx.fillStyle='#a89868'; cx.fillRect(x-24,y-14,48,3);
  cx.fillStyle='#5a4d35'; cx.fillRect(x-18,y-10,10,6);
  cx.fillStyle=Math.sin(G.t*3)>0?'#ffd34d':'#aa8c2a'; cx.fillRect(x+17,y-10,5,3);
  let jets;
  if(kind===0){ // EL PULPO — golden octopus
    cx.fillStyle='#c9912f'; cx.fillRect(x-10,y-34,20,20);
    cx.fillStyle='#e0a93e'; cx.fillRect(x-8,y-37,16,5);
    cx.fillStyle='#8a5d18'; cx.fillRect(x-10,y-22,20,2); cx.fillRect(x-10,y-27,20,1);
    cx.fillStyle='#ffe9a8'; cx.fillRect(x-7,y-31,5,5); cx.fillRect(x+2,y-31,5,5);
    cx.fillStyle='#1a1208'; cx.fillRect(x-5,y-30,2,3); cx.fillRect(x+4,y-30,2,3);
    cx.fillStyle='#c9912f';
    cx.fillRect(x-17,y-26,7,3); cx.fillRect(x-20,y-33,4,9); cx.fillRect(x-20,y-35,6,3);
    cx.fillRect(x+10,y-26,7,3); cx.fillRect(x+16,y-33,4,9); cx.fillRect(x+14,y-35,6,3);
    jets=[[x-18,y-35],[x-1,y-39],[x+18,y-35]];
  } else if(kind===1){ // THE DRAGON — green serpent, horns, fire from the head
    cx.fillStyle='#2e7d32'; cx.fillRect(x-9,y-30,18,16);            // coiled body
    cx.fillStyle='#1b5e20'; cx.fillRect(x-9,y-21,18,2);
    cx.fillStyle='#e53935'; cx.fillRect(x-7,y-33,3,3); cx.fillRect(x-1,y-34,3,4); cx.fillRect(x+5,y-33,3,3); // back spikes
    cx.fillStyle='#43a047'; cx.fillRect(x-1,y-43,13,13);            // head, raised
    cx.fillStyle='#1b5e20'; cx.fillRect(x-1,y-33,13,2);             // jaw
    cx.fillStyle='#ffd34d'; cx.fillRect(x+5,y-40,4,4);              // eye
    cx.fillStyle='#1a1208'; cx.fillRect(x+7,y-39,2,2);
    cx.fillStyle='#e53935'; cx.fillRect(x+1,y-47,2,4); cx.fillRect(x+7,y-48,2,5); // horns
    cx.fillStyle='#2e7d32'; cx.fillRect(x-16,y-24,7,4); cx.fillRect(x-20,y-28,5,3); // tail
    jets=[[x+10,y-44],[x+3,y-46]];
  } else { // THE BOOMBOX — wall of sound on wheels
    cx.fillStyle='#23232f'; cx.fillRect(x-16,y-38,32,24);
    cx.fillStyle='#3a3a4e'; cx.fillRect(x-14,y-36,28,20);
    [[x-7],[x+7]].forEach(([ccx])=>{                                 // round cones
      cx.beginPath(); cx.arc(ccx,y-25,5.5,0,TAU); cx.fillStyle='#15151f'; cx.fill();
      cx.beginPath(); cx.arc(ccx,y-25,Math.sin(G.t*8+ac.ph)>0?3:2.4,0,TAU); cx.fillStyle='#44445e'; cx.fill();
      cx.beginPath(); cx.arc(ccx,y-25,1,0,TAU); cx.fillStyle='#8a8aa8'; cx.fill();
    });
    cx.fillStyle='#0c0c14'; cx.fillRect(x-6,y-35,12,5);             // tape deck
    cx.fillStyle='#ff2d95'; cx.fillRect(x-4,y-34,3,3);
    cx.fillStyle='#00e5ff'; cx.fillRect(x+1,y-34,3,3);
    cx.fillStyle='#55556e'; cx.fillRect(x-13,y-41,3,4); cx.fillRect(x+10,y-41,3,4); // exhaust pipes
    jets=[[x-12,y-40],[x+12,y-40]];
  }
  // FIRE — every 5 seconds
  if(flame){
    jets.forEach(([jx,jy],i)=>{
      const h=9+((G.t*40+i*7)%9);
      cx.fillStyle='#ff6d00'; cx.fillRect(jx-3,jy-h,6,h);
      cx.fillStyle='#ffd34d'; cx.fillRect(jx-2,jy-h+2,4,h-4);
      cx.fillStyle='#fff7d0'; cx.fillRect(jx-1,jy-h+4,2,4);
    });
  }
}

// lasers from the stage truss, FIXED to the map (drawn in world space)
function drawWorldLasers(alpha,sx,sy,vw=VW,vh=VH){
  cx.save();
  cx.globalCompositeOperation='lighter';
  const cols=['#ff2d95','#00e5ff','#39ff14','#f5d300','#7c3aed'];
  const len=Math.min(world.H*0.9, 1200);   // beams reach right across the field
  for(const L of world.lasers){
    if(L.x<sx-len||L.x>sx+vw+len||L.y>sy+vh) continue;
    const a=Math.PI/2 + Math.sin(G.t*L.sp+L.ph)*0.95;
    const w=0.035+0.015*Math.sin(G.t*0.8+L.ph);
    cx.globalAlpha=alpha;
    cx.fillStyle=cols[L.c];
    cx.beginPath();
    cx.moveTo(L.x,L.y);
    cx.lineTo(L.x+Math.cos(a-w)*len, L.y+Math.sin(a-w)*len);
    cx.lineTo(L.x+Math.cos(a+w)*len, L.y+Math.sin(a+w)*len);
    cx.closePath(); cx.fill();
    // hot core
    cx.globalAlpha=alpha*0.5;
    cx.fillStyle='#ffffff';
    cx.beginPath();
    cx.moveTo(L.x,L.y);
    cx.lineTo(L.x+Math.cos(a-0.006)*len, L.y+Math.sin(a-0.006)*len);
    cx.lineTo(L.x+Math.cos(a+0.006)*len, L.y+Math.sin(a+0.006)*len);
    cx.closePath(); cx.fill();
    // truss-mounted fixture
    cx.globalAlpha=Math.min(1,alpha*4);
    cx.fillStyle='#2a2240'; cx.fillRect(L.x-3,L.y-4,6,4);
    cx.fillStyle=cols[L.c]; cx.fillRect(L.x-2,L.y-1,4,2);
  }
  cx.restore();
}

// sweeping rave lasers, screen-space — title screen only
function renderLasers(alpha){
  cx.save();
  cx.globalCompositeOperation='lighter';
  cx.globalAlpha=alpha;
  const cols=['#ff2d95','#00e5ff','#39ff14','#f5d300','#7c3aed'];
  for(let i=0;i<4;i++){
    const ox=VW*(0.12+0.25*i);
    const a=Math.PI/2 + Math.sin(G.t*(0.45+i*0.17)+i*1.9)*0.85;
    const w=0.045+0.02*Math.sin(G.t*0.9+i);
    const len=420;
    cx.fillStyle=cols[(i+Math.floor(G.t/3))%cols.length];
    cx.beginPath();
    cx.moveTo(ox,-6);
    cx.lineTo(ox+Math.cos(a-w)*len, -6+Math.sin(a-w)*len);
    cx.lineTo(ox+Math.cos(a+w)*len, -6+Math.sin(a+w)*len);
    cx.closePath(); cx.fill();
    // hot core line
    cx.fillStyle='#ffffff';
    cx.globalAlpha=alpha*0.5;
    cx.beginPath();
    cx.moveTo(ox,-6);
    cx.lineTo(ox+Math.cos(a-0.006)*len, -6+Math.sin(a-0.006)*len);
    cx.lineTo(ox+Math.cos(a+0.006)*len, -6+Math.sin(a+0.006)*len);
    cx.closePath(); cx.fill();
    cx.globalAlpha=alpha;
  }
  cx.restore();
}

// pulsing chevron arrow, riding the vision-circle boundary so it's never
// hidden under the touch buttons. Hidden once the target is inside vision.
function edgeArrow(target,col,px,py,R,hideDist=0){
  if(hideDist>0 && Math.hypot(target.x-player.x,target.y-player.y)<hideDist) return;
  const a=angTo(player,target);
  const ex=px+Math.cos(a)*(R-14), ey=py+Math.sin(a)*(R-14);
  cx.save(); cx.translate(ex,ey); cx.rotate(a);
  const pulse=1+0.14*Math.sin(G.t*6);
  cx.scale(pulse,pulse);
  cx.fillStyle='#000000cc';   // outline backing
  cx.beginPath(); cx.moveTo(14,0); cx.lineTo(-7,-8); cx.lineTo(-3,0); cx.lineTo(-7,8); cx.closePath(); cx.fill();
  cx.fillStyle=col;
  cx.beginPath(); cx.moveTo(11,0); cx.lineTo(-5,-6); cx.lineTo(-2,0); cx.lineTo(-5,6); cx.closePath(); cx.fill();
  cx.restore();
}

// ---------- post effects (the baggy is hitting) ----------
function postFX(){
  const hasFX=effects.bagstrong||effects.bagfast||effects.bagwavy||effects.bagloved;
  if(!hasFX) return;
  const W=cv.width, H=cv.height;
  cx.setTransform(1,0,0,1,0,0);

  if(effects.bagwavy){            // subtle screen wobble
    px2.clearRect(0,0,W,H); px2.drawImage(cv,0,0);
    cx.clearRect(0,0,W,H);
    const t=G.t*2.6;
    for(let y=0;y<H;y+=6){
      const off=Math.sin(y*0.035+t)*4;
      cx.drawImage(postC, 0,y,W,6, off,y,W,6);
    }
  }
  if(effects.bagstrong){          // chromatic aberration + contrast
    px2.clearRect(0,0,W,H); px2.drawImage(cv,0,0);
    // red ghost, shifted right
    tx2.globalCompositeOperation='source-over'; tx2.clearRect(0,0,W,H); tx2.drawImage(postC,0,0);
    tx2.globalCompositeOperation='multiply'; tx2.fillStyle='#ff3030'; tx2.fillRect(0,0,W,H);
    cx.globalCompositeOperation='lighter'; cx.globalAlpha=0.5;
    cx.drawImage(tintC,5,0);
    // cyan ghost, shifted left
    tx2.globalCompositeOperation='source-over'; tx2.clearRect(0,0,W,H); tx2.drawImage(postC,0,0);
    tx2.globalCompositeOperation='multiply'; tx2.fillStyle='#30ffff'; tx2.fillRect(0,0,W,H);
    cx.drawImage(tintC,-5,0);
    // contrast punch
    cx.globalCompositeOperation='overlay'; cx.globalAlpha=0.35;
    cx.drawImage(postC,0,0);
    cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
  }
  if(effects.bagfast){            // motion blur via frame ghosting
    cx.globalAlpha=0.45; cx.drawImage(prevC,0,0); cx.globalAlpha=1;
    pv2.clearRect(0,0,W,H); pv2.drawImage(cv,0,0);
  }
  if(effects.bagloved){           // bloom: blurred bright copy added on top
    sm2.imageSmoothingEnabled=true;
    sm2.clearRect(0,0,smallC.width,smallC.height);
    sm2.drawImage(cv,0,0,smallC.width,smallC.height);
    cx.imageSmoothingEnabled=true;
    cx.globalCompositeOperation='lighter'; cx.globalAlpha=0.45;
    cx.drawImage(smallC,0,0,smallC.width,smallC.height,0,0,W,H);
    cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
    cx.imageSmoothingEnabled=false;
  }
  cx.setTransform(PIX,0,0,PIX,0,0);
}

    txt('POWERUPS', tx2, ry-9, 9, '#f5d300');
    txt('totems & mysterious bags', tx2, ry+2, 7, '#ffffffcc'); }

  txt('walls & crowds scatter half your crew · alone + hit = game over', VW/2, VW<420?VH-72:VH-11, VW<420?7:8, '#ffffff99','center');
}

function renderCutscene(){
  const c=cutscene; if(!c) return;
  cx.fillStyle='#000000aa'; cx.fillRect(0,0,VW,VH);
  const n=c.dancers.length, gap=Math.min(34, (VW-60)/n), x0=VW/2-(n-1)*gap/2, yBase=VH/2+30;
  for(const d of c.dancers){
    let x=x0+d.i*gap, y=yBase, fr=0, o={};
    const p=c.phase, t=c.t;
    if(p===0){ x = lerp(-30-d.i*14, x0+d.i*gap, ease(clamp(t/1.0,0,1))); fr=Math.floor(G.t*8)%2; o.armsUp=false; o.facing='right'; }
    else if(p===1){ fr=Math.floor(G.t*6+d.i)%2; o.armsUp = fr===1; o.facing='down'; }
    else if(p===2){ const s=Math.floor((t*10+d.i))%4; o.facing=['down','right','up','left'][s]; fr=Math.floor(G.t*8)%2; o.armsUp=true; }
    else { // everyone scatters their own way to go get lost in the festival
      const dd=ease(clamp(t/0.9,0,1))*(VW*0.8+60);
      x = x0+d.i*gap + Math.cos(d.exitA)*dd;
      y = yBase + Math.sin(d.exitA)*dd;
      fr=Math.floor(G.t*10)%2; o.facing=dirFacing(d.exitA); o.armsUp=false;
    }
    cx.save(); cx.translate(Math.round(x),Math.round(y)); cx.scale(2.5,2.5);
    drawRaver(cx,0,0,d.pal,fr,o);
    cx.restore();
  }
  const label=['YOU MADE IT!','EVERYBODY DANCE!','EVERYBODY DANCE!','SEE YOU LATER!'][c.phase];
  txt(label, VW/2, 50, 12, '#2de2e6','center');
  txt(`STAGE ${G.stage} · ${STAGE_NAMES[(G.stage-1)%STAGE_NAMES.length]}`, VW/2, 30, 10, '#f5d300','center');
}

// the group chat — a pixel phone slides in from the right
function renderPhone(){
  if(!phone) return;
  cx.fillStyle='#00000055'; cx.fillRect(0,0,VW,VH);
  const pw=124, ph2=180;
  const tIn=ease(clamp(phone.t/0.4,0,1));
  const tOut=ease(clamp((phone.t-phone.dur)/0.4,0,1));
  const px=Math.round(VW - (pw+10)*tIn + (pw+24)*tOut);
  const py=Math.round((VH-ph2)/2);
  // bezel + screen
  cx.fillStyle='#16121f'; cx.fillRect(px-3,py-3,pw+6,ph2+6);
  cx.strokeStyle='#3a2f55'; cx.lineWidth=1; cx.strokeRect(px-3.5,py-3.5,pw+7,ph2+7);
  cx.fillStyle='#0b0f1a'; cx.fillRect(px,py,pw,ph2);
  cx.fillStyle='#444'; cx.fillRect(px+pw/2-8,py-2,16,1);   // speaker slot
  // status bar — the night marches on: 21:52 at the gates, +1 hour per stage
  const hr=(21+(G.stage-1))%24;
  txt(String(hr).padStart(2,'0')+':52', px+5, py+3, 7, '#8899aa');
  cx.fillStyle='#39ff14'; cx.fillRect(px+pw-16,py+4,10,4);
  cx.fillStyle='#0b0f1a'; cx.fillRect(px+pw-9,py+5,2,2);
  // chat header
  cx.fillStyle='#1d2433'; cx.fillRect(px,py+12,pw,16);
  txt('RAVE FAM', px+pw/2, py+15, 9, '#2de2e6','center');
  txt(`${friendsNeeded(G.stage)} online`, px+pw/2, py+24, 6, '#39ff14aa','center');
  // bubble helper with ~17-char wrap
  const bubble=(s,by,dim)=>{
    const words=s.split(' '); const lines=[]; let cur='';
    for(const wd of words){ if((cur+' '+wd).trim().length>17){ lines.push(cur.trim()); cur=wd; } else cur+=' '+wd; }
    if(cur.trim()) lines.push(cur.trim());
    const bh=lines.length*9+6;
    cx.globalAlpha=dim?0.55:1;
    cx.fillStyle='#26304a'; cx.fillRect(px+6,by,pw-22,bh);
    cx.fillStyle='#9be7ff'; cx.fillRect(px+6,by,2,bh);
    lines.forEach((ln,k)=>txt(ln, px+12, by+3+k*9, 7, '#dde8ff'));
    cx.globalAlpha=1;
    return bh;
  };
  let by=py+34;
  // older messages — already in the chat when you open it
  for(const m of phone.history) by+=bubble(m,by,true)+4;
  // new messages beep in one by one
  for(let i=0;i<phone.msgs.length;i++){
    if(phone.t<PHONE_TIMES[i]){
      if(phone.t>PHONE_TIMES[i]-0.6){ // typing dots
        cx.fillStyle='#26304a'; cx.fillRect(px+6,by,26,11);
        const d=Math.floor(G.t*4)%3;
        for(let k=0;k<3;k++){ cx.fillStyle=k<=d?'#9be7ff':'#445'; cx.fillRect(px+12+k*6,by+4,3,3); }
      }
      break;
    }
    by+=bubble(phone.msgs[i],by,false)+5;
  }
  if(phone.t>PHONE_TIMES[1]+0.5 && Math.floor(G.t*2)%2)
    txt('SPACE / CLICK TO GO', px+pw/2, py+ph2-12, 7, '#39ff14','center');
}

function renderFlash(){
  const a=clamp(flashT/2.2,0,1);
  if(flashT>1.9){ cx.fillStyle='#ffffff'+Math.floor((flashT-1.9)/0.3*200).toString(16).padStart(2,'0'); cx.fillRect(0,0,VW,VH); }
  cx.fillStyle='#00000088'; cx.fillRect(0,VH/2-34,VW,68);
  const s=1+Math.sin(G.t*10)*0.04;
  cx.save(); cx.translate(VW/2,VH/2); cx.scale(s,s);
  if(world.final) txtT('CATCH THE SHUTTLE!', 0, -12, VW<420?15:20, '#f5d300','center');
  else txtT(`FIND ${friendsNeeded(G.stage)} FRIENDS!`, 0, -12, VW<420?16:20, '#39ff14','center');
  cx.restore();
  txt(STAGE_NAMES[(G.stage-1)%STAGE_NAMES.length], VW/2, VH/2+14, 10, '#2de2e6','center');
  cx.globalAlpha=1;
}

function renderGameOver(){
  cx.fillStyle='#000000cc'; cx.fillRect(0,0,VW,VH);
  const cy=VH/2;
  if(gameOverInfo && gameOverInfo.bus){
    txtT('YOU MISSED', VW/2, cy-75, VW<420?15:18, '#ff4f4f','center');
    txtT('THE BUS!', VW/2, cy-51, VW<420?15:18, '#ff4f4f','center');
    txt('the shuttle left without you...', VW/2, cy-15, 10, '#ffffffcc','center');
  } else {
    txtT("YOU'VE LOST ALL", VW/2, cy-75, VW<420?13:18, '#ff4f4f','center');
    txtT("YOUR FRIENDS!", VW/2, cy-51, VW<420?13:18, '#ff4f4f','center');
    if(gameOverInfo) txt(`you ${gameOverInfo.what} while flying solo`, VW/2, cy-15, 10, '#ffffffcc','center');
  }
  if(gameOverInfo) txt(`stages reached: ${gameOverInfo.stage}   friends found: ${gameOverInfo.total}`, VW/2, cy+5, VW<420?8:10, '#2de2e6','center');
  if(Math.floor(G.t*2)%2) txt(TOUCH?'TAP TO HEAD BACK TO THE GATES':'PRESS SPACE TO HEAD BACK TO THE GATES', VW/2, cy+45, 9, '#39ff14','center');
}

// ---------- victory: on the bus, off to the kick ons ----------
function renderWin(){
  cx.fillStyle='#07030f'; cx.fillRect(0,0,VW,VH);
  // stars
  for(let i=0;i<40;i++){ const h=hash2(i,3);
    cx.fillStyle=['#ffffff33','#2de2e633','#ff2d9533'][i%3];
    cx.fillRect(h*VW, hash2(i,9)*120, 2,2); }
  // road
  cx.fillStyle='#13101e'; cx.fillRect(0,VH/2+34,VW,60);
  cx.fillStyle='#f5d30055';
  for(let i=0;i<9;i++) cx.fillRect(((i*70 - winT*90)%(VW+70)+VW+70)%(VW+70)-35, VH/2+58, 32,3);
  // the bus, full of YOUR crew — actual characters in the windows
  const headX=80+winT*55;
  cx.save(); cx.translate(Math.min(headX,VW+150), VH/2+44); cx.scale(1.8,1.8);
  drawBus(0,0,winPals);
  cx.restore();
  // roll-call trailing behind the bus as it drives by
  for(let i=0;i<winNames.length;i++){
    const nx=headX-80-i*58;
    if(nx<-50||nx>VW+60) continue;
    const ny=VH/2+50+(i%2?10:-1)+Math.sin(G.t*4+i)*1.5;
    txt(winNames[i], nx, ny, 9, ['#39ff14','#ff2d95','#00e5ff','#f5d300'][i%4],'center');
  }
  const nw=VW<420;
  txtT('YOU CAUGHT', VW/2, VH/2-118, nw?14:18, '#39ff14','center');
  txtT('THE LAST SHUTTLE!', VW/2, VH/2-96, nw?14:18, '#39ff14','center');
  txt('kick ons at your hotel!!', VW/2, VH/2-73, 11, '#2de2e6','center');
  txt(`${winCrew} RAVERS MADE IT ON THE BUS IN ${winTime.toFixed(2)}s`, VW/2, VH/2-49, nw?8:11, '#f5d300','center');
  if(lbQualified && Math.floor(G.t*3)%3!==0)
    txt('★ FULL BUS — LEADERBOARD RUN ★', VW/2, VH/2-32, nw?8:10, '#ff2d95','center');
  txt('THANKS FOR RAVING', VW/2, VH/2+80, 9, '#ffffff88','center');
  if(Math.floor(G.t*2)%2) txt(TOUCH?'TAP FOR ONE MORE RAVE':'PRESS SPACE FOR ONE MORE RAVE', VW/2, VH/2+100, 10, '#fff','center');
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);


</script>
