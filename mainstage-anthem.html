<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rave Train — Mainstage Anthem Loop</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;background:#0a0014;color:#eee;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  h1{color:#2de2e6;text-shadow:0 0 18px #2de2e6;letter-spacing:4px;margin:28px 0 2px;font-size:26px}
  h2{color:#f6019d;margin:0 0 16px;font-size:13px;letter-spacing:3px;font-weight:normal}
  #stage{font-size:13px;letter-spacing:2px;color:#ffd319;height:18px;margin-bottom:10px}
  canvas{background:#06000d;border:1px solid #2de2e644;border-radius:8px;margin-bottom:18px;max-width:94vw}
  button{background:#16002a;color:#2de2e6;border:1px solid #2de2e6;border-radius:6px;padding:16px 44px;font-family:inherit;font-size:18px;cursor:pointer;letter-spacing:1px}
  button:hover{background:#2de2e6;color:#0a0014}
  p.note{max-width:560px;color:#888;font-size:12px;line-height:1.7;text-align:center;padding:0 16px}
</style>
</head>
<body>
<h1>RAVE TRAIN</h1>
<h2>MAINSTAGE ANTHEM — 16-BAR LOOP &middot; 128 BPM</h2>
<div id="stage"></div>
<canvas id="viz" width="640" height="140"></canvas>
<button id="play">&#9654; PLAY</button>
<p class="note">
  One clean loop: 4-on-the-floor kick, sidechained saw bass, one sustained supersaw
  chord per bar (Am&ndash;F&ndash;C&ndash;G) pumping with the kick, and an 8-bar anthem
  lead played twice. Snare fills at bar 8 and bar 16, crash on each half.
</p>
<script>
"use strict";
let AC=null, master, duck, revSend, dlySend, analyser;
let playing=false, timer=null, stepN=0, nextT=0, startT=0;
const BPM=128, S16=60/BPM/4, BAR=S16*16, LOOP=256;       // 16 bars
const rnd=(a,b)=>a+Math.random()*(b-a);
const F=(base,s)=>base*Math.pow(2,s/12);
// Am - F - C - G, voiced from A3 (220 Hz)
const CHORDS=[[0,3,7,12],[-4,0,3,8],[3,7,10,15],[-2,2,5,10]];
const ROOTS=[0,-4,3,-2];
// 8-bar anthem lead, 3 hits per bar (steps 0 / 6 / 8), offsets from A4
const MEL=[[12,15,12],[8,12,8],[7,10,7],[10,14,10],
           [12,15,12],[8,12,8],[7,10,7],[10,14,17]];    // last bar rises back home
const HITS=[[0,5],[6,2],[8,7]];                          // [step, length in 16ths]

function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.85;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-14; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.18;
  analyser=AC.createAnalyser(); analyser.fftSize=512;
  master.connect(comp).connect(analyser).connect(AC.destination);
  duck=AC.createGain(); duck.connect(master);            // sidechain bus
  const rev=AC.createConvolver(); rev.buffer=impulse(2.4,2.6);
  const rg=AC.createGain(); rg.gain.value=0.3;
  revSend=AC.createGain(); revSend.connect(rev).connect(rg).connect(master);
  const dly=AC.createDelay(1); dly.delayTime.value=S16*3;
  const fb=AC.createGain(); fb.gain.value=0.35;
  const dg=AC.createGain(); dg.gain.value=0.25;
  dlySend=AC.createGain(); dlySend.connect(dly); dly.connect(fb).connect(dly);
  dly.connect(dg).connect(master);
}
function impulse(dur,decay){ const len=AC.sampleRate*dur|0, b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);} return b;}
function noiseSrc(dur){ const len=Math.max(1,AC.sampleRate*dur|0);
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=b; return s;}

// ================= VOICES =================
function kick(t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12);
  g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  o.connect(g).connect(master); o.start(t); o.stop(t+0.24);
  const n=noiseSrc(0.02),hp=AC.createBiquadFilter(),hg=AC.createGain();   // click
  hp.type='highpass'; hp.frequency.value=1500;
  hg.gain.setValueAtTime(0.3,t); hg.gain.exponentialRampToValueAtTime(0.001,t+0.02);
  n.connect(hp).connect(hg).connect(master); n.start(t);
  duck.gain.setValueAtTime(1,t);                         // the pump
  duck.gain.linearRampToValueAtTime(0.12,t+0.02);
  duck.gain.linearRampToValueAtTime(1,t+0.34);
}
function bass(t,root){
  const f=F(55,root);
  const o=AC.createOscillator(),s=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=f*2; s.type='sine'; s.frequency.value=f;
  lp.type='lowpass'; lp.frequency.value=620;
  g.gain.setValueAtTime(0.30,t); g.gain.setValueAtTime(0.30,t+0.40);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.46);
  o.connect(lp); s.connect(lp); lp.connect(g).connect(duck);
  o.start(t); s.start(t); o.stop(t+0.48); s.stop(t+0.48);
}
function supersaw(t,semis,dur,vol){
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.setValueAtTime(vol,t+Math.max(0.04,dur-0.1));
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  g.connect(duck); g.connect(revSend);
  semis.forEach(n=>{ [-1,0,1].forEach(i=>{
    const o=AC.createOscillator(),p=AC.createStereoPanner();
    o.type='sawtooth'; o.frequency.value=F(220,n); o.detune.value=i*16+rnd(-4,4);
    p.pan.value=i*0.7;
    o.connect(p).connect(g); o.start(t); o.stop(t+dur+0.05); });});
}
function lead(t,semi,dur,vol){
  const g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=6500;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.015);
  g.gain.setValueAtTime(vol,t+dur); g.gain.linearRampToValueAtTime(0.0001,t+dur+0.08);
  g.connect(lp); lp.connect(duck); lp.connect(dlySend); lp.connect(revSend);
  [-18,0,18].forEach(d=>{
    const o=AC.createOscillator(),p=AC.createStereoPanner();
    o.type='sawtooth'; o.frequency.value=F(440,semi); o.detune.value=d; p.pan.value=d/26;
    o.connect(p).connect(g); o.start(t); o.stop(t+dur+0.12); });
  const o2=AC.createOscillator(),g2=AC.createGain();     // octave-down body
  o2.type='square'; o2.frequency.value=F(220,semi); g2.gain.value=0.3;
  o2.connect(g2).connect(g); o2.start(t); o2.stop(t+dur+0.12);
}
function hat(t,v,open){ const n=noiseSrc(open?0.09:0.03),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type='highpass'; hp.frequency.value=7500;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+(open?0.09:0.03));
  n.connect(hp).connect(g).connect(master); n.start(t);}
function clap(t){ const len=2600,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++){const e=(i%900<60)?1:Math.pow(1-i/len,2.2); d[i]=(Math.random()*2-1)*e;}
  const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=1.2; g.gain.value=0.26;
  s.buffer=b; s.connect(bp).connect(g).connect(master); g.connect(revSend); s.start(t);}
function snare(t,v){ const n=noiseSrc(0.12),bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=0.9;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  n.connect(bp).connect(g).connect(master); g.connect(revSend); n.start(t);
  const o=AC.createOscillator(),g2=AC.createGain();
  o.frequency.value=190; g2.gain.setValueAtTime(v*0.8,t);
  g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  o.connect(g2).connect(master); o.start(t); o.stop(t+0.09);}
function crash(t){ const n=noiseSrc(0.9),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type='highpass'; hp.frequency.value=4200;
  g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.9);
  n.connect(hp).connect(g).connect(master); g.connect(revSend); n.start(t);}

// ================= SEQUENCER =================
function schedule(i,t){
  const s=i%LOOP, bar=s>>4, ss=s&15, ch=bar%4;
  if(ss===0&&bar%8===0) crash(t);                        // top of each half
  if(ss%4===0){ kick(t); bass(t,ROOTS[ch]); }            // 4-on-the-floor + pumping bass
  if(ss%4===2) hat(t,0.11,true);                         // offbeat open hat
  if(ss%2===1) hat(t,0.04,false);
  if(ss%8===4) clap(t);                                  // 2 & 4
  if(ss===0) supersaw(t,CHORDS[ch],BAR*0.96,0.055);      // one big chord per bar
  const M=MEL[bar%8];                                    // 8-bar anthem, played twice
  HITS.forEach(([hs,len],k)=>{ if(ss===hs) lead(t,M[k],len*S16,0.11); });
  if(bar===7&&ss>=8&&ss%2===0) snare(t,0.12+(ss-8)*0.012);          // small fill, bar 8
  if(bar===15){                                          // bigger fill, bar 16
    if(ss<8&&ss%2===0) snare(t,0.12+ss*0.008);
    if(ss>=8) snare(t,0.16+(ss-8)*0.014); }
}
function tick(){ while(nextT<AC.currentTime+0.15){ schedule(stepN,nextT); stepN++; nextT+=S16; } }
function start(){ initAudio(); if(AC.state==='suspended')AC.resume();
  playing=true; stepN=0; nextT=AC.currentTime+0.1; startT=nextT;
  timer=setInterval(tick,25); draw();
  btnPlay.innerHTML='&#9632; STOP';}
function stop(){ playing=false; clearInterval(timer);
  btnPlay.innerHTML='&#9654; PLAY'; stageEl.textContent='';}

// ================= UI =================
const btnPlay=document.getElementById('play'), stageEl=document.getElementById('stage');
const cv=document.getElementById('viz'), ctx=cv.getContext('2d');
btnPlay.onclick=()=>playing?stop():start();
function draw(){
  if(!playing){ ctx.clearRect(0,0,cv.width,cv.height); return; }
  requestAnimationFrame(draw);
  const a=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(a);
  ctx.clearRect(0,0,cv.width,cv.height);
  const n=64,w=cv.width/n;
  for(let i=0;i<n;i++){ const v=a[i*2]/255, h=v*cv.height;
    ctx.fillStyle=`hsl(${190+v*130},95%,${45+v*20}%)`;
    ctx.fillRect(i*w+1,cv.height-h,w-2,h); }
  const cur=Math.floor((AC.currentTime-startT)/S16);
  if(cur>=0) stageEl.textContent=`bar ${((cur%LOOP)>>4)+1}/16`;
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&AC&&AC.state==='suspended')AC.resume();});
</script>
</body>
</html>
