<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" shape-rendering="crispEdges">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="18" height="18" fill="#07030f"/>
  <ellipse cx="9" cy="8.5" rx="6" ry="6" fill="#39ff14" opacity="0.55" filter="url(#g)"/>
  <g shape-rendering="crispEdges">
    <!-- skin head -->
    <rect x="1" y="4" width="16" height="12" fill="#e3b486"/>
    <!-- eyes -->
    <rect x="4" y="8" width="3" height="4" fill="#241a38"/><rect x="11" y="8" width="3" height="4" fill="#241a38"/>
    <rect x="4" y="8" width="1" height="2" fill="#fff"/><rect x="11" y="8" width="1" height="2" fill="#fff"/>
    <!-- mouth -->
    <rect x="8" y="13" width="2" height="1" fill="#c4606a"/>
    <!-- blush -->
    <rect x="1" y="11" width="2" height="2" fill="#e89a9a"/><rect x="15" y="11" width="2" height="2" fill="#e89a9a"/>
    <!-- hair (middle part) -->
    <rect x="1" y="2" width="16" height="3" fill="#241812"/>
    <rect x="1" y="5" width="3" height="5" fill="#241812"/><rect x="14" y="5" width="3" height="5" fill="#241812"/>
    <rect x="7" y="5" width="1" height="1" fill="#241812"/><rect x="10" y="5" width="1" height="1" fill="#241812"/>
  </g>
</svg>
