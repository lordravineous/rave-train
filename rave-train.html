<script>
'use strict';
// ============================================================
//  RAVE TRAIN — find your friends at the festival
// ============================================================
let VW = 480, VH = 270;                   // logical pixel resolution (dynamic!)
const PIX = 2;                            // internal supersample — doubles sprite pixel density
const FOGS = 4;                           // fog canvas downscale (chunky edges)
const TOUCH = 'ontouchstart' in window;   // phones & tablets get on-screen buttons
const cv = document.getElementById('screen');
const cx = cv.getContext('2d');
const fogC = document.createElement('canvas');
const fx = fogC.getContext('2d');

// portrait phones get a tall narrow view — everything renders bigger & clearer
function computeView(){
  const ar = innerWidth/Math.max(1,innerHeight);
  if(ar < 1){ VW=320; VH=Math.max(420, Math.min(620, Math.round(320/ar))); }
  else      { VW=480; VH=270; }
  cv.width=VW*PIX; cv.height=VH*PIX;
  cx.imageSmoothingEnabled=false;
  fogC.width=Math.ceil(VW/FOGS); fogC.height=Math.ceil(VH/FOGS);
}
function fit(){
  computeView();
  let s = Math.min(innerWidth/VW, innerHeight/VH);
  if(s>=1) s=Math.floor(s);          // integer scale on desktop, fractional on phones
  cv.style.width = VW*s+'px'; cv.style.height = VH*s+'px';
}
addEventListener('resize', fit);
addEventListener('orientationchange', ()=>setTimeout(fit,150));
fit();

// ---------- helpers ----------
const TAU = Math.PI*2;
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri  = (a,b)=>Math.floor(rnd(a,b+1));
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function angTo(a,b){return Math.atan2(b.y-a.y,b.x-a.x);}
function angDiff(a,b){let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;}
const choice=a=>a[Math.floor(Math.random()*a.length)];

// ---------- characters (pixel ravers) ----------
const CHARS = [
 {name:'NEON NIA',   skin:'#ffd9b3', hair:'#ff2d95', top:'#2de2e6', legs:'#241b3a', glow:'#39ff14', style:'mohawk'},
 {name:'BASS BOY',   skin:'#c68f59', hair:'#1b1b22', top:'#ff6d00', legs:'#1f2a44', glow:'#00e5ff', style:'cap', cap:'#3b82f6'},
 {name:'TECHNO TESS',skin:'#ffe0c2', hair:'#00ff9f', top:'#0d0d12', legs:'#3a1b4f', glow:'#ff2d95', style:'bob'},
 {name:'GLOW JOE',   skin:'#8d5524', hair:'#2b1a0e', top:'#f5d300', legs:'#143c2b', glow:'#ff6d00', style:'afro'},
 {name:'KANDI KAI',  skin:'#f1c27d', hair:'#b14aed', top:'#ff4f9a', legs:'#11324d', glow:'#f5d300', style:'spiky'},
 {name:'DJ DOT',     skin:'#e0ac69', hair:'#00bcd4', top:'#7c3aed', legs:'#26203b', glow:'#2de2e6', style:'buns'},
 {name:'PIXIE PIP',  skin:'#ffe6d5', hair:'#2de2e6', top:'#ff2d95', legs:'#1c2740', glow:'#f5d300', style:'pixie'},
 {name:'MC FLOW',    skin:'#6f4428', hair:'#15100c', top:'#39ff14', legs:'#23232f', glow:'#ff2d95', style:'dreads'},
 {name:'CYBER SUE',  skin:'#f5d7b8', hair:'#c084fc', top:'#0ea5b7', legs:'#312244', glow:'#39ff14', style:'long', visor:'#00e5ff'},
 {name:'DISCO DAN',  skin:'#d9a066', hair:'#4a2c17', top:'#f59e0b', legs:'#3f1d38', glow:'#00e5ff', style:'perm', shades:true},
 {name:'HARD HANK',  skin:'#e8b88a', hair:'#7c4a1e', top:'#111118', legs:'#26203b', glow:'#ff4f4f', style:'buzz', beard:true},
 {name:'LUNA',       skin:'#ffe0c2', hair:'#8ab4ff', top:'#1b1b2e', legs:'#4a1d4f', glow:'#ff6d00', style:'twin'},
];

// which way is an angle pointing? → sprite facing
function dirFacing(a){ const c=Math.cos(a),s=Math.sin(a);
  return Math.abs(c)>Math.abs(s) ? (c>0?'right':'left') : (s>0?'down':'up'); }

// ---- hi-density anime raver: art pixels are HALF a world unit ----
// 4 facings: down (front), up (back), left/right (side profiles, mirrored).
// anchored at feet centre. frame: 0/1 step. o = {facing, dim, armsUp}
function drawRaver(g, wx, wy, pal, frame, o={}){
  const X=Math.round(wx*2)/2, Y=Math.round(wy*2)/2;
  const face=o.facing || (o.flipX?'left':'down');
  const side=face==='left'||face==='right', mir=face==='left', back=face==='up';
  const u=0.5;
  const P=(x,y,w,h,c)=>{ g.fillStyle=o.dim?shade(c,o.dim):c;
    g.fillRect(X+(mir?(-x-w):x)*u, Y+y*u, w*u, h*u); };
  const up=(o.armsUp!==undefined)?o.armsUp:!!frame;
  const SK=pal.skin,H=pal.hair,TP=pal.top,LG=pal.legs,GL=pal.glow,DK='#0d0b16',EY='#241a38';
  if(side){
    // striding legs + shoes
    if(frame){ P(-5,-6,3,5,LG); P(2,-6,3,6,LG); P(-5,-2,4,2,DK); P(2,0,4,2,DK); }
    else     { P(-4,-6,3,6,LG); P(1,-6,3,5,LG); P(-4,0,4,2,DK); P(1,-2,4,2,DK); }
    // body
    P(-4,-13,8,7,TP);
    // near arm only
    if(up){ P(0,-17,3,4,TP); P(0,-19,3,2,SK); P(0,-24,3,5,GL); }
    else  { P(-1,-12,3,5,TP); P(-1,-7,3,2,SK); }
    // head in profile
    P(-7,-26,14,12,SK);
    P(2,-22,3,4,EY); P(2,-22,1,2,'#fff');     // one big eye
    P(7,-21,1,3,SK);                          // wee nose
    P(4,-17,2,1,'#c4606a');
    P(-1,-19,2,2,'#e89a9a');                  // blush
    if(pal.beard){ P(1,-18,6,3,'#5a3a22'); }
    if(pal.shades){ P(1,-22,5,3,'#15151c'); }
    if(pal.visor){ P(0,-23,8,4,pal.visor); P(1,-22,5,1,'#ffffff'); }
  } else {
    // legs + shoes (little step bounce)
    P(-4,-6,3,frame?5:6,LG); P(1,-6,3,frame?6:5,LG);
    P(-4,frame?-2:-1,3,2,DK); P(1,frame?-1:-2,3,2,DK);
    // body
    P(-5,-13,10,7,TP);
    if(!back) P(-1,-11,2,2,GL);               // little logo on the tee
    // arms: sleeves + hands (+ glowsticks when raving)
    if(up){ P(-7,-17,2,4,TP);  P(5,-17,2,4,TP);
            P(-7,-19,2,2,SK);  P(5,-19,2,2,SK);
            P(-7,-24,2,5,GL);  P(5,-24,2,5,GL); }
    else  { P(-7,-12,2,5,TP);  P(5,-12,2,5,TP);
            P(-7,-7,2,2,SK);   P(5,-7,2,2,SK); }
    // BIG anime head
    P(-8,-26,16,12,SK);
    if(back){ P(-8,-26,16,12,H); }
    else{
      P(-5,-22,3,4,EY);  P(2,-22,3,4,EY);     // big sparkly eyes
      P(-5,-22,1,2,'#fff'); P(2,-22,1,2,'#fff');
      P(-1,-17,2,1,'#c4606a');                // mouth
      P(-8,-19,2,2,'#e89a9a'); P(6,-19,2,2,'#e89a9a'); // blush
      if(pal.beard){ P(-5,-18,10,3,'#5a3a22'); P(-1,-17,2,1,'#3d2614'); }
      if(pal.shades){ P(-6,-22,5,3,'#15151c'); P(1,-22,5,3,'#15151c'); P(-1,-21,2,1,'#15151c'); }
      if(pal.visor){ P(-6,-23,12,4,pal.visor); P(-5,-22,4,1,'#ffffff'); }
    }
  }
  hairDraw(P,pal, side?'s':(back?'u':'d'));
}

// hairstyles per facing: 'd' front, 'u' back, 's' side
function hairDraw(P,pal,f){
  const H=pal.hair, C=pal.cap||H, GL=pal.glow;
  switch(pal.style){
    case 'mohawk':
      if(f==='s'){ P(-7,-27,14,3,H); P(-4,-33,5,7,H); P(-7,-30,4,4,H); }
      else { P(-8,-27,16,3,H); P(-2,-33,4,7,H); }
      break;
    case 'cap':
      if(f==='s'){ P(-7,-29,14,4,C); P(2,-26,8,2,C); }
      else if(f==='u'){ P(-8,-29,16,4,C); P(-3,-25,6,2,'#e8e8f0'); }
      else { P(-8,-29,16,4,C); P(-8,-25,16,1,C); }
      break;
    case 'bob':
      if(f==='s'){ P(-7,-28,14,4,H); P(-8,-24,4,9,H); }
      else { P(-8,-28,16,4,H); P(-9,-24,3,8,H); P(6,-24,3,8,H); }
      break;
    case 'afro':
      if(f==='s'){ P(-9,-31,17,6,H); P(-9,-25,3,4,H); }
      else { P(-10,-31,20,6,H); P(-8,-32,16,1,H); P(-10,-25,2,3,H); P(8,-25,2,3,H); }
      break;
    case 'spiky':
      if(f==='s'){ P(-7,-28,14,2,H); P(-5,-31,2,3,H); P(-1,-32,2,4,H); P(3,-30,2,2,H); }
      else { P(-8,-28,16,2,H); P(-6,-31,2,3,H); P(-1,-32,2,4,H); P(4,-31,2,3,H); }
      break;
    case 'buns':
      if(f==='s'){ P(-7,-28,14,3,H); P(-9,-31,4,4,H); }
      else { P(-8,-28,16,3,H); P(-11,-30,4,4,H); P(7,-30,4,4,H); }
      break;
    case 'pixie':
      if(f==='s'){ P(-7,-29,14,4,H); P(-7,-25,2,3,H); }
      else { P(-8,-29,16,4,H); P(-8,-25,2,4,H); }
      break;
    case 'dreads': {
      const xs = f==='s' ? [-7,-3,1,5] : [-8,-4,0,4,6];
      P(f==='s'?-7:-8,-28,f==='s'?14:16,3,H);
      xs.forEach((x,i)=>P(x,-27,2,6+(i%2)*2,H));
      break; }
    case 'long':
      if(f==='s'){ P(-7,-28,14,4,H); P(-8,-26,4,14,H); }
      else if(f==='u'){ P(-8,-28,16,15,H); }
      else { P(-8,-28,16,4,H); P(-9,-25,2,11,H); P(7,-25,2,11,H); }
      break;
    case 'perm':
      if(f==='s'){ P(-8,-30,15,5,H); P(-8,-25,3,4,H); P(-5,-32,5,2,H); }
      else { P(-9,-30,18,5,H); P(-9,-25,2,4,H); P(7,-25,2,4,H); P(-6,-32,4,2,H); P(2,-32,4,2,H); }
      break;
    case 'buzz':
      P(f==='s'?-7:-8,-27,f==='s'?14:16,2,H);
      break;
    case 'twin':
      if(f==='s'){ P(-7,-28,14,3,H); P(-10,-27,3,10,H); P(-10,-28,3,2,GL); }
      else { P(-8,-28,16,3,H); P(-12,-26,3,10,H); P(9,-26,3,10,H); P(-12,-28,3,2,GL); P(9,-28,3,2,GL); }
      break;
  }
}
function shade(hex,amt){ // darken toward fog purple
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(lerp(r,30,amt)); g=Math.round(lerp(g,16,amt)); b=Math.round(lerp(b,48,amt));
  return `rgb(${r},${g},${b})`;
}

// ---------- totems ----------
const TOTEMS = [
 {id:'sober', name:'SOBER FRIEND',  col:'#39ff14', dur:25, msg:'They know the way!'},
 {id:'glow',  name:'FAMILY PHOTO',  col:'#f5d300', dur:20, msg:"They've turned on the lights!"},
 {id:'water', name:'MYSTERIOUS BAG',col:'#cfe8ff', dur:10, msg:"I don't know what's in this but I feel FAST"},
 {id:'bass',  name:'BODY ODOUR',    col:'#a3e635', dur:15, msg:'You smell! The crowd backs off.'},
 {id:'torch', name:'FLASHLIGHT',    col:'#ff6d00', dur:18, msg:'A cone of light!'},
 {id:'signal',name:'PHONE SIGNAL',  col:'#b14aed', dur:25, msg:'Full bars! Check the map!'},
 {id:'mum',   name:'RAVE MUM',      col:'#ff8fab', dur:8,  msg:'Invincibility! Everything is going to be okay.'},
 {id:'flag',  name:'SQUAD FLAG',    col:'#ffffff', dur:12, msg:'Raise it high! Your mates are coming!'},

function drawTotemIcon(g,x,y,id){
  g.save(); g.translate(Math.round(x),Math.round(y));
  const p=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect(a,b,w,h);};
  switch(id){
    case 'sober': p(-3,-3,7,7,'#0d2606'); p(-2,-2,5,5,'#39ff14'); p(-1,-1,1,1,'#0d2606'); p(1,-1,1,1,'#0d2606'); p(-1,1,3,1,'#0d2606'); break;
    case 'glow':  p(-3,-3,7,7,'#332b00'); p(-3,-2,7,5,'#3a3a4a'); p(-1,-1,3,3,'#00e5ff'); p(0,0,1,1,'#fff'); p(2,-3,2,1,'#f5d300'); break;
    case 'water': p(-3,-3,7,7,'#1c2230'); p(-2,-2,5,5,'#e8eef7'); p(-2,-2,5,1,'#9be7ff'); p(-1,0,1,1,'#5a6478'); p(0,-1,1,1,'#5a6478'); p(0,1,1,1,'#5a6478'); break;
    case 'bass':  p(-3,-3,7,7,'#16200a'); p(-3,1,7,3,'#3a4a1e'); p(-2,-1,1,2,'#a3e635'); p(-2,-3,1,1,'#a3e635'); p(0,-2,1,2,'#a3e635'); p(0,-4,1,1,'#a3e635'); p(2,-1,1,2,'#a3e635'); p(2,-3,1,1,'#a3e635'); break;
    case 'torch': p(-3,-3,7,7,'#2b1502'); p(-3,0,3,2,'#999'); p(0,-1,2,4,'#ccc'); p(2,-2,2,5,'#ffe28a'); break;
    case 'signal':p(-3,-3,7,7,'#1d1030'); p(-3,-2,3,5,'#ddd'); p(-2,-1,1,3,'#9be7ff'); p(1,1,1,1,'#39ff14'); p(2,0,1,2,'#39ff14'); p(3,-1,1,3,'#39ff14'); break;
    case 'mum':   p(-3,-3,7,7,'#2a0a14'); p(-2,-2,2,2,'#ff8fab'); p(1,-2,2,2,'#ff8fab'); p(-3,-1,7,1,'#ff8fab'); p(-2,0,5,1,'#ff8fab'); p(-1,1,3,1,'#ff8fab'); p(0,2,1,1,'#ff8fab'); break;
    case 'flag':  p(-3,-3,7,7,'#1a1426'); p(-2,-3,1,7,'#c9b78a'); p(-1,-3,5,2,'#ffffff'); p(-1,-1,4,1,'#ff2d95'); break;
  }
  g.restore();
}

// ---------- stage names ----------
const STAGE_NAMES = ['SUNRISE GATES','MAIN STAGE','BASS TENT','TECHNO DOME',
  'JUNGLE ARENA','HARDSTYLE HANGAR','TRANCE TEMPLE','THE LAST SHUTTLE'];
const FINAL_STAGE = 8;

// ============================================================
//  GAME STATE
// ============================================================
const G = {
  state:'select',        // select | play | transition | cutscene | flash | gameover | win? (endless)
  stage:1, charIdx:0,
  t:0, shake:0,
  totalCollected:0,
  msgs:[],               // floating banner messages [{txt,col,t}]
};
const player = { x:0,y:0, dir:0, speed:80, invuln:0, mouseSteer:false };
let world=null, party=[], trail=[], trailDist=[], camera={x:0,y:0};
let effects={};          // active powerups id->timeLeft
let exitGate=null, exitArrowT=0;
let transition=null, cutscene=null, flashT=0, gameOverInfo=null;
let phone=null, friendDryT=0;   // group-chat intro · seconds since last friend found
let winT=0, winCrew=0;          // victory screen

const SPACING=11;        // px between party members along trail
const VISION=120;        // base fog radius

function friendsNeeded(stage){ return 4 + stage*2; }   // 6,8,10,...
function mapW(stage){ return Math.min(1000 + (stage-1)*220, 2400); }
function mapH(stage){ return Math.min(730 + (stage-1)*160, 1750); }

// ---------- world generation ----------
const OB_DIMS = { bar:{w:68,h:18}, loo:{w:58,h:16}, speaker:{w:40,h:46}, tent:{w:40,h:22}, merch:{w:50,h:20}, bin:{w:36,h:18} };
const OB_NAMES = { bar:'bar queue', loo:'porta-loos', speaker:'speaker stack', tent:'tent', merch:'merch stand', bin:'bins', stage:'main stage' };
function genWorld(stage, spawnFrac){
  // THE LAST SHUTTLE — a long car-park gauntlet, bus at the far end
  if(stage>=FINAL_STAGE){
    // a single-screen-tall corridor: weave through EVERYONE to reach the bus
    const W=3400, H=VH;
    const w={W,H,stage, final:true, crowds:[], obstacles:[], friends:[], totems:[], lasers:[]};
    w.spawn={x:80, y:H/2};
    for(let i=0;i<26;i++){
      const c={x:rnd(300,W-280), y:rnd(60,H-60), r:rnd(28,52), members:[]};
      const n=Math.max(7,Math.floor(c.r/5));
      for(let j=0;j<n;j++){ const a=rnd(0,TAU), d=Math.sqrt(Math.random())*c.r;
        c.members.push({x:c.x+Math.cos(a)*d, y:c.y+Math.sin(a)*d, hx:0, hy:0,
          facing:choice(['down','left','right','up']), pal:choice(CHARS), ph:rnd(0,TAU)}); }
      w.crowds.push(c);
    }
    const types=Object.keys(OB_DIMS);
    for(let i=0;i<16;i++){
      const t=types[i%types.length], d=OB_DIMS[t];
      const p={x:rnd(330,W-320), y:rnd(45,H-45)};
      if(w.crowds.some(c=>Math.hypot(c.x-p.x,c.y-p.y)<c.r+38)){ i--; continue; }
      w.obstacles.push({x:p.x,y:p.y,w:d.w,h:d.h,type:t,ph:rnd(0,TAU)});
    }
    const deck=[...TOTEMS].sort(()=>Math.random()-0.5);
    for(let i=0;i<9;i++){
      const p=freeSpot(w,50); if(p.x<280){ i--; continue; }
      w.totems.push({x:p.x,y:p.y,type:deck[i%deck.length],taken:false,ph:rnd(0,TAU)});
    }
    w.artcar={x:W*0.45, y:H/2, dir:0, t:rnd(1,4), ph:rnd(0,TAU)};
    return w;
  }
  const W=mapW(stage), H=mapH(stage);
  const w={W,H,stage, crowds:[], obstacles:[], friends:[], totems:[], lasers:[]};
  // THE STAGE — platform + DJ + laser truss at the top of the map
  const rigW=Math.min(W*0.42,380);
  w.djPal=choice(CHARS);
  w.obstacles.push({x:W/2, y:42, w:rigW, h:56, type:'stage', ph:0});
  for(let lx=W/2-rigW/2+26; lx<W/2+rigW/2-14; lx+=46)
    w.lasers.push({x:lx, y:18, c:ri(0,4), ph:rnd(0,TAU), sp:rnd(0.3,0.55)});
  // spawn point — centre, or carried over from the previous stage's exit
  const sp={x:clamp((spawnFrac?spawnFrac.x:0.5)*W,50,W-50),
            y:clamp((spawnFrac?spawnFrac.y:0.5)*H,50,H-50)};
  if(sp.y<115 && Math.abs(sp.x-W/2)<rigW/2+45) sp.y=130;   // never on the stage
  w.spawn=sp;
  // crowds — blobby clusters of dancers (mostly facing the stage)
  const nCrowds = 4 + stage*2;
  for(let i=0;i<nCrowds;i++){
    const c={x:rnd(130,W-130), y:rnd(130,H-130), r:rnd(40,80), members:[]};
    if(Math.hypot(c.x-sp.x,c.y-sp.y)<170){ i--; continue; }   // keep spawn clear
    const n = Math.max(7, Math.floor(c.r/5));   // always a proper group, never loners
    for(let j=0;j<n;j++){
      const a=rnd(0,TAU), d=Math.sqrt(Math.random())*c.r;
      c.members.push({x:c.x+Math.cos(a)*d, y:c.y+Math.sin(a)*d,
        hx:0, hy:0,   // body-odour push offset
        facing: Math.random()<0.7?'up':choice(['down','left','right']),
        pal:choice(CHARS), ph:rnd(0,TAU)});
    }
    w.crowds.push(c);
  }
  // solid obstacles — bars, loos, speakers, tents, merch, bins
  const nObs = 5 + stage;
  const types=Object.keys(OB_DIMS);
  for(let i=0;i<nObs;i++){
    const t=types[i%types.length], d=OB_DIMS[t];
    const p=freeSpot(w,55);
    if(Math.hypot(p.x-sp.x,p.y-sp.y)<170){ i--; continue; }
    w.obstacles.push({x:p.x,y:p.y,w:d.w,h:d.h,type:t,ph:rnd(0,TAU)});
  }
  // friends to find
  const need=friendsNeeded(stage);
  for(let i=0;i<need;i++){
    w.friends.push(placeFriend(w, ()=>({x:rnd(70,W-70),y:rnd(70,H-70)})));
  }
  // totems — shuffled deck so every type shows up before any repeats
  const nTot = Math.min(6+stage, 9);
  const deck = [...TOTEMS].sort(()=>Math.random()-0.5);
  for(let i=0;i<nTot;i++){
    const p=freeSpot(w,55);
    w.totems.push({x:p.x,y:p.y,type:deck[i%deck.length],taken:false,ph:rnd(0,TAU)});
  }
  // EL PULPO — the flame-breathing art car, cruising the field
  w.artcar={x:rnd(W*0.25,W*0.75), y:rnd(Math.max(220,H*0.45),H-120), dir:rnd(0,TAU), t:rnd(1.2,4), ph:rnd(0,TAU)};
  if(Math.hypot(w.artcar.x-sp.x, w.artcar.y-sp.y)<240)
    w.artcar.x = sp.x>W/2 ? Math.max(110,sp.x-300) : Math.min(W-110,sp.x+300);
  return w;
}
function hitsObstacle(w,p,pad){
  return w.obstacles.some(o=>Math.abs(p.x-o.x)<o.w/2+pad && Math.abs(p.y-o.y)<o.h/2+pad);
}
function freeSpot(w,clear){
  for(let k=0;k<60;k++){
    const p={x:rnd(80,w.W-80),y:rnd(80,w.H-80)};
    if(w.crowds.every(c=>Math.hypot(c.x-p.x,c.y-p.y)>c.r+clear) && !hitsObstacle(w,p,clear*0.5)) return p;
  }
  return {x:rnd(80,w.W-80),y:rnd(80,w.H-80)};
}
function placeFriend(w, posFn){
  let p; let tries=0;
  do{ p=posFn(); tries++; }
  while(tries<40 && (w.crowds.some(c=>Math.hypot(c.x-p.x,c.y-p.y)<c.r+14)
        || hitsObstacle(w,p,14)
        || Math.hypot(p.x-w.spawn.x,p.y-w.spawn.y)<130));
  // friends use a random character that's not the player's
  let pal; do{ pal=choice(CHARS); }while(pal===CHARS[G.charIdx]);
  return {x:clamp(p.x,40,w.W-40), y:clamp(p.y,40,w.H-40), pal, ph:rnd(0,TAU)};
}

// ---------- stage start ----------
function startStage(stage, withCutscene, spawnFrac){
  G.stage=stage;
  world=genWorld(stage, spawnFrac);
  player.x=world.spawn.x; player.y=world.spawn.y;
  player.dir=angTo(world.spawn,{x:world.W/2,y:world.H/2}); player.invuln=2;
  party=[]; trail=[{x:player.x,y:player.y}]; trailDist=[0];
  effects={}; exitGate=null; exitArrowT=0; G.zoom=1; friendDryT=0;
  beatN=0; if(AC) setTempo(stage>=FINAL_STAGE?190:TEMPOS[(stage-1)%3]);
  if(world.final){
    // your whole crew comes with you — get them all on the bus
    const crew=Math.min(12, friendsNeeded(stage-1));
    for(let i=0;i<crew;i++) party.push({pal:choice(CHARS)});
    world.timer=62;
    exitGate={x:world.W-90, y:world.H/2};
    player.dir=0;   // face the long road ahead
  }
  camera.x=clamp(player.x-VW/2, -40, world.W-VW+40);
  camera.y=clamp(player.y-VH/2, -40, world.H-VH+40);
  if(withCutscene){
    cutscene={t:0, phase:0, dancers:[]};
    const n=Math.min(friendsNeeded(stage-1)||6, 10);
    for(let i=0;i<n;i++) cutscene.dancers.push({pal:choice(CHARS), i, exitA:rnd(0,TAU)});
    G.state='cutscene';
  } else {
    phoneStart();
  }
}

//  AUDIO — tiny techno engine
// ============================================================
let AC=null, muted=false, beatTimer=null, beatN=0, curTempo=0;
const TEMPOS=[132,150,174];                    // acid techno · big room · drum&bass
function setTempo(bpm){
  if(!AC || bpm===curTempo) return;
  curTempo=bpm;
  if(beatTimer) clearInterval(beatTimer);
  beatTimer=setInterval(beat, 60000/bpm/4);    // 16th notes
}
function audioInit(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  setTempo((G.stage||1)>=FINAL_STAGE?190:TEMPOS[((G.stage||1)-1)%3]);
}
// 2-bar acid bassline (semitones; null = rest)
const BASSLINE=[0,null,0,12, null,0,10,null, 0,12,null,0, 3,null,15,12,
                0,null,0,12, null,0,10,null, 7,12,null,5, 3,null,12,10];
const DNBLINE=[0,0,3,5, 0,10,7,5];
function beat(){
  if(!AC||muted||G.state==='select') return;
  const t=AC.currentTime;
  const style=(G.stage-1)%3;
  const s=beatN%32, S=beatN%512;               // 2-bar groove inside a 32-bar phrase
  beatN++;
  const key=(G.stage%4)*2;                     // key shifts per stage
  if(S>=510) return;                           // breath of silence before the drop
  if(S===0 && beatN>1) crash(t);               // THE DROP
  if(S>=480){                                  // BUILDUP — last 2 bars of the phrase
    const ph=S-480;                            // 0..29
    const div=ph<12?4:ph<22?2:1;               // snare roll tightens
    if(ph%div===0) snare(t, 0.1+ph*0.005);
    if(S%8===0) kick(t);
    hat(t, 0.03+ph*0.006, false);
    if(style===0 && S%4===0) acid(t, 110*Math.pow(2,key/12), 0.1);
    return;
  }
  if(G.stage>=FINAL_STAGE){                    // THE LAST SHUTTLE — flat-out panic
    if(s%4===0) kick(t,true);
    if(s%4===2){ hat(t,0.15,true); acid(t, 110*Math.pow(2,key/12), 0.2); }
    if(s%8===4) clap(t);
    hat(t, s%2?0.08:0.05, false);
    if(s%16===14) snare(t,0.2);
    if(s===8||s===24) stab(t, 440*Math.pow(2,key/12));
  } else if(style===0){                        // ACID TECHNO (the classic)
    if(s%8===0) kick(t);
    if(s%8===4) clap(t);
    if(s%4===2) hat(t,0.16,true); else hat(t,0.05,false);
    const note=BASSLINE[s];
    if(note!==null) acid(t, 55*Math.pow(2,(note+key)/12), 0.16);
    if(s===14||s===30) stab(t, 220*Math.pow(2,key/12));
  } else if(style===1){                        // BIG ROOM / HARDSTYLE
    if(s%4===0) kick(t,true);
    if(s%4===2){ hat(t,0.14,true); acid(t, 110*Math.pow(2,key/12), 0.2); } // offbeat bass
    if(s%16===8) clap(t);
    if(s%2===1) hat(t,0.04,false);
    if(s===12||s===28) stab(t, 330*Math.pow(2,key/12));
  } else {                                     // DRUM & BASS
    if(s%16===0||s%16===10) kick(t);
    if(s%8===4) snare(t,0.24);
    hat(t, s%2?0.09:0.04, false);
    if(s%4===0) sub(t, 55*Math.pow(2,(DNBLINE[(s>>2)%8]+key)/12));
    if(s===30) stab(t, 440*Math.pow(2,key/12));
  }
}
function snare(t,v){ const len=2200;
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
  const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=1900; bp.Q.value=0.9; g.gain.value=v;
  s.buffer=b; s.connect(bp).connect(g).connect(AC.destination); s.start(t);
  const o=AC.createOscillator(),g2=AC.createGain();
  o.frequency.value=190; g2.gain.setValueAtTime(v*0.8,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  o.connect(g2).connect(AC.destination); o.start(t); o.stop(t+0.09);}
function crash(t){ const len=26000;
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type='highpass'; hp.frequency.value=4200; g.gain.value=0.25;
  s.buffer=b; s.connect(hp).connect(g).connect(AC.destination); s.start(t);}
function sub(t,f){ const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.26,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.26);}
function kick(t,hard){ const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(hard?210:160,t); o.frequency.exponentialRampToValueAtTime(hard?44:38,t+(hard?0.13:0.11));
  g.gain.setValueAtTime(hard?0.62:0.55,t); g.gain.exponentialRampToValueAtTime(0.001,t+(hard?0.17:0.14));
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+0.18);}
function hat(t,v,open){ const len=open?3600:1100;
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,open?1.2:2);
  const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type='highpass';hp.frequency.value=7500; g.gain.value=v;
  s.buffer=b; s.connect(hp).connect(g).connect(AC.destination); s.start(t);}
function clap(t){ const len=2600;
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++){ const e=(i%900<60)?1:Math.pow(1-i/len,2.2);   // triple-burst clap
    d[i]=(Math.random()*2-1)*e; }
  const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
  bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=1.2; g.gain.value=0.28;
  s.buffer=b; s.connect(bp).connect(g).connect(AC.destination); s.start(t);}
// squelchy acid bass — saw through a resonant lowpass that wobbles over time
function acid(t,f,v){ const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=f;
  lp.type='lowpass'; lp.Q.value=9;
  const wob=500+420*Math.sin(beatN*0.21);
  lp.frequency.setValueAtTime(180+wob,t); lp.frequency.exponentialRampToValueAtTime(160,t+0.12);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  o.connect(lp).connect(g).connect(AC.destination); o.start(t); o.stop(t+0.14);}
// hoover-ish minor chord stab
function stab(t,f){
  [1,1.189,1.498].forEach(r=>{
    const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
    o.type='square'; o.frequency.value=f*r;
    o.detune.setValueAtTime(-14,t); o.detune.linearRampToValueAtTime(14,t+0.18);
    lp.type='lowpass'; lp.frequency.value=2200;
    g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.connect(lp).connect(g).connect(AC.destination); o.start(t); o.stop(t+0.24);
  });}
function sfx(kind){
  if(!AC||muted) return; const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain(); o.connect(g).connect(AC.destination);
  if(kind==='pick'){ o.type='square'; o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+0.06);
    g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.start(t);o.stop(t+0.16);}
  else if(kind==='hurt'){ o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(60,t+0.25);
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3); o.start(t);o.stop(t+0.3);}
  else if(kind==='totem'){ o.type='triangle'; [523,659,784,1047].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*0.07));
    g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t);o.stop(t+0.4);}
  else if(kind==='exit'){ o.type='square'; [392,523,659,784,1047,1319].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*0.09));
    g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.6); o.start(t);o.stop(t+0.6);}
  else if(kind==='cut'){ o.type='sawtooth'; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(110,t+0.15);
    g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18); o.start(t);o.stop(t+0.2);}
  else if(kind==='beep'){ o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1175,t+0.11);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.03);
    g.gain.setValueAtTime(0.06,t+0.14); g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.start(t);o.stop(t+0.3);}
}

const keys={};

addEventListener('keydown',e=>{
  keys[e.key]=true; audioInit();
  if(e.key==='m'||e.key==='M') muted=!muted;

  if(e.key==='`'||e.key==='~'){
    G.debug=!G.debug;
    say(G.debug?'DEBUG ON · 1-8 JUMP TO STAGE · N = NEXT':'DEBUG OFF','#ff6d00');
  }
  if(G.debug){
    if('12345678'.includes(e.key)){ G.paused=false; startStage(+e.key,false); return; }
    if((e.key==='n'||e.key==='N') && world){ G.paused=false; startStage(Math.min(G.stage+1,FINAL_STAGE),false); return; }
  }
  if((e.key==='p'||e.key==='P') && (G.state==='play')) G.paused=!G.paused;
  if(G.paused && G.state==='play'){
    if(e.key==='r'||e.key==='R'){ G.paused=false; G.totalCollected=0; startStage(1,false); }
    if(e.key==='q'||e.key==='Q'){ G.paused=false; G.state='select'; }
  }
  if(G.state==='phone' && (e.key===' '||e.key==='Enter')){ phone.t=Math.max(phone.t,phone.dur); }
  if(G.state==='select'){
    if(e.key==='ArrowLeft'||e.key==='a') G.charIdx=(G.charIdx+CHARS.length-1)%CHARS.length;
    if(e.key==='ArrowRight'||e.key==='d') G.charIdx=(G.charIdx+1)%CHARS.length;
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='ArrowDown'||e.key==='s') G.charIdx=(G.charIdx+selLayout().cols)%CHARS.length;
    if(e.key==='Enter'||e.key===' '){ G.totalCollected=0; startStage(1,false); }
  } else if((G.state==='gameover'||G.state==='win') && (e.key===' '||e.key==='Enter')){
    G.state='select';
  }
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});

cv.addEventListener('mousemove',e=>{

let touchHeld=false, btnL=false, btnR=false;
function pointerXY(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH};
}
// on-screen steer buttons (touch devices, during play)
function btnRects(){
  const s=66, m=10;
  return {L:{x:m,y:VH-s-m,w:s,h:s}, R:{x:VW-s-m,y:VH-s-m,w:s,h:s}};
}
const inRect=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
function readTouches(list){
  btnL=false; btnR=false; touchHeld=false;
  const r=btnRects();
  for(const t of list){
    const p=pointerXY(t);
    if(G.state==='play' && inRect(p,r.L)) btnL=true;
    else if(G.state==='play' && inRect(p,r.R)) btnR=true;
    else { mouse.x=p.x; mouse.y=p.y; touchHeld=true; mouse.active=1.5; }
  }
}
function pointerDown(mx,my){
  if(G.state==='select'){
    const SL=selLayout();
    const top=SL.y0-44, bot=SL.y0+(SL.rows-1)*SL.rowH+12;
    if(my>top && my<bot){
      const row=clamp(Math.round((my-SL.y0+16)/SL.rowH),0,SL.rows-1);
      let bi=-1,bd=SL.gap/2;
      for(let i=0;i<SL.cols;i++){ const d=Math.abs(mx-(SL.x0+i*SL.gap)); if(d<bd){bd=d;bi=row*SL.cols+i;} }
      if(bi>=0 && bi<CHARS.length){ G.charIdx=bi; return; }
    }
    G.totalCollected=0; startStage(1,false);
  }
  else if(G.state==='gameover'||G.state==='win') G.state='select';
  else if(G.state==='phone'){ phone.t=Math.max(phone.t,phone.dur); }
  else if(G.state==='play'){
    if(my<20 && mx>VW-50){ G.paused=!G.paused; return; }   // tap top-right = pause
    if(G.paused){ G.paused=false; return; }                 // tap anywhere resumes
  }
}
cv.addEventListener('mousedown',e=>{ audioInit(); const p=pointerXY(e); pointerDown(p.x,p.y); });
cv.addEventListener('touchstart',e=>{ e.preventDefault(); audioInit();
  readTouches(e.touches);
  const p=pointerXY(e.touches[0]);
  if(G.state!=='play' || p.y<30 || G.paused) pointerDown(p.x,p.y);   // menus + pause taps
},{passive:false});

cv.addEventListener('touchend',e=>{ e.preventDefault(); readTouches(e.touches);
  if(!touchHeld) mouse.active=Math.min(mouse.active,0.3); },{passive:false});

// ============================================================
//  UPDATE
// ============================================================
function scatterFriends(count, reason){
  // remove `count` from the END of the party; they sprint off in random
  // directions (visibly!) and become world friends again nearby
  const lost = party.splice(party.length-count, count);
  let a0=rnd(0,TAU);
  for(let i=0;i<lost.length;i++){
    const a=a0 + (i/lost.length)*TAU + rnd(-0.3,0.3);   // fan out evenly-ish
    const sp=rnd(260,420);
    world.friends.push({x:player.x, y:player.y-4, pal:lost[i].pal, ph:rnd(0,TAU),
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, fly:1.0});
  }
  if(exitGate && !world.final && party.length < friendsNeeded(G.stage)){ exitGate=null; say('THE EXIT VANISHED...','#ff6d00'); }
  G.shake=Math.min(G.shake+4+count, 10);
}

function hitPenalty(what){
  if(player.invuln>0 || effects.mum) return;   // RAVE MUM has you
  if(party.length===0){
    gameOverInfo={stage:G.stage, total:G.totalCollected, what};
    G.state='gameover'; sfx('hurt'); G.shake=12;
    return;
  }
  const lose=Math.ceil(party.length/2);
  scatterFriends(lose, what);
  say(`-${lose} FRIENDS! (${what})`,'#ff4f4f');
  sfx('hurt');
  player.invuln=2.2;
  // bounce back toward map centre-ish
  const a=angTo(player,{x:world.W/2,y:world.H/2});
  player.dir=a+rnd(-0.5,0.5);
}

function update(dt){
  G.t+=dt;
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*18);
  for(const m of G.msgs) m.t-=dt;
  G.msgs=G.msgs.filter(m=>m.t>0);

  if(G.state==='flash'){ flashT-=dt; if(flashT<=0) G.state='play'; updateCamera(dt); return; }
  if(G.state==='cutscene'){ updateCutscene(dt); return; }
  if(G.state==='transition'){ updateTransition(dt); return; }
  if(G.state==='phone'){ updatePhone(dt); return; }
  if(G.state==='win'){ winT+=dt; return; }
  if(G.state!=='play' || G.paused) return;

  // the last shuttle waits for no one
  if(world.final){
    world.timer-=dt;
    if(world.timer<=10.5 && world.timer+dt>10.5) say('THE BUS IS ABOUT TO LEAVE!','#ff4f4f');
    if(world.timer<=0){
      gameOverInfo={stage:G.stage, total:G.totalCollected, what:'missed the last shuttle', bus:true};
      G.state='gameover'; sfx('hurt'); G.shake=10;
      return;
    }
  }

  // a mate pings you if you haven't found anyone in a while
  if(world.friends.length){
    friendDryT+=dt;
    if(friendDryT>15 && friendDryT-dt<=15){ say('A MATE PINGS THEIR LOCATION!','#39ff14'); sfx('beep'); }
  } else friendDryT=0;

  // ----- effects tick -----
  for(const id in effects){ effects[id]-=dt; if(effects[id]<=0) delete effects[id]; }
  if(player.invuln>0) player.invuln-=dt;
  if(exitArrowT>0) exitArrowT-=dt;
  // flashlight zooms the camera out ~30%
  G.zoom=lerp(G.zoom||1, effects.torch?0.72:1, 1-Math.pow(0.05,dt));

  // ----- steering (game speeds up 30% per stage; turn scales to match) -----
  const smul=Math.min(Math.pow(1.3,G.stage-1),2.4);
  const turn=4.2*smul;
  if(keys['ArrowLeft']||keys['a']||btnL) { player.dir-=turn*dt; mouse.active=0; }
  if(keys['ArrowRight']||keys['d']||btnR){ player.dir+=turn*dt; mouse.active=0; }
  if(touchHeld) mouse.active=1.5;
  if(mouse.active>0){
    mouse.active-=dt;
    const target=Math.atan2(mouse.y-VH/2, mouse.x-VW/2);
    const d=angDiff(player.dir,target);
    player.dir+=clamp(d, -turn*dt, turn*dt);
  }
  const spd = player.speed * smul * (effects.water?1.45:1);
  player.x+=Math.cos(player.dir)*spd*dt;
  player.y+=Math.sin(player.dir)*spd*dt;

  // ----- trail record -----
  const last=trail[trail.length-1];
  const dd=Math.hypot(player.x-last.x,player.y-last.y);
  if(dd>1.5){
    trail.push({x:player.x,y:player.y});
    trailDist.push(trailDist[trailDist.length-1]+dd);
    const maxLen=(party.length+4)*SPACING+60;
    while(trailDist[trailDist.length-1]-trailDist[0]>maxLen){ trail.shift(); trailDist.shift(); }
  }

  // ----- walls -----
  const M=14;
  if(player.x<M||player.x>world.W-M||player.y<M||player.y>world.H-M){
    player.x=clamp(player.x,M+2,world.W-M-2);
    player.y=clamp(player.y,M+2,world.H-M-2);
    hitPenalty('hit the fence');
  }

  // ----- crowds -----
  for(const c of world.crowds){
    if(Math.hypot(c.x-player.x,c.y-player.y)>c.r+20) continue;
    for(const m of c.members){
      // bass drop pushes crowd away
      if(effects.bass){
        const d=Math.hypot(m.x+m.hx-player.x,m.y+m.hy-player.y);
        if(d<80){ const a=angTo(player,{x:m.x+m.hx,y:m.y+m.hy});
          m.hx+=Math.cos(a)*60*dt*(1-d/80)*10; m.hy+=Math.sin(a)*60*dt*(1-d/80)*10; }
      } else { m.hx*=Math.pow(0.3,dt); m.hy*=Math.pow(0.3,dt); }
      if(player.invuln<=0 && Math.hypot(m.x+m.hx-player.x, m.y+m.hy-player.y)<7){
        hitPenalty('crashed into the crowd'); break;
      }
    }
  }

  // ----- the art car cruises about, breathing fire -----
  const ac=world.artcar;
  if(ac){
    ac.t+=dt;
    ac.dir+=Math.sin(G.t*0.4+ac.ph)*0.3*dt;
    ac.x+=Math.cos(ac.dir)*14*dt; ac.y+=Math.sin(ac.dir)*14*dt;
    const yMin=world.final?60:180;
    if(ac.x<90||ac.x>world.W-90) ac.dir=Math.PI-ac.dir;
    if(ac.y<yMin||ac.y>world.H-70) ac.dir=-ac.dir;
    ac.x=clamp(ac.x,90,world.W-90); ac.y=clamp(ac.y,yMin,world.H-70);
    const flame=(ac.t%5)<1;
    if(player.invuln<=0 && Math.hypot(ac.x-player.x,(ac.y-10)-player.y)<(flame?36:26)){
      const a=angTo(ac,player);
      player.x=ac.x+Math.cos(a)*46; player.y=ac.y+Math.sin(a)*46;
      hitPenalty(flame?'got singed by the art car':'bumped the art car');
    }
  }

  // ----- solid obstacles -----
  if(player.invuln<=0){
    for(const o of world.obstacles){
      const nx=clamp(player.x,o.x-o.w/2,o.x+o.w/2), ny=clamp(player.y,o.y-o.h/2,o.y+o.h/2);
      if(Math.hypot(nx-player.x,ny-player.y)<5){
        // shove out of the rect before penalising
        const a=angTo({x:o.x,y:o.y},player);
        player.x=o.x+Math.cos(a)*(o.w/2+8); player.y=o.y+Math.sin(a)*(o.h/2+8);
        hitPenalty('smacked into the '+OB_NAMES[o.type]);
        break;
      }
    }
  }

  // ----- scattered friends sprinting away -----
  for(const f of world.friends){
    if(f.fly>0){
      f.fly-=dt;
      f.x+=f.vx*dt; f.y+=f.vy*dt;
      f.vx*=Math.pow(0.05,dt); f.vy*=Math.pow(0.05,dt);
      f.x=clamp(f.x,30,world.W-30); f.y=clamp(f.y,30,world.H-30);
    }
  }

  // ----- collect friends -----
  for(let i=world.friends.length-1;i>=0;i--){
    const f=world.friends[i];
    if(f.fly>0.35) continue;                 // can't grab them mid-sprint
    if(Math.hypot(f.x-player.x,f.y-player.y)<11){
      world.friends.splice(i,1);
      party.push({pal:f.pal});
      G.totalCollected++; friendDryT=0;
      sfx('pick');
      say(`FOUND A FRIEND! ${party.length}/${friendsNeeded(G.stage)}`,'#39ff14');
      if(party.length>=friendsNeeded(G.stage) && !exitGate){
        spawnExit(); }
    }
  }

  // ----- totems (respawn elsewhere 20s after pickup) -----
  for(const tm of world.totems){
    if(!tm.taken && Math.hypot(tm.x-player.x,tm.y-player.y)<12){
      tm.taken=true; tm.respawnT=20;
      effects[tm.type.id]=tm.type.dur;
      say(`${tm.type.name}! ${tm.type.msg}`, tm.type.col);
      sfx('totem');
    } else if(tm.taken){
      tm.respawnT-=dt;
      if(tm.respawnT<=0){
        const p=freeSpot(world,55);
        tm.x=p.x; tm.y=p.y; tm.type=choice(TOTEMS); tm.taken=false; tm.ph=rnd(0,TAU);
      }
    }
  }

  // ----- SQUAD FLAG: your mates trek toward you from across the map -----
  if(effects.flag){
    for(const f of world.friends){
      if(f.fly>0) continue;
      const a=angTo(f,player);
      f.x+=Math.cos(a)*42*dt; f.y+=Math.sin(a)*42*dt;
      f.walkA=a;
    }
  }

  // ----- self collision: cut the tail -----
  const members=partyPositions();
  const trailLen=trailDist[trailDist.length-1]-trailDist[0];
  for(let i=2;i<members.length;i++){
    if((i+1)*SPACING > trailLen-4) break;   // member still bunched at trail start
    if(Math.hypot(members[i].x-player.x,members[i].y-player.y)<6 && player.invuln<=0 && !effects.mum){
      const cut=party.length-i;
      scatterFriends(cut,'tangled the conga line');
      say(`CONGA CRASH! ${cut} scattered!`,'#ff6d00');
      sfx('cut');
      player.invuln=1.2;
      break;
    }
  }

  // ----- exit -----
  if(exitGate && Math.hypot(exitGate.x-player.x,exitGate.y-player.y)<16){
    sfx('exit');
    if(world.final){ winCrew=party.length; winT=0; G.state='win'; }
    else beginTransition();
  }

  updateCamera(dt);
}

function spawnExit(){
  const W=world.W,H=world.H;
  let p,k=0;
  do{
    const side=ri(0,3);
    p = side===0?{x:rnd(100,W-100),y:24}
      : side===1?{x:rnd(100,W-100),y:H-24}
      : side===2?{x:24,y:rnd(100,H-100)}
      : {x:W-24,y:rnd(100,H-100)};
  } while(k++<30 && hitsObstacle(world,p,28));   // never behind the stage
  exitGate=p;
  exitArrowT=3.5;
  say('THE EXIT APPEARED! FOLLOW THE ARROW!','#f5d300');
  sfx('exit');
}

// positions of party members along the trail
function partyPositions(){
  const out=[]; if(!trail.length) return out;
  const total=trailDist[trailDist.length-1];
  let idx=trail.length-1;
  for(let i=0;i<party.length;i++){
    const want=total-(i+1)*SPACING;
    while(idx>0 && trailDist[idx]>want) idx--;
    const a=trail[idx], b=trail[Math.min(idx+1,trail.length-1)];
    const da=trailDist[idx], db=trailDist[Math.min(idx+1,trailDist.length-1)];
    const t=db>da?clamp((want-da)/(db-da),0,1):0;
    out.push({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)});
  }
  return out;
}

function updateCamera(dt){
  const Z=G.zoom||1, vw=VW/Z, vh=VH/Z;
  camera.x=lerp(camera.x, clamp(player.x-vw/2, -40, world.W-vw+40), 1-Math.pow(0.001,dt));
  camera.y=lerp(camera.y, clamp(player.y-vh/2, -40, world.H-vh+40), 1-Math.pow(0.001,dt));
}

// ----- transition: seamless slide to the next stage -----
function beginTransition(){
  // snapshot the current frame, generate next stage, slide the old view away
  const snap=document.createElement('canvas'); snap.width=cv.width; snap.height=cv.height;
  snap.getContext('2d').drawImage(cv,0,0);
  // you slide over with the map: re-enter from the OPPOSITE side
  const frac={x:1-exitGate.x/world.W, y:1-exitGate.y/world.H};
  startStage(G.stage+1,true,frac);       // builds new world + cutscene
  transition={t:0, snap};
  G.state='transition';
}
function updateTransition(dt){
  transition.t+=dt;
  updateCamera(dt);
  if(transition.t>=1.2){ transition=null; G.state='cutscene'; }
}
function updateCutscene(dt){
  const c=cutscene; c.t+=dt;
  // phases: 0 walk in (1.2s) | 1 dance (2.2s) | 2 spin (1.2s) | 3 run off (1s)
  const lens=[1.2,2.2,1.2,1.0];
  if(c.t>lens[c.phase]){ c.t=0; c.phase++;
    if(c.phase>=4){ cutscene=null; phoneStart(); return; }
  }
  updateCamera(dt);
}
// ============================================================
//  RENDER
// ============================================================
function hash2(i,j){ const s=Math.sin(i*127.1+j*311.7)*43758.5453; return s-Math.floor(s); }
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function render(){
  cx.setTransform(PIX,0,0,PIX,0,0);
  cx.fillStyle='#07030f'; cx.fillRect(0,0,VW,VH);
  switch(G.state){
    case 'select': renderSelect(); break;
    case 'win': renderWin(); break;
    case 'gameover': renderPlay(); renderGameOver(); break;
    case 'phone': renderPlay(); renderPhone(); break;
    case 'cutscene': renderPlay(); renderCutscene(); break;
    case 'flash': renderPlay(); renderFlash(); break;
    case 'transition':
      renderPlay();
      if(transition){
        const off=ease(clamp(transition.t/1.1,0,1))*VW;
        cx.drawImage(transition.snap, -Math.round(off), 0, VW, VH);
      }
      break;
    default: renderPlay(); renderHUD();
  }
}

// ---------- world ----------
function renderPlay(){
  const Z=G.zoom||1, vw=VW/Z, vh=VH/Z;
  const sx=Math.round(camera.x - (G.shake? rnd(-G.shake,G.shake):0));
  const sy=Math.round(camera.y - (G.shake? rnd(-G.shake,G.shake):0));
  cx.save(); cx.scale(Z,Z); cx.translate(-sx,-sy);

  // ground — solid base with a subtle big checkerboard, reads as one floor
  cx.fillStyle='#130a21'; cx.fillRect(sx,sy,vw+2,vh+2);
  const T=24;
  cx.fillStyle='#180e2b';
  for(let gx=Math.floor(sx/T)*T; gx<sx+vw+T; gx+=T)
    for(let gy=Math.floor(sy/T)*T; gy<sy+vh+T; gy+=T)
      if(((gx+gy)/T)%2===0) cx.fillRect(gx,gy,T,T);
  // fence
  cx.fillStyle='#3a2f55';
  for(let x=0;x<world.W;x+=20){ if(x>sx-20&&x<sx+vw){ cx.fillRect(x,8,3,8); cx.fillRect(x,world.H-16,3,8);} }
  for(let y=0;y<world.H;y+=20){ if(y>sy-20&&y<sy+vh){ cx.fillRect(8,y,8,3); cx.fillRect(world.W-16,y,8,3);} }
  cx.fillStyle='#241b3a';
  cx.fillRect(0,12,world.W,2); cx.fillRect(0,world.H-12,world.W,2);
  cx.fillRect(12,0,2,world.H); cx.fillRect(world.W-12,0,2,world.H);

  // solid obstacles
  for(const o of world.obstacles){
    if(o.x+o.w<sx-30||o.x-o.w>sx+vw+30||o.y+o.h<sy-40||o.y-o.h>sy+vh+40) continue;
    drawObstacle(o);
  }

  // exit gate (in world — only visible if in fog hole, fine)
  if(exitGate) drawExit(exitGate.x,exitGate.y);

  // the art car (between obstacles and friends)
  if(world.artcar && world.artcar.x>sx-100 && world.artcar.x<sx+vw+100
     && world.artcar.y>sy-100 && world.artcar.y<sy+vh+100) drawArtCar(world.artcar);

  // friends — raving hard, glowsticks in the air (your people!)
  const fr=Math.floor(G.t*4)%2;
  for(const f of world.friends){
    if(f.x<sx-20||f.x>sx+vw+20||f.y<sy-25||f.y>sy+vh+25) continue;
    const flying=f.fly>0;
    const bob=Math.sin(G.t*6+f.ph)>0?1:0;
    // glow halo so your mates stand out
    const hg=cx.createRadialGradient(f.x,f.y-8,2,f.x,f.y-8,14+2*Math.sin(G.t*5+f.ph));
    hg.addColorStop(0,f.pal.glow+'77'); hg.addColorStop(1,f.pal.glow+'00');
    cx.fillStyle=hg; cx.fillRect(f.x-16,f.y-24,32,32);
    cx.fillStyle=f.pal.glow+'44'; cx.fillRect(f.x-6,f.y-2,12,3);
    if(flying){ // sprinting away, arms down, facing where they're running
      drawRaver(cx,f.x,f.y,f.pal,Math.floor(G.t*14+f.ph)%2,
        {armsUp:false, facing:dirFacing(Math.atan2(f.vy,f.vx))});
    } else if(effects.flag){ // marching to the flag!
      drawRaver(cx,f.x,f.y,f.pal,Math.floor(G.t*10+f.ph)%2,
        {armsUp:false, facing:dirFacing(f.walkA||0)});
    } else {
      drawRaver(cx,f.x,f.y-bob,f.pal,(fr+Math.floor(f.ph))%2,{armsUp:true,facing:'down'});
      // little "!" sparkle
      if(Math.sin(G.t*3+f.ph)>0.6){ cx.fillStyle='#fff'; cx.fillRect(f.x+6,f.y-20,1,3); cx.fillRect(f.x+6,f.y-16,1,1); }
    }
  }

  // crowds — arms down, just standing about watching the stage
  for(const c of world.crowds){
    if(c.x+c.r<sx-25||c.x-c.r>sx+vw+25||c.y+c.r<sy-25||c.y-c.r>sy+vh+25) continue;
    for(const m of c.members){
      const shuffle=Math.floor(G.t*1.5+m.ph)%2;
      drawRaver(cx,m.x+m.hx,m.y+m.hy,m.pal,shuffle,{dim:0.55,armsUp:false,facing:m.facing});
    }
  }

  // totems (world layer)
  for(const tm of world.totems){ if(!tm.taken) drawTotem(tm); }

  // party + player
  const members=partyPositions();
  for(let i=members.length-1;i>=0;i--){
    const m=members[i], bob=Math.floor(G.t*8+i)%2;
    const lead = i===0? player : members[i-1];
    drawRaver(cx,m.x,m.y,party[i].pal,bob,{facing:dirFacing(angTo(m,lead)),armsUp:true});
  }
  if(player.invuln<=0 || Math.floor(G.t*10)%2===0){
    const pal=CHARS[G.charIdx];
    const checking = G.state==='phone';
    if(effects.mum){ // mum's protective aura
      const mg=cx.createRadialGradient(player.x,player.y-8,3,player.x,player.y-8,20);
      mg.addColorStop(0,'#ff8fab66'); mg.addColorStop(1,'#ff8fab00');
      cx.fillStyle=mg; cx.fillRect(player.x-20,player.y-28,40,40);
    }
    cx.fillStyle=pal.glow+'55'; cx.fillRect(player.x-6,player.y-2,12,3);
    drawRaver(cx,player.x,player.y,pal, checking?0:Math.floor(G.t*8)%2,
      {facing: checking?'down':dirFacing(player.dir), armsUp:!checking});
    if(checking){ // wee glowing phone in hand
      cx.fillStyle='#9be7ff'; cx.fillRect(player.x+2,player.y-4.5,2,3);
      cx.fillStyle='#9be7ff33'; cx.fillRect(player.x,player.y-6.5,6,7);
    }
    if(effects.flag){ // the squad flag, waving above your head
      const wob=Math.sin(G.t*7)*1.5;
      cx.fillStyle='#c9b78a'; cx.fillRect(player.x+5,player.y-28,1,16);
      cx.fillStyle='#ffffff'; cx.fillRect(player.x+6,player.y-28+wob*0.3,6,3);
      cx.fillStyle='#ff2d95'; cx.fillRect(player.x+6,player.y-25+wob*0.3,4,2);
    }
  }
  // direction arrow — shows where the train is heading
  {
    const pal=CHARS[G.charIdx];
    const ax=player.x+Math.cos(player.dir)*15, ay=player.y-6+Math.sin(player.dir)*15;
    cx.save(); cx.translate(ax,ay); cx.rotate(player.dir);
    cx.globalAlpha=0.65+0.3*Math.sin(G.t*6);
    cx.fillStyle=pal.glow;
    cx.beginPath(); cx.moveTo(5,0); cx.lineTo(-3,-4); cx.lineTo(-1,0); cx.lineTo(-3,4); cx.closePath(); cx.fill();
    cx.restore(); cx.globalAlpha=1;
  }

  // bright laser pass — fixed to the map, inside the vision bubble
  drawWorldLasers(0.15,sx,sy,vw,vh);

  cx.restore();

  // ---------- fog of war ----------
  if(G.state!=='select'){
    const lit=!!effects.glow;   // FAMILY PHOTO: the lights are on!
    const R=(VISION*(lit?1.8:1) * (G.state==='flash'?1.2:1))*Z;
    const px=(player.x-sx)*Z, py=(player.y-sy)*Z;
    const FW=fogC.width, FH=fogC.height;
    fx.clearRect(0,0,FW,FH);
    fx.fillStyle=lit?'rgba(4,2,14,0.6)':'rgba(4,2,14,0.985)';
    fx.fillRect(0,0,FW,FH);
    fx.globalCompositeOperation='destination-out';
    const grd=fx.createRadialGradient(px/FOGS,py/FOGS,R*0.72/FOGS,px/FOGS,py/FOGS,R/FOGS);
    grd.addColorStop(0,'rgba(0,0,0,1)'); grd.addColorStop(0.8,'rgba(0,0,0,0.55)'); grd.addColorStop(1,'rgba(0,0,0,0)');
    fx.fillStyle=grd; fx.fillRect(0,0,FW,FH);
    // FLASHLIGHT — a cone of light carving through the fog ahead of you
    if(effects.torch){
      const cl=R*2.6, half=0.42;
      const g2=fx.createRadialGradient(px/FOGS,py/FOGS,R*0.3/FOGS,px/FOGS,py/FOGS,cl/FOGS);
      g2.addColorStop(0,'rgba(0,0,0,1)'); g2.addColorStop(0.8,'rgba(0,0,0,0.85)'); g2.addColorStop(1,'rgba(0,0,0,0)');
      fx.fillStyle=g2;
      fx.beginPath();
      fx.moveTo(px/FOGS,py/FOGS);
      fx.arc(px/FOGS,py/FOGS,cl/FOGS, player.dir-half, player.dir+half);
      fx.closePath(); fx.fill();
    }
    // the art car lights up the field around it (flares when it breathes fire)
    if(world.artcar){
      const ac=world.artcar, fl=(ac.t%5)<1;
      const ax=(ac.x-sx)*Z, ay=(ac.y-16-sy)*Z;
      const ar=(fl? 150+Math.sin(G.t*30)*10 : 85)*Z;
      const g3=fx.createRadialGradient(ax/FOGS,ay/FOGS,ar*0.25/FOGS,ax/FOGS,ay/FOGS,ar/FOGS);
      g3.addColorStop(0,'rgba(0,0,0,0.95)'); g3.addColorStop(1,'rgba(0,0,0,0)');
      fx.fillStyle=g3; fx.fillRect(0,0,FW,FH);
    }
    fx.globalCompositeOperation='source-over';
    cx.drawImage(fogC,0,0,VW,VH);

    // lasers ghosting through the fog, softened
    cx.save(); cx.scale(Z,Z); cx.translate(-sx,-sy);
    drawWorldLasers(lit?0.09:0.05,sx,sy,vw,vh);
    cx.restore();

    // vision boundary — rotating dotted ring so you can SEE the fog edge
    cx.save();
    cx.strokeStyle=lit?'#f5d30055':'#9b7bff66'; cx.lineWidth=1;
    cx.setLineDash([3,5]); cx.lineDashOffset=-G.t*12;
    cx.beginPath(); cx.arc(px,py,R+Math.sin(G.t*2)*2,0,TAU); cx.stroke();
    cx.restore();

    // ----- things visible THROUGH the fog -----
    cx.save(); cx.scale(Z,Z); cx.translate(-sx,-sy);
    for(const tm of world.totems){ if(!tm.taken) drawTotemBeacon(tm); }
    // the pinged mate glows through the fog
    if((effects.sober || friendDryT>15) && world.friends.length){
      let best=null,bd=1e9;
      for(const f of world.friends){ const d=Math.hypot(f.x-player.x,f.y-player.y); if(d<bd){bd=d;best=f;} }
      if(best){
        cx.globalAlpha=0.55+0.35*Math.sin(G.t*5);
        drawRaver(cx,best.x,best.y,best.pal,Math.floor(G.t*4)%2,{armsUp:true,facing:'down'});
        cx.fillStyle='#39ff14'; cx.fillRect(best.x-1,best.y-24,3,2); cx.fillRect(best.x,best.y-27,1,2);
        cx.globalAlpha=1;
      }
    }
    cx.restore();

    // arrows: exit arrow stays up until the exit is INSIDE your vision
    const visR=VISION*(lit?1.8:1)*0.95;
    if(exitGate) edgeArrow(exitGate,'#f5d300',sx,sy,Z,visR);
    if((effects.sober || friendDryT>15) && !exitGate && world.friends.length){
      let best=null,bd=1e9;
      for(const f of world.friends){ const d=Math.hypot(f.x-player.x,f.y-player.y); if(d<bd){bd=d;best=f;} }
      if(best) edgeArrow(best,'#39ff14',sx,sy,Z,visR);
    }
  }
}

// chunky pixel structures — unmistakably NOT totems
function drawObstacle(o){
  const x=Math.round(o.x), y=Math.round(o.y);
  const L=x-o.w/2, T=y-o.h/2;
  switch(o.type){
    case 'bar': {
      cx.fillStyle='#4a2c17'; cx.fillRect(L,T+6,o.w,o.h-6);
      cx.fillStyle='#6b3f20'; cx.fillRect(L,T+6,o.w,3);
      for(let i=0;i<o.w;i+=7){ cx.fillStyle=(i/7)%2?'#ff2d95':'#efe6f7'; cx.fillRect(L+i,T-6,Math.min(7,o.w-i),7); }
      for(let i=0;i<6;i++){ cx.fillStyle=['#39ff14','#00e5ff','#f5d300','#ff2d95','#b14aed','#ff6d00'][i];
        cx.fillRect(L+9+i*10,T+10,2,5); }
      cx.fillStyle='#fff'; cx.font='bold 8px monospace'; cx.textAlign='center'; cx.fillText('B A R',x,T+4);
      break; }
    case 'loo': {
      const n=4, cw=Math.floor(o.w/n);
      for(let i=0;i<n;i++){
        const cl=L+i*cw;
        cx.fillStyle='#0e7490'; cx.fillRect(cl,T,cw-2,o.h);
        cx.fillStyle='#a5f3fc'; cx.fillRect(cl,T,cw-2,2);
        cx.fillStyle='#155e75'; cx.fillRect(cl+2,T+4,cw-6,o.h-5);
        cx.fillStyle='#fff'; cx.fillRect(cl+cw-6,T+Math.floor(o.h/2),1,3);
      }
      cx.fillStyle='#fff'; cx.font='bold 6px monospace'; cx.textAlign='center'; cx.fillText('WC',L+8,T-2);
      break; }
    case 'speaker': {
      // stack of classic round-cone speakers, 2 wide x 3 high
      cx.fillStyle='#0c0c14'; cx.fillRect(L,T,o.w,o.h);
      const th=Math.sin(G.t*8+o.ph)>0;
      for(let r=0;r<3;r++) for(let c=0;c<2;c++){
        const bx=L+2+c*18, by2=T+2+r*14;
        cx.fillStyle='#1d1d28'; cx.fillRect(bx,by2,17,13);          // cabinet
        cx.fillStyle='#0c0c14'; cx.fillRect(bx+1,by2+1,15,11);
        const ccx=bx+8.5, ccy=by2+6.5;
        cx.beginPath(); cx.arc(ccx,ccy,5.5,0,TAU); cx.fillStyle='#2e2e40'; cx.fill();   // surround
        cx.beginPath(); cx.arc(ccx,ccy,4.2,0,TAU); cx.fillStyle='#15151f'; cx.fill();   // cone
        const punch=th&&r===2?2.6:2.1;                                                   // bottom row thumps
        cx.beginPath(); cx.arc(ccx,ccy,punch,0,TAU); cx.fillStyle='#3c3c52'; cx.fill();
        cx.beginPath(); cx.arc(ccx,ccy,1,0,TAU); cx.fillStyle='#8a8aa8'; cx.fill();      // dust cap
      }
      cx.fillStyle=th?'#ff2d95':'#3a1a2e'; cx.fillRect(x-4,T-3,8,3);
      break; }
    case 'tent': {
      cx.fillStyle='#3d2a63'; cx.fillRect(L,T+6,o.w,o.h-6);
      for(let i=0;i<o.w;i+=5){ cx.fillStyle=(i/5)%2?'#7c3aed':'#2a1b47'; cx.fillRect(L+i,T,Math.min(5,o.w-i),7); }
      cx.fillStyle='#150c26'; cx.fillRect(x-4,T+8,8,o.h-8);
      cx.fillStyle='#f5d300'; cx.fillRect(x-5,T+6,10,1);
      break; }
    case 'merch': {
      cx.fillStyle='#2a2a3a'; cx.fillRect(L,T+5,o.w,o.h-5);
      for(let i=0;i<o.w;i+=8){ cx.fillStyle=(i/8)%2?'#00e5ff':'#0d0d18'; cx.fillRect(L+i,T-5,Math.min(8,o.w-i),6); }
      // hanging tees
      ['#ff2d95','#39ff14','#f5d300','#b14aed'].forEach((c,i)=>{
        const tx2=L+7+i*11;
        cx.fillStyle=c; cx.fillRect(tx2,T+8,7,6); cx.fillRect(tx2-1,T+8,9,2);
      });
      cx.fillStyle='#fff'; cx.font='bold 7px monospace'; cx.textAlign='center'; cx.fillText('MERCH',x,T+4);
      break; }
    case 'bin': {
      [0,1,2].forEach(i=>{
        const bx=L+i*12;
        cx.fillStyle='#1e2a1e'; cx.fillRect(bx,T+3,10,o.h-3);
        cx.fillStyle='#162016'; cx.fillRect(bx+1,T+6,8,2);             // band
        cx.fillStyle=['#39ff14','#00e5ff','#f5d300'][i]; cx.fillRect(bx-1,T,12,4);  // lid
        cx.fillStyle='#0d140d'; cx.fillRect(bx+3,T+1,4,2);             // flap
        cx.fillStyle='#0d140d'; cx.fillRect(bx+1,T+o.h-1,3,1); cx.fillRect(bx+6,T+o.h-1,3,1);
      });
      // flies
      const fa=G.t*7+o.ph;
      cx.fillStyle='#a3e635';
      cx.fillRect(Math.round(x+Math.cos(fa)*9), Math.round(T-5+Math.sin(fa*1.7)*4), 1,1);
      cx.fillRect(Math.round(x-6+Math.cos(fa*1.3+2)*7), Math.round(T-3+Math.sin(fa*2.1)*3), 1,1);
      break; }
    case 'stage': {
      // platform
      cx.fillStyle='#1a1230'; cx.fillRect(L,T,o.w,o.h);
      cx.fillStyle='#241b3a'; cx.fillRect(L,T+o.h-7,o.w,7);          // front skirt
      cx.fillStyle='#4a3d6e'; cx.fillRect(L,T+o.h-8,o.w,1);          // lip highlight
      // big speaker walls each side
      [L+4, L+o.w-22].forEach(bx=>{
        cx.fillStyle='#0c0c14'; cx.fillRect(bx,T+8,18,o.h-20);
        cx.fillStyle='#23232f'; cx.fillRect(bx+2,T+11,14,9); cx.fillRect(bx+2,T+22,14,9);
        cx.fillStyle='#44445a'; cx.fillRect(bx+6,T+13,6,5); cx.fillRect(bx+6,T+24,6,5);
      });
      // DJ behind the booth
      drawRaver(cx,x,T+34,world.djPal,Math.floor(G.t*4)%2,
        {facing:'down', armsUp:Math.floor(G.t*2)%2===0});
      // booth (covers DJ's legs)
      cx.fillStyle='#0c0c14'; cx.fillRect(x-24,T+22,48,13);
      cx.fillStyle=Math.sin(G.t*4)>0?'#ff2d95':'#00e5ff'; cx.fillRect(x-24,T+22,48,2);
      cx.fillStyle='#33333f'; cx.fillRect(x-18,T+27,10,4); cx.fillRect(x+8,T+27,10,4); // decks
      // laser truss above
      cx.fillStyle='#3a2f55';
      cx.fillRect(L+6,T-12,3,12); cx.fillRect(L+o.w-9,T-12,3,12);
      cx.fillRect(L+6,T-12,o.w-12,2);
      // stage name sign
      cx.fillStyle='#f5d300'; cx.font='bold 7px monospace'; cx.textAlign='center';
      cx.fillText(STAGE_NAMES[(G.stage-1)%STAGE_NAMES.length], x, T-3);
      break; }
  }
}

// lasers from the stage truss, FIXED to the map (drawn in world space)
function drawWorldLasers(alpha,sx,sy,vw=VW,vh=VH){
  cx.save();
  cx.globalCompositeOperation='lighter';
  const cols=['#ff2d95','#00e5ff','#39ff14','#f5d300','#7c3aed'];
  const len=Math.min(world.H*0.9, 1200);   // beams reach right across the field
  for(const L of world.lasers){
    if(L.x<sx-len||L.x>sx+vw+len||L.y>sy+vh) continue;
    const a=Math.PI/2 + Math.sin(G.t*L.sp+L.ph)*0.95;
    const w=0.035+0.015*Math.sin(G.t*0.8+L.ph);
    cx.globalAlpha=alpha;
    cx.fillStyle=cols[L.c];
    cx.beginPath();
    cx.moveTo(L.x,L.y);
    cx.lineTo(L.x+Math.cos(a-w)*len, L.y+Math.sin(a-w)*len);
    cx.lineTo(L.x+Math.cos(a+w)*len, L.y+Math.sin(a+w)*len);
    cx.closePath(); cx.fill();
    // hot core
    cx.globalAlpha=alpha*0.5;
    cx.fillStyle='#ffffff';
    cx.beginPath();
    cx.moveTo(L.x,L.y);
    cx.lineTo(L.x+Math.cos(a-0.006)*len, L.y+Math.sin(a-0.006)*len);
    cx.lineTo(L.x+Math.cos(a+0.006)*len, L.y+Math.sin(a+0.006)*len);
    cx.closePath(); cx.fill();
    // truss-mounted fixture
    cx.globalAlpha=Math.min(1,alpha*4);
    cx.fillStyle='#2a2240'; cx.fillRect(L.x-3,L.y-4,6,4);
    cx.fillStyle=cols[L.c]; cx.fillRect(L.x-2,L.y-1,4,2);
  }
  cx.restore();
}

// sweeping rave lasers, screen-space — title screen only
function renderLasers(alpha){
  cx.save();
  cx.globalCompositeOperation='lighter';
  cx.globalAlpha=alpha;
  const cols=['#ff2d95','#00e5ff','#39ff14','#f5d300','#7c3aed'];
  for(let i=0;i<4;i++){
    const ox=VW*(0.12+0.25*i);
    const a=Math.PI/2 + Math.sin(G.t*(0.45+i*0.17)+i*1.9)*0.85;
    const w=0.045+0.02*Math.sin(G.t*0.9+i);
    const len=420;
    cx.fillStyle=cols[(i+Math.floor(G.t/3))%cols.length];
    cx.beginPath();
    cx.moveTo(ox,-6);
    cx.lineTo(ox+Math.cos(a-w)*len, -6+Math.sin(a-w)*len);
    cx.lineTo(ox+Math.cos(a+w)*len, -6+Math.sin(a+w)*len);
    cx.closePath(); cx.fill();
    // hot core line
    cx.fillStyle='#ffffff';
    cx.globalAlpha=alpha*0.5;
    cx.beginPath();
    cx.moveTo(ox,-6);
    cx.lineTo(ox+Math.cos(a-0.006)*len, -6+Math.sin(a-0.006)*len);
    cx.lineTo(ox+Math.cos(a+0.006)*len, -6+Math.sin(a+0.006)*len);
    cx.closePath(); cx.fill();
    cx.globalAlpha=alpha;
  }
  cx.restore();
}

// BIG pulsing chevron arrow. With hideDist: shown until target is within
// hideDist of the player (i.e. inside the vision bubble), even if on screen.
function edgeArrow(target,col,sx,sy,Z=1,hideDist=0){
  if(hideDist>0 && Math.hypot(target.x-player.x,target.y-player.y)<hideDist) return;
  let tx=(target.x-sx)*Z, ty=(target.y-sy)*Z;
  if(!hideDist && tx>8&&tx<VW-8&&ty>8&&ty<VH-8) return;   // on screen already
  const a=Math.atan2(ty-VH/2,tx-VW/2);
  const m=22;
  let ex=clamp(tx,m,VW-m), ey=clamp(ty,m,VH-m);
  cx.save(); cx.translate(ex,ey); cx.rotate(a);
  const pulse=1+0.14*Math.sin(G.t*6);
  cx.scale(pulse,pulse);
  cx.fillStyle='#000000cc';   // outline backing
  cx.beginPath(); cx.moveTo(19,0); cx.lineTo(-10,-11); cx.lineTo(-4,0); cx.lineTo(-10,11); cx.closePath(); cx.fill();
  cx.fillStyle=col;
  cx.beginPath(); cx.moveTo(16,0); cx.lineTo(-8,-9); cx.lineTo(-3,0); cx.lineTo(-8,9); cx.closePath(); cx.fill();
  cx.restore();
}

// ---------- HUD ----------
function txt(s,x,y,size,col,align){
  cx.font=`bold ${size}px "Courier New",monospace`;
  cx.textAlign=align||'left'; cx.textBaseline='top';
  cx.fillStyle='#000'; cx.fillText(s,x+1,y+1);
  cx.fillStyle=col; cx.fillText(s,x,y);
}
function renderHUD(){
  const need=friendsNeeded(G.stage);
  cx.fillStyle='#000000bb'; cx.fillRect(0,0,VW,17);
  const narrow=VW<420;
  txt(narrow?`STAGE ${G.stage}`:`STAGE ${G.stage} · ${STAGE_NAMES[(G.stage-1)%STAGE_NAMES.length]}`,5,4,10,'#2de2e6');
  if(G.debug) txt('DEBUG', 5, VH-26, 8, '#ff6d00');
  if(world.final){
    txt(`CREW ${party.length}`, VW-5,4,10, party.length?'#39ff14':'#ff4f4f','right');
    const tl=Math.max(0,world.timer||0);
    txt(narrow?`BUS ${Math.ceil(tl)}s`:`BUS LEAVES: ${Math.ceil(tl)}s`, VW/2, 4, 10,
      tl<11 ? (Math.floor(G.t*4)%2?'#ff4f4f':'#fff') : '#f5d300', 'center');
  } else {
    const col= party.length>=need ? '#39ff14' : '#fff';
    txt(`FRIENDS ${party.length}/${need}`, VW-5,4,10,col,'right');
    if(party.length===0){ txt('ALONE!', VW/2, 4, 10, Math.floor(G.t*4)%2?'#ff4f4f':'#fff','center'); }
  }

  // active effects
  let ey=22;
  for(const id in effects){

    cx.fillStyle='#000000aa'; cx.fillRect(5,ey+10,64,4);

    ey+=19;
  }
  // PHONE SIGNAL — minimap with friends, totems, exit and you
  if(effects.signal){
    const mw=80, mh=Math.max(44,Math.round(mw*world.H/world.W));
    const mx=VW-mw-5, mY=22;
    cx.fillStyle='#000000cc'; cx.fillRect(mx,mY,mw,mh);

    const X=x=>mx+x/world.W*mw, Yy=y=>mY+y/world.H*mh;
    for(const t of world.totems) if(!t.taken){ cx.fillStyle=t.type.col; cx.fillRect(X(t.x)-1,Yy(t.y)-1,2,2); }
    if(Math.floor(G.t*4)%2){ cx.fillStyle='#39ff14';
      for(const f of world.friends) cx.fillRect(X(f.x)-1,Yy(f.y)-1,3,3); }
    if(exitGate){ cx.fillStyle='#f5d300'; cx.fillRect(X(exitGate.x)-2,Yy(exitGate.y)-2,4,4); }
    if(world.artcar){ cx.fillStyle='#ff8c2a'; cx.fillRect(X(world.artcar.x)-1,Yy(world.artcar.y)-1,3,3); }
    cx.fillStyle='#fff'; cx.fillRect(X(player.x)-1,Yy(player.y)-1,3,3);
    txt('PHONE SIGNAL', mx+mw/2, mY+mh+3, 7, '#b14aed','center');
  }

  // messages
  let my=30;
  for(const m of G.msgs){
    cx.globalAlpha=clamp(m.t,0,1);
    txt(m.txt, VW/2, my, 11, m.col,'center');
    cx.globalAlpha=1; my+=14;
  }
  if(G.paused){
    cx.fillStyle='#000000aa'; cx.fillRect(0,VH/2-30,VW,60);
    txt('PAUSED', VW/2, VH/2-22, 18, '#fff','center');
    txt('P RESUME · R RESTART RUN · Q QUIT TO GATES', VW/2, VH/2+6, 9, '#2de2e6','center');
  }
  if(TOUCH){
    // big steer buttons
    const r=btnRects();
    [['L',btnL,-1],['R',btnR,1]].forEach(([k,on,d])=>{
      const b=r[k];
      cx.fillStyle=on?'#ffffff3a':'#ffffff16'; cx.fillRect(b.x,b.y,b.w,b.h);
      cx.strokeStyle='#ffffff55'; cx.lineWidth=1; cx.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
      const cxm=b.x+b.w/2, cym=b.y+b.h/2;
      cx.fillStyle=on?'#ffffff':'#ffffffbb';
      cx.beginPath(); cx.moveTo(cxm+9*d,cym-14); cx.lineTo(cxm+9*d,cym+14); cx.lineTo(cxm-13*d,cym);
      cx.closePath(); cx.fill();
    });
  } else {
    cx.fillStyle='#00000099'; cx.fillRect(0,VH-15,VW,15);
    txt('STEER: ← → / A · D / MOUSE      M: MUTE      P: PAUSE', VW/2, VH-12, 9, '#ffffffcc','center');
  }
}

// ---------- screens ----------
function selLayout(){
  const cols = VW<420 ? 4 : 6;
  const gap  = Math.min(56, Math.floor((VW-44)/(cols-1)));
  return {cols, gap, x0:VW/2-(cols-1)*gap/2,
          rows:Math.ceil(CHARS.length/cols), y0:106, rowH:64};
}
function renderSelect(){
  // animated bg
  for(let i=0;i<40;i++){
    const h=hash2(i,7);
    const x=(h*VW + G.t*(10+h*30))%VW, y=(hash2(i,13)*VH);
    cx.fillStyle=['#39ff1422','#ff2d9522','#00e5ff22','#f5d30022'][i%4];
    cx.fillRect(x,y,3,3);
  }
  renderLasers(0.1);
  const hue=['#ff2d95','#2de2e6','#39ff14','#f5d300'][Math.floor(G.t*4)%4];
  txt('RAVE TRAIN', VW/2, 24, 32, hue, 'center');
  txt('find your friends · build your train · reach the next stage', VW/2, 60, VW<420?8:9, '#ffffffcc','center');

  // character grid — responsive: 6 columns landscape, 4 portrait
  const SL=selLayout();
  for(let i=0;i<CHARS.length;i++){
    const sel=i===G.charIdx;
    const bx=SL.x0+(i%SL.cols)*SL.gap, by=SL.y0+Math.floor(i/SL.cols)*SL.rowH;
    if(sel){
      cx.fillStyle='#ffffff18'; cx.fillRect(bx-21,by-40,42,48);
      cx.strokeStyle=CHARS[i].glow; cx.strokeRect(bx-21.5,by-40.5,43,49);
    }
    cx.save(); cx.translate(bx,by);
    cx.scale(sel?1.9:1.5, sel?1.9:1.5);
    drawRaver(cx,0,0,CHARS[i], sel?Math.floor(G.t*6)%2 : Math.floor(G.t*3+i)%2, {armsUp:sel,facing:'down'});
    cx.restore();
  }
  const ty=SL.y0+(SL.rows-1)*SL.rowH+42;
  txt(CHARS[G.charIdx].name, VW/2, ty, 13, CHARS[G.charIdx].glow,'center');
  txt(TOUCH?'TAP A RAVER TO CHOOSE':'← → ↑ ↓ CHOOSE YOUR RAVER', VW/2, ty+20, 9, '#fff','center');
  if(Math.floor(G.t*2)%2) txt(TOUCH?'TAP BELOW TO RAVE':'PRESS ENTER / CLICK TO RAVE', VW/2, ty+36, 11, '#39ff14','center');
  txt('walls & crowds scatter half your crew · alone + hit = game over', VW/2, VH-14, 8, '#ffffff99','center');
}

function renderCutscene(){
  const c=cutscene; if(!c) return;
  cx.fillStyle='#000000aa'; cx.fillRect(0,0,VW,VH);
  const n=c.dancers.length, gap=Math.min(34, (VW-60)/n), x0=VW/2-(n-1)*gap/2, yBase=VH/2+30;
  for(const d of c.dancers){
    let x=x0+d.i*gap, y=yBase, fr=0, o={};
    const p=c.phase, t=c.t;
    if(p===0){ x = lerp(-30-d.i*14, x0+d.i*gap, ease(clamp(t/1.0,0,1))); fr=Math.floor(G.t*8)%2; o.armsUp=false; o.facing='right'; }
    else if(p===1){ fr=Math.floor(G.t*6+d.i)%2; o.armsUp = fr===1; o.facing='down'; }
    else if(p===2){ const s=Math.floor((t*10+d.i))%4; o.facing=['down','right','up','left'][s]; fr=Math.floor(G.t*8)%2; o.armsUp=true; }
    else { // everyone scatters their own way to go get lost in the festival
      const dd=ease(clamp(t/0.9,0,1))*(VW*0.8+60);
      x = x0+d.i*gap + Math.cos(d.exitA)*dd;
      y = yBase + Math.sin(d.exitA)*dd;
      fr=Math.floor(G.t*10)%2; o.facing=dirFacing(d.exitA); o.armsUp=false;
    }
    cx.save(); cx.translate(Math.round(x),Math.round(y)); cx.scale(2.5,2.5);
    drawRaver(cx,0,0,d.pal,fr,o);
    cx.restore();
  }
  const label=['YOU MADE IT!','EVERYBODY DANCE!','EVERYBODY DANCE!','SEE YOU LATER!'][c.phase];
  txt(label, VW/2, 50, 12, '#2de2e6','center');
  txt(`STAGE ${G.stage} · ${STAGE_NAMES[(G.stage-1)%STAGE_NAMES.length]}`, VW/2, 30, 10, '#f5d300','center');
}

// the group chat — a pixel phone slides in from the right
function renderPhone(){
  if(!phone) return;
  cx.fillStyle='#00000055'; cx.fillRect(0,0,VW,VH);
  const pw=124, ph2=180;
  const tIn=ease(clamp(phone.t/0.4,0,1));
  const tOut=ease(clamp((phone.t-phone.dur)/0.4,0,1));
  const px=Math.round(VW - (pw+10)*tIn + (pw+24)*tOut);
  const py=Math.round((VH-ph2)/2);
  // bezel + screen
  cx.fillStyle='#16121f'; cx.fillRect(px-3,py-3,pw+6,ph2+6);
  cx.strokeStyle='#3a2f55'; cx.lineWidth=1; cx.strokeRect(px-3.5,py-3.5,pw+7,ph2+7);
  cx.fillStyle='#0b0f1a'; cx.fillRect(px,py,pw,ph2);
  cx.fillStyle='#444'; cx.fillRect(px+pw/2-8,py-2,16,1);   // speaker slot
  // status bar
  txt('23:58', px+5, py+3, 7, '#8899aa');
  cx.fillStyle='#39ff14'; cx.fillRect(px+pw-16,py+4,10,4);
  cx.fillStyle='#0b0f1a'; cx.fillRect(px+pw-9,py+5,2,2);
  // chat header
  cx.fillStyle='#1d2433'; cx.fillRect(px,py+12,pw,16);
  txt('RAVE FAM', px+pw/2, py+15, 9, '#2de2e6','center');
  txt(`${friendsNeeded(G.stage)} online`, px+pw/2, py+24, 6, '#39ff14aa','center');
  // bubble helper with ~17-char wrap
  const bubble=(s,by,dim)=>{
    const words=s.split(' '); const lines=[]; let cur='';
    for(const wd of words){ if((cur+' '+wd).trim().length>17){ lines.push(cur.trim()); cur=wd; } else cur+=' '+wd; }
    if(cur.trim()) lines.push(cur.trim());
    const bh=lines.length*9+6;
    cx.globalAlpha=dim?0.55:1;
    cx.fillStyle='#26304a'; cx.fillRect(px+6,by,pw-22,bh);
    cx.fillStyle='#9be7ff'; cx.fillRect(px+6,by,2,bh);
    lines.forEach((ln,k)=>txt(ln, px+12, by+3+k*9, 7, '#dde8ff'));
    cx.globalAlpha=1;
    return bh;
  };
  let by=py+34;
  // older messages — already in the chat when you open it
  for(const m of phone.history) by+=bubble(m,by,true)+4;
  // new messages beep in one by one
  for(let i=0;i<phone.msgs.length;i++){
    if(phone.t<PHONE_TIMES[i]){
      if(phone.t>PHONE_TIMES[i]-0.6){ // typing dots
        cx.fillStyle='#26304a'; cx.fillRect(px+6,by,26,11);
        const d=Math.floor(G.t*4)%3;
        for(let k=0;k<3;k++){ cx.fillStyle=k<=d?'#9be7ff':'#445'; cx.fillRect(px+12+k*6,by+4,3,3); }
      }
      break;
    }
    by+=bubble(phone.msgs[i],by,false)+5;
  }
  if(phone.t>PHONE_TIMES[1]+0.5 && Math.floor(G.t*2)%2)
    txt('SPACE / CLICK TO GO', px+pw/2, py+ph2-12, 7, '#39ff14','center');
}

function renderFlash(){
  const a=clamp(flashT/2.2,0,1);
  if(flashT>1.9){ cx.fillStyle='#ffffff'+Math.floor((flashT-1.9)/0.3*200).toString(16).padStart(2,'0'); cx.fillRect(0,0,VW,VH); }
  cx.fillStyle='#00000088'; cx.fillRect(0,VH/2-34,VW,68);
  const s=1+Math.sin(G.t*10)*0.04;
  cx.save(); cx.translate(VW/2,VH/2); cx.scale(s,s);
  if(world.final) txt('CATCH THE SHUTTLE!', 0, -14, 24, '#f5d300','center');
  else txt(`FIND ${friendsNeeded(G.stage)} FRIENDS!`, 0, -14, 24, '#39ff14','center');
  cx.restore();
  txt(STAGE_NAMES[(G.stage-1)%STAGE_NAMES.length], VW/2, VH/2+14, 10, '#2de2e6','center');
  cx.globalAlpha=1;
}

function renderGameOver(){
  cx.fillStyle='#000000cc'; cx.fillRect(0,0,VW,VH);
  const cy=VH/2;
  if(gameOverInfo && gameOverInfo.bus){
    txt('YOU MISSED', VW/2, cy-75, 22, '#ff4f4f','center');
    txt('THE BUS!', VW/2, cy-49, 22, '#ff4f4f','center');
    txt('the shuttle left without you...', VW/2, cy-15, 10, '#ffffffcc','center');
  } else {
    txt("YOU'VE LOST ALL", VW/2, cy-75, 22, '#ff4f4f','center');
    txt("YOUR FRIENDS!", VW/2, cy-49, 22, '#ff4f4f','center');
    if(gameOverInfo) txt(`you ${gameOverInfo.what} while flying solo`, VW/2, cy-15, 10, '#ffffffcc','center');
  }
  if(gameOverInfo) txt(`stages reached: ${gameOverInfo.stage}   friends found: ${gameOverInfo.total}`, VW/2, cy+5, 10, '#2de2e6','center');
  if(Math.floor(G.t*2)%2) txt(TOUCH?'TAP TO HEAD BACK TO THE GATES':'PRESS SPACE TO HEAD BACK TO THE GATES', VW/2, cy+45, 9, '#39ff14','center');
}

// ---------- victory: on the bus, off to the kick ons ----------
function renderWin(){
  cx.fillStyle='#07030f'; cx.fillRect(0,0,VW,VH);
  // stars
  for(let i=0;i<40;i++){ const h=hash2(i,3);
    cx.fillStyle=['#ffffff33','#2de2e633','#ff2d9533'][i%3];
    cx.fillRect(h*VW, hash2(i,9)*120, 2,2); }
  // road
  cx.fillStyle='#13101e'; cx.fillRect(0,VH/2+34,VW,60);
  cx.fillStyle='#f5d30055';
  for(let i=0;i<9;i++) cx.fillRect(((i*70 - winT*90)%(VW+70)+VW+70)%(VW+70)-35, VH/2+58, 32,3);
  // the bus, full of your crew, rolling off
  const bx=80+winT*34;
  cx.save(); cx.translate(Math.min(bx,VW+120), VH/2+44); cx.scale(1.8,1.8);
  drawBus(0,0);
  cx.restore();
  // crew silhouettes bouncing in the windows
  for(let i=0;i<Math.min(winCrew,4);i++){
    const wx=Math.min(bx,VW+120)-31+i*16, wy=VH/2+44-23*1.8+Math.sin(G.t*6+i)*1.5;
    cx.fillStyle=CHARS[i%CHARS.length].hair; cx.fillRect(wx,wy+18,6,4);
  }
  txt('YOU CAUGHT THE LAST SHUTTLE!', VW/2, VH/2-99, 18, '#39ff14','center');
  txt('kick ons at your hotel!!', VW/2, VH/2-73, 11, '#2de2e6','center');
  txt(`crew on the bus: ${winCrew}   friends found all night: ${G.totalCollected}`, VW/2, VH/2-49, 10, '#f5d300','center');
  txt('THANKS FOR RAVING', VW/2, VH/2+80, 9, '#ffffff88','center');
  if(Math.floor(G.t*2)%2) txt(TOUCH?'TAP FOR ONE MORE RAVE':'PRESS SPACE FOR ONE MORE RAVE', VW/2, VH/2+100, 10, '#fff','center');
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);


</script>
